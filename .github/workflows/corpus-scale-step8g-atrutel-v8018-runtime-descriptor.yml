name: Corpus Scale Step 8G Atrutel v8018 runtime descriptor bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-atrutel-v8018-runtime-descriptor.yml'
      - 'scripts/generate-step8g-atrutel-v8018-runtime-descriptor.mjs'
      - 'scripts/corpus-scale-step8g-atrutel-v8018-prewrite-core.mjs'
      - 'scripts/corpus-scale-step8g-ora-atrutel-1874-core.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-step8g-atrutel-v8018-runtime-descriptor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  descriptor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4
      - name: Checkout pinned Open Recipe Archive
        uses: actions/checkout@v4
        with:
          repository: AdamBouhmad/open-recipe-archive
          ref: ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
          path: open-recipe-archive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact v8018 runtime descriptor
        run: >-
          node scripts/generate-step8g-atrutel-v8018-runtime-descriptor.mjs
          --ora=./open-recipe-archive
          --out=.tmp/v8018-runtime-descriptor.mjs
      - name: Upload public-safe descriptor
        uses: actions/upload-artifact@v4
        with:
          name: step8g-v8018-runtime-descriptor-bootstrap
          path: .tmp/v8018-runtime-descriptor.mjs
          if-no-files-found: error
          retention-days: 7

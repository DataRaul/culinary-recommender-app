name: Ciqual B7 recipe-unlock discovery
on:
  push:
    branches: [v1-nutrition-b7-recipe-unlocks]
    paths:
      - scripts/ciqual-b7-unlock-targets.json
      - scripts/ciqual-b7-discover.mjs
      - .github/workflows/ciqual-b7-discovery.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download official Ciqual food catalogue
        run: curl -L --fail --retry 3 'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/OH8KXC' -o alim.xml
      - name: Verify official input checksum
        run: echo '8e1171d63cee4b6010cfce25dd29243d  alim.xml' | md5sum -c -
      - name: Discover bounded recipe-unlock candidates
        run: node scripts/ciqual-b7-discover.mjs alim.xml scripts/ciqual-b7-unlock-targets.json ciqual-b7-candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: ciqual-b7-recipe-unlock-candidates
          path: ciqual-b7-candidates.json
          retention-days: 1

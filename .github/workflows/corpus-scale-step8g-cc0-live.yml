name: Corpus Scale Step 8G CC0 v8003 live implementation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-cc0-live.yml'
      - 'data/generated/step8g/v8003-runtime-descriptor.mjs'
      - 'src/server/step8g-v8003-live-runtime.mjs'
      - 'src/server/step8g-v8003-hydration-runtime.mjs'
      - 'functions/api/step8g/v8003.js'
      - 'step8g-v8003-populate.html'
      - 'scripts/verify-step8g-v8003-live-payloads.mjs'
      - 'tests/step8g-v8003-live.test.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus-step8g-v8003-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-live-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4
      - name: Checkout pinned CC0 source
        uses: actions/checkout@v4
        with:
          repository: sylGauthier/recipes
          ref: b12e481d1c220a13e0847a34e148d5872a16928e
          path: cc0-recipes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v8003 live runtime tests
        run: node --test tests/step8g-v8003-live.test.js
      - name: Verify exact real-source body and route payload parity
        run: node scripts/verify-step8g-v8003-live-payloads.mjs --candidate=./cc0-recipes

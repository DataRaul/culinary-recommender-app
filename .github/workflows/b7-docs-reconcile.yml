name: Nutrition B7 docs reconciliation
on:
  push:
    branches: [v1-nutrition-b7-recipe-unlocks-v2]
    paths:
      - .github/workflows/b7-docs-reconcile.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-nutrition-b7-recipe-unlocks-v2
      - name: Reconcile final B7 state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f"missing anchor: {path}: {old[:80]}")
              p.write_text(t.replace(old,new,1))

          r('README.md','| Recipe corpus | 🟡 VALIDATED CANDIDATE / HUMAN ACCEPTANCE REQUIRED | V1.1 / Gate F | human public-corpus acceptance |','| Recipe corpus | ✅ COMPLETE / USER-ACCEPTED | V1.1 / Gate F | coverage-driven breadth under the same rights/provenance rules |')
          r('README.md','| Nutrition evidence | ✅ MULTI-SOURCE POLICY ACTIVE | V1.0.10 B6 COMPLETE | targeted composition + residual quantity gaps |','| Nutrition evidence | ✅ MULTI-SOURCE POLICY ACTIVE | V1.1.1 B7 COMPLETE | residual composition/form + exact quantity unlocks |')
          r('README.md','| European evidence | ✅ CONDITIONAL PRIMARY POLICY | Ciqual B4+B5 + Matvaretabellen B6 | recipe-level unlocks |','| European evidence | ✅ CONDITIONAL PRIMARY POLICY | Ciqual B4+B5+B7 + Matvaretabellen B6 | residual recipe-level unlocks |')
          r('README.md','**Recipe Corpus Gate F candidate:** 84 recipes = 76 curated + 8 exact-revision Wikibooks records / 83 dish families / 2 external Search-only + 6 reference-only','**Recipe Corpus Gate F:** COMPLETE / USER-ACCEPTED · 84 recipes = 76 curated + 8 exact-revision Wikibooks records / 83 dish families / 2 external Search-only + 6 reference-only')
          r('README.md','## Recipe Corpus Gate F candidate','## Recipe Corpus Gate F — accepted')
          r('README.md','The seven-role audit currently covers canonical/classic and regional/traditional across all eight records, with partial staple/everyday, constraint-first and technique-learning coverage. `contemporary_modern` and `genuinely_new_trending` remain explicit gaps. Gate F is not COMPLETE until human acceptance of the deployed public corpus.','The seven-role audit currently covers canonical/classic and regional/traditional across all eight records, with partial staple/everyday, constraint-first and technique-learning coverage. `contemporary_modern` and `genuinely_new_trending` remain explicit gaps. Gate F is **COMPLETE / USER-ACCEPTED** after the 2026-09-01 assistant-run acceptance checks and user continuation decision.')
          r('README.md','The frozen B4 tranche contains **32** manually reviewed ANSES-Ciqual 2025 food/form records. Nutrition B5 added a separate strict tranche of **22**, giving a combined bounded Ciqual composition ledger of **54** while preserving `evidenceTranche` provenance.','The frozen B4 tranche contains **32** manually reviewed ANSES-Ciqual 2025 food/form records. Nutrition B5 added a separate strict tranche of **22**. Nutrition B7 adds only **three** recipe-unlock records — raw quinoa, raw shrimp/prawn and dry regular pasta as a category-level orzo match — giving a combined bounded Ciqual composition ledger of **57** while preserving `evidenceTranche` provenance.')
          r('README.md','B5 deliberately rejects weak form matches including cumin seed for ground cumin, generic paprika for smoked paprika, unspecified tofu for firm tofu, cooked lentil forms for dry recipe quantities and egg-containing noodles for generic wheat noodles.','B5 deliberately rejects weak form matches including cumin seed for ground cumin, generic paprika for smoked paprika, unspecified tofu for firm tofu, cooked lentil forms for dry recipe quantities and egg-containing noodles for generic wheat noodles. B7 remains equally strict: barley, courgette, cottage cheese, salt, smoked paprika and tortilla stay deferred in this tranche rather than being filled by weak or underspecified matches.')
          r('README.md','PR #18 merged at `dee06f276f0323b5d359b8dc311ae23aac3b2d75`; post-merge validation run `33446325292` and Pages run `33446324922` both passed.','PR #18 merged at `dee06f276f0323b5d359b8dc311ae23aac3b2d75`; post-merge validation run `33446325292` and Pages run `33446324922` both passed.\n\nNutrition B7 targets composition by recipe-level unlock value rather than database size. Its strict three-record Ciqual tranche reduces the frozen **76-authored-recipe** missing-density blocker count from **141 to 133** while remaining **0 / 76 authoritative**. Unsupported-quantity blockers remain **27**, explicit ambiguous-portion blockers remain **20**, and mixed incompatible carbohydrate-semantic events remain **16**. The audit now separately exposes tracked nutrient-field gaps on otherwise usable ingredient rows. The eight external Gate F RecipeSource records remain a separate corpus lane and do not alter this authored baseline.')

          r('docs/DATA_SOURCES.md','The public runtime ships two explicitly separated recipe lanes: 76 project-authored structured recipes and a bounded eight-record English Wikibooks Gate F candidate.','The public runtime ships two explicitly separated recipe lanes: 76 project-authored structured recipes and a bounded eight-record English Wikibooks Gate F corpus accepted on 2026-09-01.')
          r('docs/DATA_SOURCES.md','### English Wikibooks Cookbook — Gate F candidate','### English Wikibooks Cookbook — Gate F accepted corpus')
          r('docs/DATA_SOURCES.md','The frozen historical B4 module contains **32 manually reviewed food/form identities**. Nutrition B5 / V1.0.9 added a separate **22-record** tranche without rewriting B4, giving **54** reviewed Ciqual composition records at runtime. Exact food code, English/French identity, scientific name where present, form-review notes, values, per-field confidence codes and source codes are retained. Runtime provenance records `evidenceTranche: "B4"` or `"B5"`.','The frozen historical B4 module contains **32 manually reviewed food/form identities**. Nutrition B5 / V1.0.9 added a separate **22-record** tranche without rewriting B4. Nutrition B7 / V1.1.1 adds a strict **3-record** recipe-unlock tranche — quinoa `9340`, shrimp/prawn `10021`, and dry regular pasta `9810` as a category-level orzo match — giving **57** reviewed Ciqual composition records at runtime. Exact food code, English/French identity, scientific name where present, form-review notes, values, per-field confidence codes and source codes are retained. Runtime provenance records `evidenceTranche: "B4"`, `"B5"` or `"B7"`.')
          r('docs/DATA_SOURCES.md','B5 deliberately leaves weak form matches unbundled, including cumin seed for ground cumin, generic paprika for smoked paprika, unspecified tofu for firm tofu, cooked lentil forms where recipes may mean dry and egg-containing noodles for a generic wheat-noodle identity.','B5 deliberately leaves weak form matches unbundled, including cumin seed for ground cumin, generic paprika for smoked paprika, unspecified tofu for firm tofu, cooked lentil forms where recipes may mean dry and egg-containing noodles for a generic wheat-noodle identity. B7 applies the same rule: barley, courgette, cottage cheese, salt, smoked paprika and tortilla remain deferred in the first unlock tranche. No weak candidate is promoted merely to reduce a blocker count.')
          r('docs/DATA_SOURCES.md','### B6 / V1.0.10 candidate','### B6 / V1.0.10 complete')
          r('docs/DATA_SOURCES.md',"The quantity evidence therefore resolves or truthfully reclassifies 175 of B5's 202 unsupported-quantity events without guessing. Composition and semantic gaps still prevent a complete authoritative recipe.","The quantity evidence therefore resolves or truthfully reclassifies 175 of B5's 202 unsupported-quantity events without guessing. Composition and semantic gaps still prevent a complete authoritative recipe.\n\n### B7 / V1.1.1 recipe-unlock composition\n\nB7 is deliberately bounded to three reviewed Ciqual forms selected for direct recipe-level value: raw quinoa (`9340`), raw shrimp/prawn (`10021`) and dry regular pasta (`9810`) as a transparent category-level match for canonical orzo/risoni. The official Ciqual 2025 source, Etalab licence, nutrient semantics, confidence codes and European-primary selection policy are unchanged.\n\nAgainst the frozen 76 authored recipes, B7 remains **0 / 76 authoritative** while reducing missing-density blockers from **141 to 133**. Unsupported quantity remains **27**, explicit ambiguous portions **20**, and mixed incompatible carbohydrate semantics **16**. Missing tracked nutrient fields are now reported separately from skipped ingredient blockers. Gate F's eight external recipes remain outside this authored baseline.")

          r('docs/GATES.md','PR #18 merged at `dee06f276f0323b5d359b8dc311ae23aac3b2d75`. Post-merge validation run `33446325292` and Pages deployment run `33446324922` both passed, so the B6 gate is terminally **COMPLETE**.\n\n## V1 Content Gate C — COMPLETE','PR #18 merged at `dee06f276f0323b5d359b8dc311ae23aac3b2d75`. Post-merge validation run `33446325292` and Pages deployment run `33446324922` both passed, so the B6 gate is terminally **COMPLETE**.\n\n## V1.1.1 Nutrition B7 — COMPLETE\n\nB7 adds exactly three manually reviewed ANSES-Ciqual 2025 composition forms for direct recipe-unlock value: raw quinoa (`9340`), raw shrimp/prawn (`10021`) and dry regular pasta (`9810`) as an explicit category-level orzo/risoni match. The bounded Ciqual ledger becomes **57 = B4 32 + B5 22 + B7 3**. Barley, courgette, cottage cheese, salt, smoked paprika and tortilla remain deferred.\n\nThe user-approved European-primary policy is unchanged: no averaging, no Ciqual `D` displacement of available USDA, stronger food-form evidence wins, exact provenance remains, and USDA carbohydrate-by-difference is not mixed with Ciqual `CHOAVL` into an authoritative total. Candidate run `33455005170` passed **100 / 100** deterministic tests, profile matrix, coverage reports, exact Wikibooks verification and all browser layers. The authored baseline remains **0 / 76 authoritative**, while missing-density blockers fall **141 → 133**; unsupported quantity stays 27, ambiguous portions 20, and mixed carbohydrate semantics 16. Missing nutrient fields are now separately audited. B7 introduces no runtime API, private KC dependency, bulk source dump or new human policy gate.\n\n## V1 Content Gate C — COMPLETE')
          r('docs/GATES.md','After Gate F human acceptance, the next ordinary nutrition work is coverage-driven: target the remaining composition/form blockers and residual exact quantity semantics that can unlock complete recipes, while preserving the carbohydrate semantic firewall and all source/licensing provenance.','After B7, the next ordinary nutrition work remains coverage-driven: target residual composition/form blockers, missing tracked nutrient fields and exact quantity semantics with the highest recipe-level unlock value, while preserving the carbohydrate semantic firewall and all source/licensing provenance.')

          r('docs/ROADMAP.md','| V1.x / Recipe-unlock evidence | PARALLEL NEXT | target remaining composition/form and exact quantity blockers by recipe-level unlock value; independent of Gate F corpus ingestion |','| V1.1.1 / Nutrition B7 | COMPLETE | strict Ciqual recipe-unlock tranche: quinoa + prawns + category-level dry-pasta/orzo; authored missing-density blockers 141→133; still 0/76 authoritative |\n| V1.x / Recipe-unlock evidence | NEXT | target residual composition/form, nutrient-field and exact quantity blockers by recipe-level unlock value; independent of external RecipeSource breadth |')
          r('docs/ROADMAP.md','PR #18 merged at `dee06f276f0323b5d359b8dc311ae23aac3b2d75`; post-merge validation run `33446325292` and Pages run `33446324922` both passed. B6 is therefore **COMPLETE**.\n\n## Culinary & Nutrition Brain P0 — authorized foundation and active Atlas development','PR #18 merged at `dee06f276f0323b5d359b8dc311ae23aac3b2d75`; post-merge validation run `33446325292` and Pages run `33446324922` both passed. B6 is therefore **COMPLETE**.\n\n## Nutrition B7 — complete\n\nB7 optimizes for recipe-level blocker reduction rather than source row count. Three strict ANSES-Ciqual 2025 forms are admitted: raw quinoa (`9340`), raw shrimp/prawn (`10021`) and dry regular pasta (`9810`) as a category-level orzo/risoni match. The combined bounded Ciqual ledger is now **57**. Candidate run `33455005170` passed 100/100 deterministic tests, profile matrix, coverage reports, exact Wikibooks verification and the full Chromium suite. The frozen authored baseline remains **0/76 authoritative**, while missing-density blockers fall **141 → 133**; unsupported quantity remains 27, ambiguous portions 20, and mixed carbohydrate semantics 16. Missing tracked nutrient fields are separately visible.\n\n## Culinary & Nutrition Brain P0 — authorized foundation and active Atlas development')
          r('docs/ROADMAP.md','3. **Recipe-unlock nutrition lane** — continue targeted composition/form/quantity work against the current 76 curated recipes and later admitted recipes; this does not need to wait for Gate F.','3. **Recipe-unlock nutrition lane** — B7 completed the first post-Gate-F composition tranche; continue targeting residual composition/form/nutrient-field/quantity blockers against the 76 curated-recipe baseline and separately admitted recipes by measured unlock value.')

          r('docs/TESTING.md','- truthful recipe-universe coverage reporting, including missing contemporary/modern and genuinely-new/trending roles rather than invented classifications.','- truthful recipe-universe coverage reporting, including missing contemporary/modern and genuinely-new/trending roles rather than invented classifications;\n- B7 exact three-record Ciqual provenance and explicit deferred-target assertions;\n- B7 regression proof for no averaging, no carbohydrate-semantic relaxation and no Ciqual-D-over-USDA displacement;\n- missing tracked nutrient fields audited separately from skipped density/quantity blockers.')
          r('docs/TESTING.md','The deterministic recipe-universe audit is expected to report 84 total recipes: 76 authored plus eight exact-revision Wikibooks records, 83 dish families, one explicit cross-source family, two Search-only external recipes and six reference-only external records. Unknown source-backed hard metadata stays unknown.\n\n## Browser acceptance','The deterministic recipe-universe audit is expected to report 84 total recipes: 76 authored plus eight exact-revision Wikibooks records, 83 dish families, one explicit cross-source family, two Search-only external recipes and six reference-only external records. Unknown source-backed hard metadata stays unknown.\n\n## Nutrition B7 checks\n\nCandidate run `33455005170` passed 100/100 Node tests, the 15,552-profile matrix, nutrition and recipe-universe reports, exact Wikibooks verification and all browser layers. The authored audit must remain **0/76 authoritative** and measures missing-density **141→133**, unsupported quantity **27**, ambiguous portions **20**, and mixed carbohydrate semantics **16**. Any apparent gain that needs guessed food forms, quantity conversions, missing nutrient values or carbohydrate equivalence fails closed.\n\n## Browser acceptance')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/DATA_SOURCES.md docs/GATES.md docs/ROADMAP.md docs/TESTING.md
          git commit -m "Document strict Nutrition B7 recipe-unlock evidence"
          git push origin HEAD:v1-nutrition-b7-recipe-unlocks-v2

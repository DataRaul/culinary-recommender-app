name: Nutrition B17 exact evidence acquisition

on:
  push:
    branches:
      - agent/nutrition-b17-exact-evidence-acquisition

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Fetch official Matvaretabellen 2026 API and inspect exact candidates
        run: |
          curl --fail --silent --show-error --retry 3 https://www.matvaretabellen.no/api/en/foods.json -o /tmp/matvaretabellen-foods.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/matvaretabellen-foods.json', 'utf8'));
          const foods = payload.foods || payload;
          const ids = ['06.702', '01.028', '05.233', '05.248', '05.381', '12.022'];
          const compact = food => ({
            foodId: food?.foodId || food?.id,
            foodName: food?.foodName,
            portions: food?.portions || [],
            energyKj: food?.energyKj ?? null,
            energyKcal: food?.energyKcal ?? null,
            constituents: food?.constituents || null,
            foodEx2: food?.foodEx2 || food?.foodex2 || null,
            facets: food?.facets || null
          });
          for (const id of ids) {
            console.log(`===EXACT_ID:${id}===`);
            console.log(JSON.stringify(compact(foods.find(f => (f.foodId || f.id) === id)), null, 2));
          }
          for (const term of ['garam', 'masala', 'smoked paprika', 'paprika', 'ground turkey', 'turkey mince', 'red onion']) {
            console.log(`===TERM:${term}===`);
            console.log(JSON.stringify(foods.filter(f => (f.foodName || '').toLowerCase().includes(term)).map(compact), null, 2));
          }
          NODE
      - name: Inspect exact authored target quantities and units
        run: |
          node --input-type=module <<'NODE'
          import { AUTHORED_RECIPES } from './src/data/corpus-v1.js';
          const targets = new Set(['tahini','garam_masala','smoked_paprika','lentils','turkey_mince','cottage_cheese','salt','tortilla','bulgur','red_onion']);
          const rows = [];
          for (const recipe of AUTHORED_RECIPES) {
            for (const ingredient of recipe.ingredients || []) {
              const ingredientId = ingredient.canonicalIngredientId || ingredient.ingredientId;
              if (targets.has(ingredientId)) rows.push({
                recipeId: recipe.id,
                ingredientId,
                quantity: ingredient.quantity ?? null,
                unit: ingredient.unit ?? null,
                sourceText: ingredient.sourceText ?? ingredient.label ?? ingredient.name ?? null
              });
            }
          }
          console.log('===AUTHORED_TARGET_INGREDIENTS===');
          console.log(JSON.stringify(rows, null, 2));
          NODE

name: One-off Ciqual 2025 B4 candidate discovery
on:
  push:
    branches: [v1-european-evidence-b4]
    paths:
      - '.github/workflows/ciqual-b4-package.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download official Ciqual 2025 food-list XML
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/alim.xml \
            'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/OH8KXC'
          test "$(stat -c%s /tmp/alim.xml)" -gt 1000000
      - name: Discover bounded canonical candidates
        run: node scripts/discover-ciqual-candidates.mjs /tmp/alim.xml scripts/ciqual-b4-targets.json /tmp/ciqual-b4-candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: ciqual-b4-candidate-discovery
          path: /tmp/ciqual-b4-candidates.json
          retention-days: 1

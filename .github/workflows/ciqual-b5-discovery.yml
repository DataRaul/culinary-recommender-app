name: Ciqual B5 discovery

on:
  push:
    branches:
      - v1-nutrition-b5-ciqual-coverage

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download official Ciqual food catalogue
        run: curl -L --fail --retry 3 'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/OH8KXC' -o alim_2025_11_03.xml
      - name: Verify official catalogue checksum
        run: echo '8e1171d63cee4b6010cfce25dd29243d  alim_2025_11_03.xml' | md5sum -c -
      - name: Discover bounded candidates
        run: node scripts/discover-ciqual-candidates.mjs alim_2025_11_03.xml scripts/ciqual-b5-discovery-targets.json ciqual-b5-candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: ciqual-b5-candidates
          path: ciqual-b5-candidates.json
          retention-days: 1

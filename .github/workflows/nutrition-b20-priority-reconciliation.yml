name: Nutrition B20 priority and candidate reconciliation

on:
  push:
    branches:
      - agent/nutrition-b20-priority-reconciliation

permissions:
  contents: read

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Add temporary B20 priority reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Regenerate merged B19 priorities
        run: |
          echo '===B20_PRIORITY_REPORT_BEGIN==='
          node scripts/report-nutrition-unlock-priorities.mjs
          echo '===B20_PRIORITY_REPORT_END==='
      - name: Inspect authored usage and recipe context for leading unresolved candidates
        run: |
          node --input-type=module <<'NODE'
          import { AUTHORED_RECIPES } from './src/data/corpus-v1.js';
          const targets = new Set(['smoked_paprika','lentils','turkey_mince','garam_masala','passata','red_onion','mint','salt','tortilla','chicken_thigh','barley','cod','feta','sardines','pumpkin','bread']);
          for (const target of targets) {
            const rows = [];
            for (const recipe of AUTHORED_RECIPES) {
              const ingredient = (recipe.ingredients || []).find(i => i.canonicalIngredientId === target);
              if (ingredient) rows.push({
                recipeId: recipe.id,
                title: recipe.title,
                ingredient,
                instructions: recipe.instructions.map(step => step.text)
              });
            }
            console.log(`===B20_USAGE_${target.toUpperCase()}===`);
            console.log(JSON.stringify(rows, null, 2));
          }
          NODE
      - name: Inspect ontology definitions for candidate identities
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const roots = ['src/data','src/domain'];
          const terms = ['smoked_paprika','lentils','turkey_mince','garam_masala','passata','red_onion','mint','salt','tortilla','chicken_thigh','barley','cod','feta','sardines','pumpkin','bread'];
          for (const root of roots) {
            for (const name of fs.readdirSync(root)) {
              const full = path.join(root, name);
              if (!fs.statSync(full).isFile() || !/\.(js|mjs|json)$/.test(name)) continue;
              const text = fs.readFileSync(full, 'utf8');
              for (const term of terms) {
                if (text.includes(term)) {
                  console.log(`===B20_ONTOLOGY_HIT ${term} ${full}===`);
                  const lines = text.split('\n');
                  lines.forEach((line, i) => {
                    if (line.includes(term)) console.log(`${i+1}: ${lines.slice(Math.max(0,i-3), Math.min(lines.length,i+5)).join('\n')}`);
                  });
                }
              }
            }
          }
          NODE
      - name: Query bounded official Matvaretabellen candidate rows
        run: |
          curl --fail --silent --show-error --retry 3 https://www.matvaretabellen.no/api/en/foods.json -o /tmp/matvaretabellen-foods.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/matvaretabellen-foods.json', 'utf8'));
          const foods = payload.foods || payload;
          const groups = {
            passata: ['passata','sieved tomato','tomato puree','tomato purée','tomato sauce'],
            red_onion: ['red onion','onion, red'],
            mint: ['mint'],
            salt: ['salt'],
            tortilla: ['tortilla'],
            chicken_thigh: ['chicken thigh','chicken, thigh'],
            barley: ['barley'],
            cod: ['cod'],
            feta: ['feta'],
            sardines: ['sardine'],
            pumpkin: ['pumpkin'],
            bread: ['bread']
          };
          for (const [target, terms] of Object.entries(groups)) {
            const matches = foods.filter(food => {
              const hay = `${food.foodName || ''} ${food.foodEx2 || ''}`.toLowerCase();
              return terms.some(term => hay.includes(term));
            }).slice(0, 100);
            console.log(`===B20_CANDIDATE_${target.toUpperCase()}===`);
            console.log(JSON.stringify(matches.map(food => ({
              foodId: food.foodId || food.id,
              foodName: food.foodName,
              latinName: food.latinName,
              foodEx2: food.foodEx2,
              calories: food.calories,
              energy: food.energy,
              portions: food.portions,
              constituents: (food.constituents || []).filter(c => ['Protein','Karbo','Fett','Fiber'].includes(c.nutrientId || c.constituentId || c.id) || ['Protein','Carbohydrate, available','Fat','Dietary fibre'].some(x => (c.nutrientName || c.constituentName || c.name || '').includes(x)))
            })), null, 2));
          }
          NODE

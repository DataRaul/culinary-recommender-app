name: Protected Corpus P4 real-20k product acceptance V1

on:
  pull_request:
    paths:
      - "config/protected_corpus_p4_real_20k_product_acceptance_v1.json"
      - "scripts/protected-corpus-p4-real-20k-core.mjs"
      - "scripts/run-protected-corpus-p4-real-20k-product-acceptance-v1.mjs"
      - "tests/protected-corpus-p4-real-20k-product-acceptance-v1.test.js"
      - "docs/PROTECTED_CORPUS_P4_REAL_20K_PRODUCT_ACCEPTANCE_V1.md"
      - "data/generated/protected-corpus-p4-real-20k-machine-baseline-v1.json"
      - "data/generated/protected-corpus-p1-live-owner-canary-v1.json"
      - "data/generated/protected-corpus-p2-live-alignment-v1.json"
      - "data/generated/culinary-brain-c4-real-v8018-failure-matrix-summary-v1.json"
      - "data/generated/culinary-brain-p3-tapioca-bounded-activation-summary-v1.json"
      - "src/data/corpus-v1.js"
      - "src/data/ingredients.js"
      - "config/corpus_normalization_baseline_v1.json"
      - "config/corpus_normalization_mapping_v1.json"
      - "config/nutrition_vitamin_applicability_audit_v1.json"
      - "scripts/run-corpus-normalization-mapping-v1.mjs"
      - "scripts/run-nutrition-vitamin-applicability-audit.mjs"
      - ".github/workflows/protected-corpus-p4-real-20k-product-acceptance-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4-machine-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run P4 contract and baseline tests
        run: node --test tests/protected-corpus-p4-real-20k-product-acceptance-v1.test.js

      - name: Checkout exact pinned UniTools
        run: |
          git clone --filter=blob:none https://github.com/farcrak/unitools-recipes.git .tmp/unitools
          git -C .tmp/unitools checkout --detach 1d09e9548d957dd0375301146a86dddf5e269c1b

      - name: Checkout exact pinned ForkRecipe
        run: |
          git clone --filter=blob:none https://github.com/futurechef/forkrecipe-recipes.git .tmp/forkrecipe
          git -C .tmp/forkrecipe checkout --detach c32255266af39bd77444d39452f3df8088ac8fd9

      - name: Checkout exact pinned CC0 recipes
        run: |
          git clone --filter=blob:none https://github.com/sylGauthier/recipes.git .tmp/cc0
          git -C .tmp/cc0 checkout --detach b12e481d1c220a13e0847a34e148d5872a16928e

      - name: Checkout exact pinned Open Recipe Archive
        run: |
          git clone --filter=blob:none https://github.com/AdamBouhmad/open-recipe-archive.git .tmp/ora
          git -C .tmp/ora checkout --detach ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8

      - name: Reconstruct exact current v8018 normalization mapping
        run: |
          node scripts/run-corpus-normalization-mapping-v1.mjs \
            --unitools=.tmp/unitools \
            --forkrecipe=.tmp/forkrecipe \
            --cc0=.tmp/cc0 \
            --ora=.tmp/ora \
            --output=.tmp/corpus-normalization-mapping-v1-full.json \
            --summary=.tmp/corpus-normalization-mapping-v1.json

      - name: Reconstruct exact current v8018 nutrition identity diagnostics
        run: |
          node scripts/run-nutrition-vitamin-applicability-audit.mjs \
            --unitools=.tmp/unitools \
            --forkrecipe=.tmp/forkrecipe \
            --cc0=.tmp/cc0 \
            --ora=.tmp/ora \
            --output=.tmp/nutrition-vitamin-applicability-audit-v1-full.json \
            --summary=.tmp/nutrition-vitamin-applicability-audit-v1.json

      - name: Build P4 machine product baseline
        run: |
          node scripts/run-protected-corpus-p4-real-20k-product-acceptance-v1.mjs \
            --contract=config/protected_corpus_p4_real_20k_product_acceptance_v1.json \
            --p1=data/generated/protected-corpus-p1-live-owner-canary-v1.json \
            --p2=data/generated/protected-corpus-p2-live-alignment-v1.json \
            --c4=data/generated/culinary-brain-c4-real-v8018-failure-matrix-summary-v1.json \
            --p3=data/generated/culinary-brain-p3-tapioca-bounded-activation-summary-v1.json \
            --mapping=.tmp/corpus-normalization-mapping-v1-full.json \
            --nutrition=.tmp/nutrition-vitamin-applicability-audit-v1-full.json \
            --output=.tmp/protected-corpus-p4-real-20k-machine-baseline-v1.json

      - name: Verify committed P4 baseline is reproducible
        run: cmp .tmp/protected-corpus-p4-real-20k-machine-baseline-v1.json data/generated/protected-corpus-p4-real-20k-machine-baseline-v1.json

      - name: Upload P4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: protected-corpus-p4-real-20k-machine-baseline-v1
          path: |
            .tmp/corpus-normalization-mapping-v1.json
            .tmp/nutrition-vitamin-applicability-audit-v1.json
            .tmp/protected-corpus-p4-real-20k-machine-baseline-v1.json
          if-no-files-found: error

name: Step 8D terminal closeout freeze

on:
  push:
    branches: [agent/step8d-terminal-closeout]
    paths:
      - ".github/workflows/step8d-terminal-closeout-freeze.yml"

permissions:
  contents: write

jobs:
  freeze-terminal-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step8d-terminal-closeout
      - name: Apply frozen Step 8D terminal closeout
        run: |
          set -euo pipefail
          python3 scripts/step8d-terminal-closeout-freeze.py
          git diff --check
          grep -q 'STEP_8D_PROTECTED_POPULATION_PASS' data/generated/corpus-scale-step8d-live-pass.json
          grep -q 'READY_RECOMMENDATION_ELIGIBILITY_REVIEW' config/corpus_scale_step8_roadmap.json
          grep -q 'READY_CONTINUED_PROTECTED_SCALE_LOOP' config/corpus_scale_step8_roadmap.json
          grep -q 'max_observed_d1_subqueries' docs/handovers/CURRENT.json
      - name: Commit terminal closeout
        run: |
          set -euo pipefail
          rm .github/workflows/step8d-terminal-closeout-freeze.yml
          rm scripts/step8d-terminal-closeout-freeze.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close Step 8D terminal population pass"
          git push origin HEAD:agent/step8d-terminal-closeout

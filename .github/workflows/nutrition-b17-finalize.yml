name: Nutrition B17 finalize

on:
  push:
    branches:
      - agent/nutrition-b17-tahini-exact-portion-unlock

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Apply bounded B17 integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new)

          # Runtime portion routing.
          path = Path('src/domain/nutrition.js')
          s = path.read_text()
          s = replace_once(s, '''import {\n  MATVARETABELLEN_PORTION_SOURCE_B15,\n  matvaretabellenPortionConversionB15\n} from "../data/matvaretabellen-portions-b15.js";\n''', '''import {\n  MATVARETABELLEN_PORTION_SOURCE_B15,\n  matvaretabellenPortionConversionB15\n} from "../data/matvaretabellen-portions-b15.js";\nimport {\n  MATVARETABELLEN_PORTION_SOURCE_B17,\n  matvaretabellenPortionConversionB17\n} from "../data/matvaretabellen-portions-b17.js";\n''', 'B17 import')

          needle = '''  const usdaAmbiguous = usdaFoundationAmbiguousPortion(ingredientId, unit);\n'''
          block = '''  const matvaretabellenPortionB17 = matvaretabellenPortionConversionB17(ingredientId, unit);\n  if (matvaretabellenPortionB17) {\n    return {\n      grams: quantity * matvaretabellenPortionB17.gramsPerUnit,\n      reason: null,\n      quantityEvidence: {\n        state: matvaretabellenPortionB17.evidenceState,\n        sourceId: MATVARETABELLEN_PORTION_SOURCE_B17.id,\n        evidenceTranche: matvaretabellenPortionB17.evidenceTranche,\n        inputUnit: unit,\n        gramsPerUnit: matvaretabellenPortionB17.gramsPerUnit,\n        sourceUnit: matvaretabellenPortionB17.sourcePortionName,\n        sourcePortionId: matvaretabellenPortionB17.sourcePortionId,\n        sourcePortionUnit: matvaretabellenPortionB17.sourcePortionUnit,\n        foodId: matvaretabellenPortionB17.foodId,\n        foodName: matvaretabellenPortionB17.foodName\n      }\n    };\n  }\n\n'''
          s = replace_once(s, needle, block + needle, 'B17 routing')
          s = replace_once(s, '''portionSources: [USDA_FOUNDATION_PORTION_SOURCE, MATVARETABELLEN_PORTION_SOURCE_B6, MATVARETABELLEN_PORTION_SOURCE_B15, USDA_SR_LEGACY_PORTION_SOURCE_B8],''', '''portionSources: [USDA_FOUNDATION_PORTION_SOURCE, MATVARETABELLEN_PORTION_SOURCE_B6, MATVARETABELLEN_PORTION_SOURCE_B15, MATVARETABELLEN_PORTION_SOURCE_B17, USDA_SR_LEGACY_PORTION_SOURCE_B8],''', 'B17 public portion sources')
          path.write_text(s)

          # Existing cross-source public-evidence contract.
          path = Path('tests/european-portion-evidence.test.js')
          s = path.read_text()
          s = replace_once(s, '''import { MATVARETABELLEN_PORTION_SOURCE_B15 } from "../src/data/matvaretabellen-portions-b15.js";\n''', '''import { MATVARETABELLEN_PORTION_SOURCE_B15 } from "../src/data/matvaretabellen-portions-b15.js";\nimport { MATVARETABELLEN_PORTION_SOURCE_B17 } from "../src/data/matvaretabellen-portions-b17.js";\n''', 'B17 public-evidence import')
          old = '''  assert.equal(estimate.evidence.portionSources.length, 4);\n  assert.equal(estimate.evidence.portionSources[1].id, MATVARETABELLEN_PORTION_SOURCE_B6.id);\n  assert.equal(estimate.evidence.portionSources[2].id, MATVARETABELLEN_PORTION_SOURCE_B15.id);\n  assert.equal(estimate.evidence.portionSources[3].id, USDA_SR_LEGACY_PORTION_SOURCE_B8.id);\n  assert.equal(USDA_SR_LEGACY_PORTION_SOURCE_B8.compositionUse, "PROHIBITED_IN_THIS_TRANCHE");\n  assert.equal(estimate.evidence.sources.some(source => source.id === MATVARETABELLEN_PORTION_SOURCE_B15.id), false);\n  assert.equal(estimate.evidence.sources.some(source => source.id === USDA_SR_LEGACY_PORTION_SOURCE_B8.id), false);'''
          new = '''  assert.equal(estimate.evidence.portionSources.length, 5);\n  assert.equal(estimate.evidence.portionSources[1].id, MATVARETABELLEN_PORTION_SOURCE_B6.id);\n  assert.equal(estimate.evidence.portionSources[2].id, MATVARETABELLEN_PORTION_SOURCE_B15.id);\n  assert.equal(estimate.evidence.portionSources[3].id, MATVARETABELLEN_PORTION_SOURCE_B17.id);\n  assert.equal(estimate.evidence.portionSources[4].id, USDA_SR_LEGACY_PORTION_SOURCE_B8.id);\n  assert.equal(USDA_SR_LEGACY_PORTION_SOURCE_B8.compositionUse, "PROHIBITED_IN_THIS_TRANCHE");\n  assert.equal(MATVARETABELLEN_PORTION_SOURCE_B17.compositionUse, "PROHIBITED_IN_THIS_TRANCHE");\n  assert.equal(estimate.evidence.sources.some(source => source.id === MATVARETABELLEN_PORTION_SOURCE_B15.id), false);\n  assert.equal(estimate.evidence.sources.some(source => source.id === MATVARETABELLEN_PORTION_SOURCE_B17.id), false);\n  assert.equal(estimate.evidence.sources.some(source => source.id === USDA_SR_LEGACY_PORTION_SOURCE_B8.id), false);'''
          s = replace_once(s, old, new, 'B17 public-evidence assertions')
          path.write_text(s)

          # Measured authored-corpus truth from diagnostic run 33678100590.
          path = Path('tests/nutrition-coverage-audit.test.js')
          s = path.read_text()
          old_test = '''test("B16 exact tahini composition resolves identity while remaining fail-closed on unsupported tahini quantities", () => {\n  const audit = buildNutritionCoverageAudit(AUTHORED_RECIPES, publicNutritionSource);\n  assert.equal(audit.recipeCount, 76);\n  assert.equal(audit.authoritativeRecipeCount, 12);\n  assert.equal(audit.estimateRecipeCount, 64);\n  assert.deepEqual(audit.authoritativeRecipeIds, [\n    "indian_chicken_spinach_curry",\n    "indian_chickpea_cauliflower_curry",\n    "indian_red_lentil_spinach_dal",\n    "indian_turmeric_chicken_pea_rice",\n    "italian_mushroom_pea_orzo",\n    "italian_red_lentil_pasta",\n    "med_chicken_orzo_vegetables",\n    "med_lemon_chicken_couscous",\n    "med_prawn_tomato_couscous",\n    "med_quinoa_chickpea_bowl",\n    "med_quinoa_egg_spinach_bowl",\n    "middle_eastern_red_lentil_carrot_soup"\n  ]);\n  assert.deepEqual(audit.blockerCounts, {\n    ambiguous_portion_unit: 20,\n    missing_density: 99,\n    unsupported_quantity_unit: 10\n  });\n  assert.deepEqual(audit.missingNutrientFieldCounts, {\n    carbohydrateG: 9,\n    energyKcal: 5,\n    fatG: 18,\n    fibreG: 11\n  });\n  assert.deepEqual(audit.semanticIssueCounts, {\n    mixed_incompatible_carbohydrate_semantics: 16\n  });\n});'''
          new_test = '''test("B17 exact tahini tablespoon evidence unlocks only source-backed authored tahini recipes", () => {\n  const audit = buildNutritionCoverageAudit(AUTHORED_RECIPES, publicNutritionSource);\n  assert.equal(audit.recipeCount, 76);\n  assert.equal(audit.authoritativeRecipeCount, 14);\n  assert.equal(audit.estimateRecipeCount, 62);\n  assert.deepEqual(audit.authoritativeRecipeIds, [\n    "indian_chicken_spinach_curry",\n    "indian_chickpea_cauliflower_curry",\n    "indian_red_lentil_spinach_dal",\n    "indian_turmeric_chicken_pea_rice",\n    "italian_mushroom_pea_orzo",\n    "italian_red_lentil_pasta",\n    "med_chicken_orzo_vegetables",\n    "med_lemon_chicken_couscous",\n    "med_prawn_tomato_couscous",\n    "med_quinoa_chickpea_bowl",\n    "med_quinoa_egg_spinach_bowl",\n    "middle_eastern_chicken_tahini_bowl",\n    "middle_eastern_chickpea_tahini_plate",\n    "middle_eastern_red_lentil_carrot_soup"\n  ]);\n  assert.deepEqual(audit.blockerCounts, {\n    ambiguous_portion_unit: 20,\n    missing_density: 99,\n    unsupported_quantity_unit: 7\n  });\n  assert.deepEqual(audit.missingNutrientFieldCounts, {\n    carbohydrateG: 9,\n    energyKcal: 5,\n    fatG: 18,\n    fibreG: 11\n  });\n  assert.deepEqual(audit.semanticIssueCounts, {\n    mixed_incompatible_carbohydrate_semantics: 16\n  });\n});'''
          s = replace_once(s, old_test, new_test, 'B17 measured audit')
          path.write_text(s)

          # Governance ledger: keep B16 composition and B17 portion roles independent.
          path = Path('scripts/nutrition-unlock-reviewed-decisions-v1.json')
          decisions = json.loads(path.read_text())
          decisions['decisions']['tahini']['quantityState'] = 'EXACT_B17_TBSP_PORTION_EVIDENCE_AVAILABLE'
          decisions['portionEvidenceDecisions']['tahini'] = {
              'decision': 'ADMIT_EXACT_MATVARETABELLEN_2026_B17_PORTION',
              'candidateClass': 'PORTION_EVIDENCE',
              'sourceId': 'matvaretabellen-2026-portions-b17',
              'foodId': '06.702',
              'foodName': 'Sesame paste, tahini',
              'sourcePortionId': 'spiseskje',
              'publishedPortion': 'tablespoon',
              'sourcePortionUnit': 'stk',
              'sourceQuantity': 16,
              'sourceUnit': 'g',
              'acceptedCanonicalUnits': ['tbsp'],
              'gramsPerUnit': 16,
              'boundary': "B17 uses only the official food 06.702 source row id 'spiseskje': tablespoon = 16 g for canonical tahini. The same food's separate 'For a slice of bread' = 15 g row is not interchangeable. No teaspoon conversion, generic sesame-butter mapping, tahini-sauce mapping or household arithmetic is authorized.",
              'roleSeparation': 'B17 is portion evidence only. B16 independently supplies exact composition evidence for canonical tahini.',
              'runtimeChange': True
          }
          path.write_text(json.dumps(decisions, indent=2, ensure_ascii=False) + '\n')

          # Licensing/source-role notice.
          path = Path('THIRD_PARTY_NOTICES.md')
          s = path.read_text()
          s = replace_once(s, 'B6 and B15 are separate bounded portion-evidence roles.', 'B6, B15 and B17 are separate bounded portion-evidence roles.', 'B17 notice role')
          path.write_text(s)
          PY

          cat > tests/matvaretabellen-portions-b17.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import {
            MATVARETABELLEN_PORTION_EVIDENCE_B17,
            MATVARETABELLEN_PORTION_SOURCE_B17,
            matvaretabellenPortionConversionB17
          } from "../src/data/matvaretabellen-portions-b17.js";
          import { MATVARETABELLEN_COMPOSITION_SOURCE_B16 } from "../src/data/matvaretabellen-composition-b16.js";
          import { EUROPEAN_PRIMARY_DENSITIES_V1 } from "../src/domain/nutrition-source-policy.js";
          import { calculatePerServingFromDensities } from "../src/domain/nutrition.js";

          test("B17 is a separate bounded NLOD portion-only source", () => {
            assert.equal(MATVARETABELLEN_PORTION_SOURCE_B17.id, "matvaretabellen-2026-portions-b17");
            assert.equal(MATVARETABELLEN_PORTION_SOURCE_B17.authority, "Norwegian Food Safety Authority (Mattilsynet)");
            assert.equal(MATVARETABELLEN_PORTION_SOURCE_B17.dataset, "Norwegian Food Composition Table 2026");
            assert.match(MATVARETABELLEN_PORTION_SOURCE_B17.licence, /NLOD 2\.0/);
            assert.equal(MATVARETABELLEN_PORTION_SOURCE_B17.evidenceTranche, "B17");
            assert.equal(MATVARETABELLEN_PORTION_SOURCE_B17.role, "PORTION_EVIDENCE_ONLY");
            assert.equal(MATVARETABELLEN_PORTION_SOURCE_B17.compositionUse, "PROHIBITED_IN_THIS_TRANCHE");
            assert.equal(MATVARETABELLEN_PORTION_SOURCE_B17.runtimeFetch, false);
            assert.notEqual(MATVARETABELLEN_PORTION_SOURCE_B17.id, MATVARETABELLEN_COMPOSITION_SOURCE_B16.id);
          });

          test("B17 preserves the exact official tahini tablespoon source row", () => {
            assert.deepEqual(Object.keys(MATVARETABELLEN_PORTION_EVIDENCE_B17), ["tahini"]);
            const record = MATVARETABELLEN_PORTION_EVIDENCE_B17.tahini;
            assert.equal(record.foodId, "06.702");
            assert.equal(record.foodName, "Sesame paste, tahini");
            assert.equal(record.sourcePortionId, "spiseskje");
            assert.equal(record.sourcePortionName, "tablespoon");
            assert.equal(record.sourcePortionUnit, "stk");
            assert.equal(record.sourceQuantity, 16);
            assert.equal(record.sourceUnit, "g");
            assert.equal(record.gramsPerUnit, 16);
            assert.deepEqual(record.units, ["tbsp"]);
          });

          test("B17 accepts only canonical tahini tbsp and never infers neighboring identities or units", () => {
            assert.equal(matvaretabellenPortionConversionB17("tahini", "tbsp")?.gramsPerUnit, 16);
            for (const unsupported of ["tsp", "tablespoon", "slice", "piece"]) {
              assert.equal(matvaretabellenPortionConversionB17("tahini", unsupported), null, unsupported);
            }
            for (const unsupportedIdentity of ["sesame", "sesame_seeds", "sesame_butter", "tahini_sauce", "tahini_dressing"]) {
              assert.equal(matvaretabellenPortionConversionB17(unsupportedIdentity, "tbsp"), null, unsupportedIdentity);
            }
          });

          test("runtime resolves exact tahini tablespoons to grams with B17 provenance", () => {
            const result = calculatePerServingFromDensities({
              ingredients: [{ canonicalIngredientId: "tahini", quantity: 2, unit: "tbsp" }],
              serving: { servings: 1 }
            }, EUROPEAN_PRIMARY_DENSITIES_V1);
            assert.equal(result.complete, true);
            assert.equal(result.used[0].grams, 32);
            assert.equal(result.used[0].quantityEvidence.sourceId, MATVARETABELLEN_PORTION_SOURCE_B17.id);
            assert.equal(result.used[0].quantityEvidence.evidenceTranche, "B17");
            assert.equal(result.used[0].quantityEvidence.sourcePortionId, "spiseskje");
            assert.equal(result.used[0].quantityEvidence.sourcePortionUnit, "stk");
            assert.equal(result.used[0].quantityEvidence.gramsPerUnit, 16);
            assert.equal(result.used[0].quantityEvidence.foodId, "06.702");
          });

          test("B17 does not silently turn the separate 15 g bread-spread row into a household conversion", () => {
            const result = calculatePerServingFromDensities({
              ingredients: [{ canonicalIngredientId: "tahini", quantity: 1, unit: "slice" }],
              serving: { servings: 1 }
            }, EUROPEAN_PRIMARY_DENSITIES_V1);
            assert.equal(result.complete, false);
            assert.equal(result.skipped[0].reason, "unsupported_quantity_unit");
          });
          EOF

          rm .github/workflows/nutrition-b17-diagnostic.yml
          rm .github/workflows/nutrition-b17-finalize.yml

      - name: Run focused B17 and coverage tests
        run: node --test tests/matvaretabellen-portions-b17.test.js tests/european-portion-evidence.test.js tests/nutrition-coverage-audit.test.js
      - name: Run static checks
        run: npm run check
      - name: Commit bounded B17 implementation
        run: |
          git config user.name "Raul M."
          git config user.email "67912886+DataRaul@users.noreply.github.com"
          git add src/data/matvaretabellen-portions-b17.js src/domain/nutrition.js tests/matvaretabellen-portions-b17.test.js tests/european-portion-evidence.test.js tests/nutrition-coverage-audit.test.js scripts/nutrition-unlock-reviewed-decisions-v1.json THIRD_PARTY_NOTICES.md .github/workflows
          git commit -m "Complete exact B17 tahini tablespoon evidence"
          git push origin HEAD:agent/nutrition-b17-tahini-exact-portion-unlock

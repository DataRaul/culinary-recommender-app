name: Nutrition B17 diagnostic

on:
  push:
    branches:
      - agent/nutrition-b17-tahini-exact-portion-unlock

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Patch B17 portion routing in diagnostic working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/domain/nutrition.js')
          s = p.read_text()
          def rep(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'expected one match, found {s.count(old)}: {old[:100]!r}')
              s = s.replace(old, new)

          rep('''import {\n  MATVARETABELLEN_PORTION_SOURCE_B15,\n  matvaretabellenPortionConversionB15\n} from "../data/matvaretabellen-portions-b15.js";\n''', '''import {\n  MATVARETABELLEN_PORTION_SOURCE_B15,\n  matvaretabellenPortionConversionB15\n} from "../data/matvaretabellen-portions-b15.js";\nimport {\n  MATVARETABELLEN_PORTION_SOURCE_B17,\n  matvaretabellenPortionConversionB17\n} from "../data/matvaretabellen-portions-b17.js";\n''')

          needle = '''  const usdaAmbiguous = usdaFoundationAmbiguousPortion(ingredientId, unit);\n'''
          block = '''  const matvaretabellenPortionB17 = matvaretabellenPortionConversionB17(ingredientId, unit);\n  if (matvaretabellenPortionB17) {\n    return {\n      grams: quantity * matvaretabellenPortionB17.gramsPerUnit,\n      reason: null,\n      quantityEvidence: {\n        state: matvaretabellenPortionB17.evidenceState,\n        sourceId: MATVARETABELLEN_PORTION_SOURCE_B17.id,\n        evidenceTranche: matvaretabellenPortionB17.evidenceTranche,\n        inputUnit: unit,\n        gramsPerUnit: matvaretabellenPortionB17.gramsPerUnit,\n        sourceUnit: matvaretabellenPortionB17.sourcePortionName,\n        sourcePortionId: matvaretabellenPortionB17.sourcePortionId,\n        sourcePortionUnit: matvaretabellenPortionB17.sourcePortionUnit,\n        foodId: matvaretabellenPortionB17.foodId,\n        foodName: matvaretabellenPortionB17.foodName\n      }\n    };\n  }\n\n'''
          rep(needle, block + needle)
          p.write_text(s)
          PY
      - name: Generate B17 measured state
        run: |
          echo '===B17_REPORT_BEGIN==='
          node scripts/report-nutrition-unlock-priorities.mjs
          echo '===B17_REPORT_END==='

name: Nutrition B13 diagnostic

on:
  push:
    branches:
      - agent/nutrition-b13-tomato-fat-completion
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --test tests/matvaretabellen-composition-b13.test.js
      - run: node scripts/report-nutrition-unlock-priorities.mjs
      - name: Print authoritative recipe IDs
        run: >-
          node --input-type=module -e 'import { AUTHORED_RECIPES } from "./src/data/corpus-v1.js"; import { publicNutritionSource } from "./src/domain/nutrition.js"; import { buildNutritionCoverageAudit } from "./src/domain/nutrition-coverage-audit.js"; const a=buildNutritionCoverageAudit(AUTHORED_RECIPES, publicNutritionSource); console.log(JSON.stringify({authoritativeRecipeCount:a.authoritativeRecipeCount, authoritativeRecipeIds:a.authoritativeRecipeIds, estimateRecipeCount:a.estimateRecipeCount, blockerCounts:a.blockerCounts, missingNutrientFieldCounts:a.missingNutrientFieldCounts, semanticIssueCounts:a.semanticIssueCounts}, null, 2));'

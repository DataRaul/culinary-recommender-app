name: Corpus Scale Step 8G ORA Turabi Efendi 1864 measurement

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-ora-turabi.yml'
      - 'scripts/corpus-scale-step8g-ora-turabi-core.mjs'
      - 'scripts/run-corpus-scale-step8g-ora-turabi.mjs'
      - 'tests/corpus-scale-step8g-ora-turabi.test.js'
      - 'docs/CORPUS_SCALE_STEP8G_ORA_TURABI_1864_RIGHTS_AND_MEASUREMENT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-step8g-ora-turabi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure-ora-turabi-1864:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4

      - name: Checkout pinned Open Recipe Archive candidate and ORA baselines
        uses: actions/checkout@v4
        with:
          repository: AdamBouhmad/open-recipe-archive
          ref: ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
          path: open-recipe-archive

      - name: Checkout pinned ForkRecipe protected baseline
        uses: actions/checkout@v4
        with:
          repository: futurechef/forkrecipe-recipes
          ref: c32255266af39bd77444d39452f3df8088ac8fd9
          path: forkrecipe

      - name: Checkout pinned UniTools protected baseline
        uses: actions/checkout@v4
        with:
          repository: farcrak/unitools-recipes
          ref: 1d09e9548d957dd0375301146a86dddf5e269c1b
          path: unitools

      - name: Checkout pinned CC0 protected baseline
        uses: actions/checkout@v4
        with:
          repository: sylGauthier/recipes
          ref: b12e481d1c220a13e0847a34e148d5872a16928e
          path: cc0-recipes

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic Turabi measurement gate unit tests
        run: node --test tests/corpus-scale-step8g-ora-turabi.test.js

      - name: Measure exact 442-row cohort against active v8005
        run: >-
          node scripts/run-corpus-scale-step8g-ora-turabi.mjs
          --ora=./open-recipe-archive
          --forkrecipe=./forkrecipe
          --unitools=./unitools
          --cc0=./cc0-recipes
          --rights-doc=./docs/CORPUS_SCALE_STEP8G_ORA_TURABI_1864_RIGHTS_AND_MEASUREMENT.md
          --out=.tmp/step8g-ora-turabi-measurement

      - name: Verify measurement remained no-write and v8005-based
        run: >-
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(".tmp/step8g-ora-turabi-measurement/measurement.json","utf8"));
          if(p.baseline.protectedComposedRecipeCount!==2464||p.baseline.expectedActiveProtectedVersion!=="v8005")process.exit(1);
          if(p.boundaries.liveD1WritesAuthorized!==false||p.boundaries.protectedPopulationAuthorized!==false||p.boundaries.publicRuntimeChangeAuthorized!==false||p.boundaries.thirdShardAuthorized!==false||p.boundaries.d1BudgetExpansionAuthorized!==false||p.boundaries.billingExpansionAuthorized!==false)process.exit(1);
          console.log(p.terminal);'

      - name: Upload Step 8G Turabi measurement evidence
        uses: actions/upload-artifact@v4
        with:
          name: step8g-ora-turabi-1864-measurement
          path: .tmp/step8g-ora-turabi-measurement/measurement.json
          if-no-files-found: error
          retention-days: 30

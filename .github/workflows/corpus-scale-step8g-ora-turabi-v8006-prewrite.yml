name: Corpus Scale Step 8G Turabi v8006 prewrite

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-ora-turabi-v8006-prewrite.yml'
      - 'scripts/corpus-scale-step8g-ora-turabi-v8006-prewrite-core.mjs'
      - 'scripts/run-corpus-scale-step8g-ora-turabi-v8006-prewrite.mjs'
      - 'scripts/verify-step8g-ora-turabi-v8006-prewrite.mjs'
      - 'scripts/finalize-step8g-ora-turabi-v8006-prewrite.mjs'
      - 'tests/corpus-scale-step8g-ora-turabi-v8006-prewrite.test.js'
      - 'tests/corpus-scale-step8g-v8006-prewrite-closeout.test.js'
      - 'data/generated/step8g/ora-turabi-1864-measurement.json'
      - 'data/generated/step8g/ora-turabi-v8006-prewrite-evidence.json'
      - 'data/generated/step8g/ora-turabi-v8006-prewrite-validation.json'
      - 'data/generated/step8g/ora-bosse-watanna-v8005-prewrite-evidence.json'
      - 'data/generated/step8g/ora-bosse-watanna-v8005-live-pass.json'
      - 'data/generated/step8g/v8005-runtime-descriptor.mjs'
      - 'docs/CORPUS_SCALE_STEP8G_ORA_TURABI_V8006_PREWRITE.md'
      - 'config/corpus_scale_step8_roadmap.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-step8g-turabi-v8006-prewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prewrite-v8006:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4

      - name: Checkout pinned Open Recipe Archive source
        uses: actions/checkout@v4
        with:
          repository: AdamBouhmad/open-recipe-archive
          ref: ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
          path: open-recipe-archive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect whether canonical state is still at the v8005 baseline
        id: canonical-baseline
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { appendFile } from 'node:fs/promises';
          const roadmap = JSON.parse(await readFile('config/corpus_scale_step8_roadmap.json', 'utf8'));
          const step8g = roadmap.gates.find(gate => gate.id === '8G');
          const liveV8005 = step8g?.latestIteration?.layerVersion === 'v8005';
          await appendFile(process.env.GITHUB_OUTPUT, `live_v8005=${liveV8005 ? 'true' : 'false'}\n`);
          console.log(`canonical baseline requires v8005 finalization: ${liveV8005}`);
          NODE

      - name: Test v8006 prewrite contract
        run: node --test tests/corpus-scale-step8g-ora-turabi-v8006-prewrite.test.js

      - name: Build exact v8006 no-write prewrite
        run: >-
          node scripts/run-corpus-scale-step8g-ora-turabi-v8006-prewrite.mjs
          --ora=./open-recipe-archive
          --measurement=./data/generated/step8g/ora-turabi-1864-measurement.json
          --parent-prewrite=./data/generated/step8g/ora-bosse-watanna-v8005-prewrite-evidence.json
          --parent-live=./data/generated/step8g/ora-bosse-watanna-v8005-live-pass.json
          --out=.tmp/step8g-ora-turabi-v8006-prewrite

      - name: Verify request and complete D1-operation envelope
        run: >-
          node scripts/verify-step8g-ora-turabi-v8006-prewrite.mjs
          --evidence=.tmp/step8g-ora-turabi-v8006-prewrite/evidence.json
          --plan=.tmp/step8g-ora-turabi-v8006-prewrite/population-plan-descriptors.json
          --out=.tmp/step8g-ora-turabi-v8006-prewrite/prewrite-validation.json

      - name: Verify frozen prewrite evidence matches regeneration
        run: |
          cmp -s .tmp/step8g-ora-turabi-v8006-prewrite/evidence.json data/generated/step8g/ora-turabi-v8006-prewrite-evidence.json
          cmp -s .tmp/step8g-ora-turabi-v8006-prewrite/prewrite-validation.json data/generated/step8g/ora-turabi-v8006-prewrite-validation.json

      - name: Generate canonical roadmap and handover update candidates
        if: steps.canonical-baseline.outputs.live_v8005 == 'true'
        run: >-
          node scripts/finalize-step8g-ora-turabi-v8006-prewrite.mjs
          --out=.tmp/step8g-ora-turabi-v8006-finalized

      - name: Verify canonical roadmap and handover freeze
        if: steps.canonical-baseline.outputs.live_v8005 == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const pairs = [
            ['.tmp/step8g-ora-turabi-v8006-finalized/config/corpus_scale_step8_roadmap.json', 'config/corpus_scale_step8_roadmap.json'],
            ['.tmp/step8g-ora-turabi-v8006-finalized/docs/handovers/CURRENT.json', 'docs/handovers/CURRENT.json'],
            ['.tmp/step8g-ora-turabi-v8006-finalized/docs/handovers/PREVIOUS.json', 'docs/handovers/PREVIOUS.json']
          ];
          for (const [candidate, canonical] of pairs) {
            const left = JSON.parse(await readFile(candidate, 'utf8'));
            const right = JSON.parse(await readFile(canonical, 'utf8'));
            if (JSON.stringify(left) !== JSON.stringify(right)) {
              throw new Error(`CANONICAL_JSON_MISMATCH:${canonical}`);
            }
          }
          NODE

      - name: Test canonical v8006 prewrite closeout
        run: node --test tests/corpus-scale-step8g-v8006-prewrite-closeout.test.js

      - name: Upload v8006 prewrite evidence and canonical candidates
        uses: actions/upload-artifact@v4
        with:
          name: step8g-ora-turabi-v8006-prewrite
          path: |
            .tmp/step8g-ora-turabi-v8006-prewrite
            .tmp/step8g-ora-turabi-v8006-finalized
          if-no-files-found: error
          retention-days: 30

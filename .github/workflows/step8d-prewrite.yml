name: Step 8D prewrite source verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/step8d-prewrite.yml"
      - "config/corpus_scale_step8d_contract.json"
      - "data/generated/corpus-scale-step8d-prewrite-evidence.json"
      - "data/generated/step8d/**"
      - "scripts/corpus-scale-step8a-core.mjs"
      - "scripts/corpus-scale-step8d-core.mjs"
      - "scripts/verify-corpus-scale-step8d-pinned-source.mjs"
      - "tests/corpus-scale-step8d.test.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-pinned-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify immutable UniTools source and materialize descriptor evidence
        env:
          STEP8D_ARTIFACT_DIR: artifacts/step8d-prewrite
        run: node scripts/verify-corpus-scale-step8d-pinned-source.mjs
      - name: Upload Step 8D prewrite evidence
        uses: actions/upload-artifact@v4
        with:
          name: step8d-prewrite-evidence
          path: artifacts/step8d-prewrite/
          if-no-files-found: error
          retention-days: 14
      - name: Freeze verified descriptor artifacts on the Step 8D branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'DataRaul'
        run: |
          set -euo pipefail
          mkdir -p data/generated/step8d
          cp artifacts/step8d-prewrite/manifest.json data/generated/step8d/manifest.json
          cp artifacts/step8d-prewrite/population-plan-descriptors.json data/generated/step8d/population-plan-descriptors.json
          git add data/generated/step8d/manifest.json data/generated/step8d/population-plan-descriptors.json
          if git diff --cached --quiet; then
            echo "Step 8D descriptor artifacts already frozen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Step 8D: freeze verified 501-record descriptor artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

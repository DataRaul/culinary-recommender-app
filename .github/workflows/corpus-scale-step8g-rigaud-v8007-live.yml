name: Corpus Scale Step 8G Rigaud v8007 live implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-rigaud-v8007-live.yml'
      - 'data/generated/step8g/v8007-runtime-descriptor.mjs'
      - 'src/server/step8g-v8007-live-runtime.mjs'
      - 'src/server/step8g-v8007-hydration-runtime.mjs'
      - 'functions/api/step8g/v8007.js'
      - 'scripts/verify-step8g-v8007-live-payloads.mjs'
      - 'tests/step8g-v8007-live.test.js'
      - 'step8g-v8007-populate.html'
      - 'data/generated/step8g/ora-rigaud-v8007-prewrite-evidence.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-step8g-rigaud-v8007-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v8007-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4
      - name: Checkout pinned Open Recipe Archive
        uses: actions/checkout@v4
        with:
          repository: AdamBouhmad/open-recipe-archive
          ref: ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
          path: open-recipe-archive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test v8007 live runtime contract
        run: node --test tests/step8g-v8007-live.test.js
      - name: Verify exact source payload and route fingerprints
        run: node scripts/verify-step8g-v8007-live-payloads.mjs --candidate=./open-recipe-archive
      - name: Verify owner runner remains bounded and restart-safe
        run: >-
          node -e 'const fs=require("fs");const s=fs.readFileSync("step8g-v8007-populate.html","utf8");
          for(const x of ["EXPECTED_CHILD=789","EXPECTED_PARENT=2906","EXPECTED_COMPOSED=3695","EXPECTED_BATCHES=79","restartSafeResume","seven-layer-hydration","rollback-v8006","STEP_8G_ORA_RIGAUD_V8007_PROTECTED_POPULATION_PASS"])if(!s.includes(x))process.exit(1);
          if(!s.includes("sourceOrdinal"))process.exit(1);console.log("v8007 owner runner contract PASS");'

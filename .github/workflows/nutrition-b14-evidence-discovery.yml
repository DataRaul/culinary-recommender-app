name: Nutrition B14 evidence discovery

on:
  push:
    branches:
      - agent/nutrition-b14-evidence-discovery

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect exact Matvaretabellen targets
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          const url = 'https://www.matvaretabellen.no/api/en/foods.json';
          const response = await fetch(url);
          if (!response.ok) throw new Error(`fetch failed ${response.status}`);
          const data = await response.json();
          const targets = ['06.085', '06.266', '06.153'];
          console.log('ROOT', Array.isArray(data) ? `array:${data.length}` : Object.keys(data));
          const rows = Array.isArray(data) ? data : Object.values(data).flatMap(v => Array.isArray(v) ? v : []);
          for (const target of targets) {
            const matches = rows.filter(row => JSON.stringify(row).includes(target));
            console.log(`TARGET ${target} MATCHES ${matches.length}`);
            for (const row of matches.slice(0, 5)) console.log(JSON.stringify(row, null, 2));
          }
          EOF

name: Gate F candidate validation
on:
  push:
    branches: [v1-1-recipe-corpus-gate-f-wikibooks]
    paths:
      - .github/workflows/gate-f-candidate-validation.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-1-recipe-corpus-gate-f-wikibooks
      - name: Reconcile Gate F candidate documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "README.md",
              "| Recipe corpus | ✅ COVERAGE EXPANSION COMPLETE | V1.0.3 / Gate E | coverage-driven iteration |",
              "| Recipe corpus | 🟡 VALIDATED CANDIDATE / HUMAN ACCEPTANCE REQUIRED | V1.1 / Gate F | human public-corpus acceptance |",
          )
          replace(
              "README.md",
              "**Public app:** https://dataraul.github.io/culinary-recommender-app/",
              "**Public app:** https://dataraul.github.io/culinary-recommender-app/  \\n**Recipe Corpus Gate F candidate:** 84 recipes = 76 curated + 8 exact-revision Wikibooks records / 83 dish families / 2 external Search-only + 6 reference-only",
          )
          replace(
              "README.md",
              "### Controlled substitutions\n\nReplacement edges are labelled `close_substitute`, `functional_substitute`, `flavour_direction`, `texture_substitute`, `dietary_substitute`, or `emergency_approximation`. They describe culinary function rather than false equivalence.\n\n## Nutrition evidence architecture",
              "### Controlled substitutions\n\nReplacement edges are labelled `close_substitute`, `functional_substitute`, `flavour_direction`, `texture_substitute`, `dietary_substitute`, or `emergency_approximation`. They describe culinary function rather than false equivalence.\n\n## Recipe Corpus Gate F candidate\n\nGate F adds a bounded **text-only English Wikibooks Cookbook** RecipeSource under **CC BY-SA 4.0** after an exact rights/attribution/ShareAlike audit. Broad discovery measured **3,792** pages in `Category:Recipes`; only **eight manually reviewed exact revisions** are bundled. No Wikibooks images or bulk source dump are committed.\n\nThe public recipe universe is now **84 recipes**: 76 project-authored plus eight open external records, normalized to **83 dish families**. The explicit cross-source `spanish_potato_omelet` family retains both the authored and Wikibooks variants. **Baba Ganoush** and **Bruschetta base** are `SEARCH_ONLY`; the other six records remain `REFERENCE_ONLY_INCOMPLETE_HARD_METADATA` because source-backed time/serving or other hard metadata are incomplete. Unknown values stay unknown rather than being guessed.\n\nExternal records preserve page ID/title, exact revision ID/timestamp, canonical and revision URLs, Wikibooks contributor attribution, CC BY-SA 4.0, transformation notice and review state. Source recipe nutrition is deliberately **not** imported as authoritative composition; RecipeSource, NutritionSource and regulatory evidence remain separate. Allergens, dietary rules, permanent exclusions, quantity semantics and fail-closed nutrition/recommendation policy continue to apply.\n\nThe seven-role audit currently covers canonical/classic and regional/traditional across all eight records, with partial staple/everyday, constraint-first and technique-learning coverage. `contemporary_modern` and `genuinely_new_trending` remain explicit gaps. Gate F is not COMPLETE until human acceptance of the deployed public corpus.\n\n## Nutrition evidence architecture",
          )
          replace(
              "README.md",
              "npm run report:nutrition-coverage\n```",
              "npm run report:nutrition-coverage\nnpm run report:recipe-universe\nnpm run verify:wikibooks-gate-f\n```",
          )
          replace(
              "README.md",
              "Recipes and application ontology/substitution guidance are project-authored. USDA FoodData Central composition/portion metadata use the documented CC0/public-domain lane.",
              "The original 76 curated recipes and application ontology/substitution guidance are project-authored. The Gate F candidate additionally bundles eight transformed, exact-revision English Wikibooks recipe records under CC BY-SA 4.0 with attribution and ShareAlike controls documented in `docs/WIKIBOOKS_GATE_F_RIGHTS_AUDIT.md` and `THIRD_PARTY_NOTICES.md`. USDA FoodData Central composition/portion metadata use the documented CC0/public-domain lane.",
          )

          replace(
              "docs/DATA_SOURCES.md",
              "## Shipped project-authored corpus\n\nThe public runtime ships project-authored structured recipes, ingredient mappings, culinary metadata and substitution guidance. No third-party recipe text, photographs or recipe-database dump is bundled.",
              "## RecipeSource lanes\n\nThe public runtime ships two explicitly separated recipe lanes: 76 project-authored structured recipes and a bounded eight-record English Wikibooks Gate F candidate. Ingredient mappings, culinary metadata and substitution guidance remain app-owned normalization/governance data. No third-party photographs, media or bulk recipe-database dump is bundled.",
          )
          replace(
              "docs/DATA_SOURCES.md",
              "Recipe nutrition remains low-confidence `INFERRED_ESTIMATE` unless the deterministic NutritionSource can produce a complete authoritative calculation under the approved evidence policy.\n\nThe canonical ingredient ontology",
              "Recipe nutrition remains low-confidence `INFERRED_ESTIMATE` unless the deterministic NutritionSource can produce a complete authoritative calculation under the approved evidence policy. Wikibooks source nutrition, where present, is not promoted into NutritionSource authority.\n\n### English Wikibooks Cookbook — Gate F candidate\n\nRights audit: **PASS FOR BOUNDED TEXT-ONLY INGEST**. Chosen downstream licence: **CC BY-SA 4.0**. The project preserves page/revision provenance, canonical and exact-revision URLs, Wikibooks contributor attribution, licence URL, transformation notice and any additional page-specific attribution obligations. Pages with obligations that cannot be faithfully retained are rejected. See `docs/WIKIBOOKS_GATE_F_RIGHTS_AUDIT.md` and `THIRD_PARTY_NOTICES.md`.\n\nA bounded MediaWiki discovery run measured **3,792** pages in English Wikibooks `Category:Recipes`. This is a discovery count, not a bundled-corpus claim. Gate F freezes only **eight manually reviewed exact revisions** in `scripts/wikibooks-gate-f-snapshot-v1.json`, verified by `scripts/verify-wikibooks-gate-f-snapshot.mjs`. No Wikibooks images or other media are used.\n\nThe normalized candidate universe is **84 recipes / 83 dish families**: 76 authored plus eight Wikibooks records, with one explicit cross-source Spanish-potato-omelet family. Two external records are `SEARCH_ONLY` and six are `REFERENCE_ONLY_INCOMPLETE_HARD_METADATA`; missing source-backed time/serving metadata remains unknown. Role coverage is intentionally incomplete: `contemporary_modern` and `genuinely_new_trending` are recorded as gaps.\n\nExternal recipe content remains behind `RecipeSource`. `RecipeSource`, `NutritionSource` and regulatory evidence are separate truth lanes, and external recipes cannot bypass allergens, dietary constraints, permanent exclusions, quantity semantics or fail-closed recommendation/nutrition rules. The private Knowledge Core is not a runtime data source.\n\nThe canonical ingredient ontology",
          )
          replace(
              "docs/DATA_SOURCES.md",
              "## Open Food Facts and third-party recipes\n\nOpen Food Facts remains unbundled because its ODbL terms require an explicit compatibility/derived-database architecture decision. Third-party recipe datasets likewise remain unbundled; public availability alone is insufficient provenance.",
              "## Open Food Facts and other third-party recipe sources\n\nOpen Food Facts remains unbundled because its ODbL terms require an explicit compatibility/derived-database architecture decision. Beyond the bounded Wikibooks Gate F lane, other third-party recipe datasets remain unbundled until a source-specific rights/provenance review passes; public availability alone is insufficient provenance.",
          )

          replace(
              "docs/GATES.md",
              "## V1.1 Recipe Corpus Gate F — OPEN / BLOCKING",
              "## V1.1 Recipe Corpus Gate F — VALIDATED CANDIDATE / HUMAN ACCEPTANCE REQUIRED",
          )
          replace(
              "docs/GATES.md",
              "**Wikibooks Cookbook is mandatory as the first external app acquisition source.** The Brain's World Recipe Atlas currently identifies it as the preferred broad open-content lane. Before public ingestion, the app must record a bounded audit of the exact source revision, attribution requirements, ShareAlike obligations and chosen reuse/transformation path.\n\nA failed rights/provenance audit is a legitimate blocker. It is not permission to silently skip Wikibooks: substituting another initial corpus requires an explicit governance decision.",
              "**Wikibooks Cookbook is the first external app acquisition source.** The bounded rights/provenance audit is complete and records exact revision provenance, Wikibooks contributor attribution, ShareAlike obligations and a text-only CC BY-SA 4.0 transformation path. No Wikibooks images/media are admitted. The broad discovery count is 3,792 recipe pages, but only eight reviewed exact revisions are bundled.",
          )
          replace(
              "docs/GATES.md",
              "### Exit criteria\n\nGate F remains `OPEN / BLOCKING` until:",
              "### Candidate state and exit criterion\n\nThe technical Gate F candidate now measures **84 recipes / 83 dish families**, with eight exact-revision Wikibooks records, one explicit cross-source family, two external `SEARCH_ONLY` recipes and six `REFERENCE_ONLY_INCOMPLETE_HARD_METADATA` records. `contemporary_modern` and `genuinely_new_trending` remain explicit role gaps. The authored 76-recipe B6 nutrition baseline remains frozen independently.\n\nTechnical validation covers the following criteria; Gate F remains incomplete until the final human acceptance item passes:",
          )
          replace(
              "docs/GATES.md",
              "Until these criteria pass, corpus breadth remains a gated workstream and cannot be declared complete from authored-recipe or Atlas growth alone.",
              "All technical criteria are represented in the candidate and automated validation. **Human acceptance of the public external corpus is the sole remaining Gate F exit decision.** Until that acceptance is explicit, Gate F must not be marked COMPLETE and Nutrition B7/B8 work does not resume.",
          )
          replace(
              "docs/GATES.md",
              "The next ordinary nutrition work is coverage-driven: target the remaining composition/form blockers and residual exact quantity semantics that can unlock complete recipes, while preserving the carbohydrate semantic firewall and all source/licensing provenance.",
              "After Gate F human acceptance, the next ordinary nutrition work is coverage-driven: target the remaining composition/form blockers and residual exact quantity semantics that can unlock complete recipes, while preserving the carbohydrate semantic firewall and all source/licensing provenance.",
          )

          replace(
              "docs/ROADMAP.md",
              "| V1.1 / Recipe Corpus Gate F | OPEN / BLOCKING | mandatory Wikibooks-first external app corpus + recipe-universe coverage/provenance/rights audit |",
              "| V1.1 / Recipe Corpus Gate F | VALIDATED CANDIDATE / HUMAN ACCEPTANCE REQUIRED | bounded Wikibooks RecipeSource + exact provenance + coverage/safety validation; public acceptance pending |",
          )
          replace(
              "docs/ROADMAP.md",
              "## V1.1 Recipe Corpus Gate F — OPEN / BLOCKING",
              "## V1.1 Recipe Corpus Gate F — VALIDATED CANDIDATE / HUMAN ACCEPTANCE REQUIRED",
          )
          replace(
              "docs/ROADMAP.md",
              "**Wikibooks Cookbook is the mandatory first external recipe acquisition source for the public app**, subject to a bounded legal/provenance ingest audit covering the exact source revision, attribution, ShareAlike obligations and public-repository reuse path. The current Brain/Atlas snapshot identifies Wikibooks as the preferred broad open-content lane and observes 3,825 recipe pages plus 158 cuisine pages; these are navigation counts, not normalized dish-family counts or proof of balanced world coverage.\n\nIf the audit finds a genuine blocking incompatibility, replacing Wikibooks requires an explicit governance decision. It must not be silently skipped for a more convenient corpus.",
              "**Wikibooks Cookbook is the mandatory first external recipe acquisition source for the public app.** The rights/provenance audit has passed for a bounded text-only CC BY-SA 4.0 path with exact revision URLs, contributor attribution, ShareAlike and transformation notices. A current bounded discovery measured **3,792** recipe pages; that count is navigation/discovery evidence, not a bundled-corpus or world-coverage claim. Only eight reviewed exact revisions are admitted and no Wikibooks images/media are bundled.",
          )
          replace(
              "docs/ROADMAP.md",
              "Freshness-sensitive/trending coverage is expected to need later sources because Wikibooks is a floor, not a complete universe. Additional corpora may be admitted only for a named coverage or evidence gain under the same provenance/rights rules.\n\n### Exit criteria\n\nGate F remains **OPEN / BLOCKING** until all of the following are true:",
              "Freshness-sensitive/trending coverage is expected to need later sources because Wikibooks is a floor, not a complete universe. Additional corpora may be admitted only for a named coverage or evidence gain under the same provenance/rights rules.\n\n### Current candidate state\n\nThe public RecipeSource universe is **84 recipes**: 76 curated authored records plus eight exact-revision Wikibooks records, normalized into **83 dish families**. One Spanish-potato-omelet family explicitly preserves authored and external variants. Two external recipes are Search-only; six remain reference-only because hard source metadata is incomplete. Modern/trending role coverage remains an explicit gap. Source recipe nutrition is not imported as authoritative composition and the private Knowledge Core remains offline.\n\n### Exit criteria\n\nThe technical candidate implements and tests the following requirements; Gate F remains incomplete until the final human acceptance item is satisfied:",
          )
          replace(
              "docs/ROADMAP.md",
              "Until then, `V1.x / Corpus breadth` is **GATED** rather than complete merely because authored recipes or Atlas candidates increase.",
              "The technical candidate is validated only as a bounded first external tranche. `V1.x / Corpus breadth` remains **GATED**, and Gate F cannot be marked COMPLETE, until the user accepts the deployed public corpus.",
          )
          replace(
              "docs/ROADMAP.md",
              "## Next recipe-unlock evidence work\n\nWith B6 complete, priority shifts from broad quantity discovery to **recipe-unlock analysis**:",
              "## Post-Gate-F recipe-unlock evidence work\n\nAfter Gate F human acceptance, priority returns to **recipe-unlock analysis** rather than broad quantity discovery:",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add README.md docs/DATA_SOURCES.md docs/GATES.md docs/ROADMAP.md
            git commit -m "Finalize Gate F candidate documentation"
            git push origin HEAD:v1-1-recipe-corpus-gate-f-wikibooks
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run validate
      - run: npm run test:matrix
      - run: npm run report:recipe-universe
      - run: npm run verify:wikibooks-gate-f
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/culinary-http.log 2>&1 &
      - run: npm run test:browser

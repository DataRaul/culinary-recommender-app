name: Nutrition B23 priority diagnostic
on:
  push:
    branches: [agent/nutrition-b23-priority-reconciliation]
    paths:
      - .github/workflows/nutrition-b23-priority.yml
permissions:
  contents: read
jobs:
  priority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Nutrition unlock priorities
        run: node scripts/report-nutrition-unlock-priorities.mjs
      - name: B23 candidate authored uses
        run: |
          node --input-type=module <<'NODE'
          import { AUTHORED_RECIPES } from './src/data/corpus-v1.js';
          const ids = new Set(['chicken_thigh','salt','tortilla','pumpkin','bread','feta','sardines']);
          for (const recipe of AUTHORED_RECIPES) {
            for (const ingredient of recipe.ingredients || []) {
              if (ids.has(ingredient.canonicalIngredientId)) {
                console.log(JSON.stringify({recipeId: recipe.id, ingredientId: ingredient.canonicalIngredientId, quantity: ingredient.quantity, unit: ingredient.unit, preparation: ingredient.preparation ?? null}));
              }
            }
          }
          NODE

name: Corpus Scale Step 8G Seleskowitz v8012 runtime descriptor candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-seleskowitz-v8012-runtime-descriptor.yml'
      - 'scripts/generate-step8g-seleskowitz-v8012-runtime-descriptor.mjs'
      - 'scripts/corpus-scale-step8g-seleskowitz-v8012-prewrite-core.mjs'
      - 'scripts/corpus-scale-step8a-core.mjs'
      - 'data/generated/step8g/seleskowitz-v8012-prewrite-evidence.json'
      - 'data/generated/step8g/v8012-runtime-descriptor.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-step8g-seleskowitz-v8012-runtime-descriptor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-runtime-descriptor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4

      - name: Checkout pinned Open Recipe Archive
        uses: actions/checkout@v4
        with:
          repository: AdamBouhmad/open-recipe-archive
          ref: ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
          path: open-recipe-archive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run focused frozen prewrite tests
        run: node --test tests/corpus-scale-step8g-seleskowitz-v8012-prewrite.test.js

      - name: Generate public-safe v8012 runtime descriptor candidate
        run: >-
          node scripts/generate-step8g-seleskowitz-v8012-runtime-descriptor.mjs
          --ora=./open-recipe-archive
          --out=.tmp/v8012-runtime-descriptor.mjs

      - name: Print generated descriptor candidate
        run: cat .tmp/v8012-runtime-descriptor.mjs

      - name: Verify candidate matches earned prewrite and boundaries
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const evidence = JSON.parse(await readFile('data/generated/step8g/seleskowitz-v8012-prewrite-evidence.json', 'utf8'));
          const { STEP8G_V8012_RUNTIME_DESCRIPTOR: descriptor } = await import('./.tmp/v8012-runtime-descriptor.mjs');
          if (evidence.pass !== true || evidence.terminalCandidate !== 'STEP_8G_SELESKOWITZ_V8012_PREWRITE_PASS_LIVE_PROTECTED_POPULATION_IMPLEMENTATION_EARNED') throw new Error('V8012_PREWRITE_PASS_REQUIRED');
          if (descriptor.sourceCommit !== evidence.source.commit) throw new Error('SOURCE_COMMIT_MISMATCH');
          if (descriptor.layerManifestSha256 !== evidence.layer.manifestSha256) throw new Error('MANIFEST_FINGERPRINT_MISMATCH');
          if (descriptor.populationPlanSha256 !== evidence.layer.populationPlanSha256) throw new Error('POPULATION_PLAN_FINGERPRINT_MISMATCH');
          if (descriptor.parentCompositionRouteCount !== 13124 || descriptor.composedRouteCount !== 14846) throw new Error('ROUTE_COUNT_MISMATCH');
          if (JSON.stringify(descriptor.bodyShardRows) !== JSON.stringify([841,881])) throw new Error('SHARD_ROW_LAYOUT_MISMATCH');
          const bodyBatchCount = descriptor.bodyHashHexByShard.reduce((sum,value)=>sum+value.length/64,0);
          const routeBatchCount = descriptor.routeHashHexByShard.reduce((sum,value)=>sum+value.length/64,0);
          if (bodyBatchCount !== 174 || routeBatchCount !== 174) throw new Error('BATCH_COUNT_MISMATCH');
          if (JSON.stringify(descriptor).includes('rawJson')) throw new Error('PROTECTED_BODY_LEAK_IN_DESCRIPTOR');
          if (evidence.layer.operationBudget.maxPlannedD1Subqueries !== 16 || evidence.layer.operationBudget.headroomAssumed !== false) throw new Error('D1_BUDGET_BOUNDARY_MISMATCH');
          const committed = await readFile('data/generated/step8g/v8012-runtime-descriptor.mjs', 'utf8');
          const candidate = await readFile('.tmp/v8012-runtime-descriptor.mjs', 'utf8');
          if (committed !== candidate) throw new Error('COMMITTED_RUNTIME_DESCRIPTOR_NOT_EXACT_GENERATED_CANDIDATE');
          console.log(JSON.stringify({pass:true,bodyBatchCount,routeBatchCount,bodyShardRows:descriptor.bodyShardRows,containsRecipeBodies:false,ciMutation:false}));
          NODE

      - name: Upload descriptor candidate
        uses: actions/upload-artifact@v4
        with:
          name: seleskowitz-v8012-runtime-descriptor
          path: .tmp/v8012-runtime-descriptor.mjs
          if-no-files-found: error
          retention-days: 1

name: One-shot Step 8E terminal freeze

on:
  push:
    branches:
      - agent/step8e-recommendation-eligibility
    paths:
      - .github/workflows/step8e-terminal-freeze.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step8e-recommendation-eligibility
          fetch-depth: 0
      - name: Apply frozen terminal state
        run: python3 scripts/step8e-terminal-freeze.py
      - name: Commit frozen terminal state and remove temporary helpers
        run: |
          rm .github/workflows/step8e-terminal-freeze.yml scripts/step8e-terminal-freeze.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Freeze Step 8E terminal and Step 8F human gate"
          git push origin HEAD:agent/step8e-recommendation-eligibility

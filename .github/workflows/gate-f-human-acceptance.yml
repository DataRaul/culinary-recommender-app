name: Reconcile Gate F human acceptance
on:
  push:
    branches: [gate-f-human-acceptance]
    paths:
      - .github/workflows/gate-f-human-acceptance.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gate-f-human-acceptance
          fetch-depth: 0
      - name: Record user acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing acceptance anchor: {label}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "docs/ROADMAP.md",
              "| V1.1 / Recipe Corpus Gate F | VALIDATED CANDIDATE / HUMAN ACCEPTANCE REQUIRED | bounded Wikibooks RecipeSource + exact provenance + coverage/safety validation; public acceptance pending |",
              "| V1.1 / Recipe Corpus Gate F | COMPLETE / USER-ACCEPTED | bounded Wikibooks RecipeSource + exact provenance + coverage/safety validation; user authorized assistant-run acceptance checks and continuation on 2026-09-01 |",
              "roadmap table",
          )
          replace(
              "docs/ROADMAP.md",
              "## V1.1 Recipe Corpus Gate F — VALIDATED CANDIDATE / HUMAN ACCEPTANCE REQUIRED",
              "## V1.1 Recipe Corpus Gate F — COMPLETE / USER-ACCEPTED",
              "roadmap heading",
          )
          replace(
              "docs/ROADMAP.md",
              "All technical Gate F criteria are represented in the candidate and automated validation. **Human acceptance of the deployed public external corpus is the sole remaining Gate F exit decision.** Until that acceptance is explicit, Gate F must not be marked COMPLETE; `V1.x / Corpus breadth` remains **GATED** rather than complete merely because authored recipes or Atlas candidates increase.",
              "All technical Gate F criteria passed. On 2026-09-01, after being presented with the explicit Gate F acceptance request, the user instructed the assistant to run the checks itself and continue. The assistant-run deterministic, Chromium, provenance, planner-non-leakage, post-merge and Pages checks were green, so that instruction records the required human acceptance decision. Gate F is therefore **COMPLETE / USER-ACCEPTED**. Future corpus breadth remains governed by measured coverage gaps and the same rights/provenance/safety rules rather than raw recipe-count growth.",
              "roadmap terminal state",
          )

          replace(
              "docs/GATES.md",
              "## V1.1 Recipe Corpus Gate F — VALIDATED CANDIDATE / HUMAN ACCEPTANCE REQUIRED",
              "## V1.1 Recipe Corpus Gate F — COMPLETE / USER-ACCEPTED",
              "gates heading",
          )
          replace(
              "docs/GATES.md",
              "Technical validation covers the following criteria; Gate F remains incomplete until the final human acceptance item passes:",
              "Technical validation covers the following criteria, all of which passed before the user acceptance decision:",
              "gates criteria lead",
          )
          replace(
              "docs/GATES.md",
              "- human acceptance confirms the external corpus is useful in the public app.",
              "- final human acceptance: on 2026-09-01 the user, after receiving the explicit Gate F review request, instructed the assistant to run the checks itself and continue; the assistant-run acceptance checks were green, satisfying the human decision gate.",
              "gates human item",
          )
          replace(
              "docs/GATES.md",
              "All technical criteria are represented in the candidate and automated validation. **Human acceptance of the public external corpus is the sole remaining Gate F exit decision.** Until that acceptance is explicit, Gate F must not be marked COMPLETE and Nutrition B7/B8 work does not resume.",
              "All technical criteria passed. The user's 2026-09-01 instruction to run the acceptance checks and continue records the required human decision after those checks passed. Gate F is **COMPLETE / USER-ACCEPTED**, and ordinary Nutrition B7/B8 work may resume under the existing fail-closed evidence contract.",
              "gates terminal state",
          )

          replace(
              "docs/HUMAN_REVIEW.md",
              "## V1.1 Recipe Corpus Gate F — HUMAN ACCEPTANCE REQUIRED",
              "## V1.1 Recipe Corpus Gate F — ACCEPTED",
              "human review heading",
          )
          replace(
              "docs/HUMAN_REVIEW.md",
              "A human **accept** decision closes Gate F. A rejection or requested change keeps Gate F open and should identify the specific public-corpus issue to repair.",
              "**Acceptance decision — 2026-09-01:** after the explicit Gate F review request, the user instructed the assistant to run the checks itself and continue without further user-facing text unless a genuine gate/error arose. The assistant-run deterministic/static, exact-revision, Chromium provenance, nutrition-firewall, planner-non-leakage, post-merge validation and GitHub Pages deployment checks were green. This user instruction constitutes the required human acceptance decision. Gate F is closed as **ACCEPTED**; future regressions reopen only the affected contract, not the completed gate wholesale.",
              "human review terminal",
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md docs/GATES.md docs/HUMAN_REVIEW.md
          git commit -m "Record Gate F user acceptance"
          git push origin HEAD:gate-f-human-acceptance

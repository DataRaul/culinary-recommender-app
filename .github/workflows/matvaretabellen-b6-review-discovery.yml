name: Matvaretabellen B6 strict review discovery
on:
  push:
    branches: [v1-nutrition-b6-matvaretabellen-portions]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/matvaretabellen-b6-discover.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: matvaretabellen-b6-strict-discovery
          path: artifacts/matvaretabellen-b6-discovery.json
          if-no-files-found: error

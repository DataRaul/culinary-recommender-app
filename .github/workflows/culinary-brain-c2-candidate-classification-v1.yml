name: Culinary Brain C2 full v8018 candidate classification V1

on:
  pull_request:
    paths:
      - "config/culinary_brain_c2_candidate_classification_v1.json"
      - "scripts/culinary-brain-c2-candidate-classification-core.mjs"
      - "scripts/run-culinary-brain-c2-candidate-classification-v1.mjs"
      - "tests/culinary-brain-c2-candidate-classification-v1.test.js"
      - "config/corpus_normalization_baseline_v1.json"
      - "config/corpus_normalization_mapping_v1.json"
      - "scripts/run-corpus-normalization-mapping-v1.mjs"
      - ".github/workflows/culinary-brain-c2-candidate-classification-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run C2 contract tests
        run: node --test tests/culinary-brain-c2-candidate-classification-v1.test.js

      - name: Checkout exact pinned UniTools
        run: |
          git clone --filter=blob:none https://github.com/farcrak/unitools-recipes.git .tmp/unitools
          git -C .tmp/unitools checkout --detach 1d09e9548d957dd0375301146a86dddf5e269c1b

      - name: Checkout exact pinned ForkRecipe
        run: |
          git clone --filter=blob:none https://github.com/futurechef/forkrecipe-recipes.git .tmp/forkrecipe
          git -C .tmp/forkrecipe checkout --detach c32255266af39bd77444d39452f3df8088ac8fd9

      - name: Checkout exact pinned CC0 recipes
        run: |
          git clone --filter=blob:none https://github.com/sylGauthier/recipes.git .tmp/cc0
          git -C .tmp/cc0 checkout --detach b12e481d1c220a13e0847a34e148d5872a16928e

      - name: Checkout exact pinned Open Recipe Archive
        run: |
          git clone --filter=blob:none https://github.com/AdamBouhmad/open-recipe-archive.git .tmp/ora
          git -C .tmp/ora checkout --detach ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8

      - name: Reconstruct exact v8018 normalization mapping
        run: |
          node scripts/run-corpus-normalization-mapping-v1.mjs \
            --unitools=.tmp/unitools \
            --forkrecipe=.tmp/forkrecipe \
            --cc0=.tmp/cc0 \
            --ora=.tmp/ora \
            --output=.tmp/corpus-normalization-mapping-v1-full.json \
            --summary=.tmp/corpus-normalization-mapping-v1.json

      - name: Classify full v8018 candidate universe
        run: |
          node scripts/run-culinary-brain-c2-candidate-classification-v1.mjs \
            --mapping=.tmp/corpus-normalization-mapping-v1-full.json \
            --contract=config/culinary_brain_c2_candidate_classification_v1.json \
            --output=.tmp/culinary-brain-c2-full-v8018-candidates-v1.json \
            --summary=.tmp/culinary-brain-c2-candidate-classification-summary-v1.json

      - name: Upload C2 full classification evidence
        uses: actions/upload-artifact@v4
        with:
          name: culinary-brain-c2-full-v8018-candidate-classification-v1
          path: |
            .tmp/culinary-brain-c2-full-v8018-candidates-v1.json
            .tmp/culinary-brain-c2-candidate-classification-summary-v1.json
          if-no-files-found: error

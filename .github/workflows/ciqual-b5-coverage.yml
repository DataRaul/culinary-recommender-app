name: Ciqual B5 coverage audit
on:
  push:
    branches: [v1-nutrition-b5-ciqual-coverage]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run report:nutrition-coverage

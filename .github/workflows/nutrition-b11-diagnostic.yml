name: Nutrition B11 diagnostic

on:
  push:
    branches:
      - agent/nutrition-b11-matvaretabellen-spice-lentil-unlock
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: node --test tests/matvaretabellen-composition-b11.test.js
      - run: node scripts/report-nutrition-unlock-priorities.mjs

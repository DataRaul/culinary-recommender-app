name: YT-CUL-5E adaptive daily discovery

on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run all preflight/state/allocation logic without YouTube Search spend'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: yt-cul-5e-adaptive-daily-discovery
  cancel-in-progress: false

jobs:
  adaptive-daily-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CULINARY_YOUTUBE_API_KEY: ${{ secrets.CULINARY_YOUTUBE_API_KEY }}
      CULINARY_YOUTUBE_SEARCH_DAILY_LIMIT: '100'
      CULINARY_YOUTUBE_PROJECT_IDENTITY: ${{ vars.CULINARY_YOUTUBE_PROJECT_IDENTITY }}
      YT_CUL_POLICY_RECHECKED_AT: '2026-09-05'
      YT_CUL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      YT_CUL_DAILY_STATE_PATH: data/generated/youtube-culinary-daily-discovery-state.json
      YT_CUL_CANONICAL_REVIEW_BRIDGE_PATH: data/generated/youtube-culinary-canonical-review-bridge.json
      CULINARY_KC_REVIEW_SYNC_ENABLED: ${{ vars.CULINARY_KC_REVIEW_SYNC_ENABLED || 'false' }}
      CULINARY_KC_REVIEW_READ_TOKEN: ${{ secrets.CULINARY_KC_REVIEW_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fail-closed YT-CUL-5E preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CULINARY_YOUTUBE_SEARCH_DAILY_LIMIT}" != "100" ]]; then
            echo "::error::YT-CUL-5E is armed only for the owner-verified 100/day Search Queries limit."
            exit 2
          fi
          if [[ -z "${CULINARY_YOUTUBE_PROJECT_IDENTITY:-}" ]]; then
            echo "::error::CULINARY_YOUTUBE_PROJECT_IDENTITY is missing."
            exit 2
          fi
          if [[ "${CULINARY_YOUTUBE_PROJECT_IDENTITY}" =~ [Bb][Ll][Uu][Ee].*[Ll][Aa][Gg][Oo][Oo][Nn] ]] || [[ "${CULINARY_YOUTUBE_PROJECT_IDENTITY}" =~ [Mm][Uu][Ss][Ii][Cc] ]]; then
            echo "::error::Blue Lagoon/music identity is forbidden in the Culinary API client."
            exit 2
          fi
          if [[ "${YT_CUL_DRY_RUN}" != "true" && "${YT_CUL_DRY_RUN}" != "false" ]]; then
            echo "::error::YT_CUL_DRY_RUN must resolve to true or false."
            exit 2
          fi
          if [[ "${YT_CUL_DRY_RUN}" == "false" ]]; then
            if [[ -z "${CULINARY_YOUTUBE_API_KEY:-}" ]]; then
              echo "::error::CULINARY_YOUTUBE_API_KEY is not available to the scheduled live workflow."
              exit 2
            fi
            echo "::add-mask::$CULINARY_YOUTUBE_API_KEY"
          fi
          if [[ "${CULINARY_KC_REVIEW_SYNC_ENABLED}" == "true" && -z "${CULINARY_KC_REVIEW_READ_TOKEN:-}" ]]; then
            echo "::error::CULINARY_KC_REVIEW_READ_TOKEN is required when canonical review sync is enabled."
            exit 2
          fi

      - name: Validate YouTube safety, relevance and adaptive allocation before live spend
        run: >-
          node --test
          tests/youtube-culinary-discovery-control-plane.test.js
          tests/youtube-culinary-connectivity-canary.test.js
          tests/youtube-culinary-discovery-pilot.test.js
          tests/youtube-culinary-channel-playlist-efficiency.test.js
          tests/youtube-culinary-atlas-expansion-cadence.test.js
          tests/youtube-culinary-atlas-relevance-gate.test.js
          tests/youtube-culinary-relevance-source-diversity-repair.test.js
          tests/youtube-culinary-daily-discovery.test.js
          tests/youtube-culinary-adaptive-portfolio.test.js
          tests/youtube-culinary-kc-review-bridge-sync.test.js

      - name: Sync canonical Knowledge Core review bridge at repository time
        id: kc_review_sync
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-youtube-culinary-kc-review-bridge.mjs | tee "$RUNNER_TEMP/yt-cul-kc-review-sync.json"

      - name: Execute one quota-date-aware adaptive portfolio cycle
        id: daily
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-youtube-culinary-adaptive-discovery.mjs | tee "$RUNNER_TEMP/yt-cul-5e-safe-summary.json"

      - name: Persist cumulative policy-safe programme state, including interrupted quota progress
        if: always() && env.YT_CUL_DRY_RUN == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/generated/youtube-culinary-daily-discovery-state.json; then
            echo "No cumulative state change to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/youtube-culinary-daily-discovery-state.json
          git commit -m "YT-CUL-5E adaptive daily safe state [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "::error::Could not persist cumulative safe state after three bounded retries."
          exit 3

      - name: Record compact policy-safe adaptive summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "# YT-CUL-5E adaptive daily discovery" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          let summary = null;
          let state = null;
          let kcSync = null;
          try { summary = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/yt-cul-5e-safe-summary.json`, 'utf8')); } catch {}
          try { state = JSON.parse(await readFile(process.env.YT_CUL_DAILY_STATE_PATH, 'utf8')); } catch {}
          try { kcSync = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/yt-cul-kc-review-sync.json`, 'utf8')); } catch {}
          const progress = state?.quotaDayProgress ?? null;
          const canonical = summary?.canonicalLearning ?? {};
          const kpis = summary?.researchKpis ?? {};
          const lines = summary ? [
            `- Result: **${summary.result}**`,
            `- YouTube quota date: ${summary.quotaDate}`,
            `- Dry run: ${summary.dryRun ?? false}`,
            `- KC canonical bridge sync: ${kcSync?.status ?? 'NO_SYNC_RESULT'}`,
            `- KC bridge outcomes available: ${kcSync?.outcomes ?? 0}`,
            `- Search calls: ${summary.searchCallsExecuted ?? 0} / usable capacity ${summary.searchCapacity ?? 0}`,
            `- Tranches / reallocations: ${summary.tranchesRun ?? 0} / ${summary.reallocations ?? 0}`,
            `- Search utilization: ${Math.round((kpis.searchUtilization ?? 0) * 100)}%`,
            `- Independent pages per Search: ${(kpis.independentPagesPerSearch ?? 0).toFixed(3)}`,
            `- Recipe-structured pages per Search: ${(kpis.recipeStructuredPagesPerSearch ?? 0).toFixed(3)}`,
            `- Review-ready packets per Search: ${(kpis.reviewReadyPacketsPerSearch ?? 0).toFixed(3)}`,
            `- Useful source domains per Search: ${(kpis.usefulSourceDomainsPerSearch ?? 0).toFixed(3)}`,
            `- Canonical Brain outcomes: ${canonical.accepted ?? 0} accepted / ${canonical.rejected ?? 0} rejected / ${canonical.held ?? 0} held`,
            `- Canonical resolved acceptance rate: ${canonical.acceptanceRate == null ? 'n/a' : `${Math.round(canonical.acceptanceRate * 100)}%`}`,
            `- Canonical accepted per cumulative Search: ${(kpis.canonicalAcceptedPerCumulativeSearch ?? 0).toFixed(4)}`,
            `- Explicit lifecycle advancements per cumulative Search: ${(kpis.explicitLifecycleAdvancementsPerCumulativeSearch ?? 0).toFixed(4)}`,
            `- App-authoring-eligible outcomes per cumulative Search: ${(kpis.appAuthoringEligiblePerCumulativeSearch ?? 0).toFixed(4)}`,
            `- Unresolved review backlog: ${summary.unresolvedReviewBacklog ?? 0}`,
            `- YT-CUL-6 readiness earned: ${summary.ytCul6ReadinessEarned ?? false}`,
            `- Raw YouTube API Data durable: ${summary.controls?.rawYoutubeApiDataEmbedded ?? false}`,
            `- Automatic Atlas promotion: ${summary.controls?.automaticAtlasPromotionAuthorized ?? false}`,
            `- Automatic app admission: ${summary.controls?.automaticAppAdmissionAuthorized ?? false}`,
            ''
          ] : [
            '- Result: **NO_SAFE_SUMMARY_PRODUCED**',
            `- KC canonical bridge sync: ${kcSync?.status ?? 'NO_SYNC_RESULT'}`,
            `- Persisted interrupted quota progress: ${progress ? `${progress.searchCallsUsed ?? 0}/${progress.searchCapacity ?? 0} Search attempts` : 'none'}`,
            '- The workflow remains fail-closed; rerun uses persisted quota-day progress rather than assuming zero spend.',
            ''
          ];
          await appendFile(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'), 'utf8');
          NODE

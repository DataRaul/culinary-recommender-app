name: Gate F candidate validation
on:
  push:
    branches: [v1-1-recipe-corpus-gate-f-wikibooks]
    paths:
      - .github/workflows/gate-f-candidate-validation.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-1-recipe-corpus-gate-f-wikibooks
      - name: Repair Gate F documentation newline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text()
          bad = "**Public app:** https://dataraul.github.io/culinary-recommender-app/  \\n**Recipe Corpus Gate F candidate:**"
          good = "**Public app:** https://dataraul.github.io/culinary-recommender-app/  \n**Recipe Corpus Gate F candidate:**"
          if bad in text:
              p.write_text(text.replace(bad, good, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add README.md
            git commit -m "Fix Gate F README line break"
            git push origin HEAD:v1-1-recipe-corpus-gate-f-wikibooks
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run validate
      - run: npm run test:matrix
      - run: npm run report:recipe-universe
      - run: npm run verify:wikibooks-gate-f
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/culinary-http.log 2>&1 &
      - run: npm run test:browser

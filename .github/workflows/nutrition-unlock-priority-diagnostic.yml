name: Nutrition unlock priority diagnostic
on:
  push:
    branches: [agent/nutrition-unlock-priority-recovery]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate current nutrition unlock priority report
        run: node scripts/report-nutrition-unlock-priorities.mjs

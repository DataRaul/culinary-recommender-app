name: Corpus Scale Step 8G Artusi 1891 measurement

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-ora-artusi-1891.yml'
      - 'scripts/corpus-scale-step8g-ora-artusi-1891-core.mjs'
      - 'scripts/run-corpus-scale-step8g-ora-artusi-1891.mjs'
      - 'tests/corpus-scale-step8g-ora-artusi-1891.test.js'
      - 'docs/CORPUS_SCALE_STEP8G_ARTUSI_1891_RIGHTS_AND_MEASUREMENT.md'
      - 'data/generated/step8g/artusi-1891-v8009-measurement.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-step8g-ora-artusi-1891-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure-artusi-1891:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4

      - name: Checkout pinned Open Recipe Archive
        uses: actions/checkout@v4
        with:
          repository: AdamBouhmad/open-recipe-archive
          ref: ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
          path: open-recipe-archive

      - name: Checkout pinned ForkRecipe protected baseline
        uses: actions/checkout@v4
        with:
          repository: futurechef/forkrecipe-recipes
          ref: c32255266af39bd77444d39452f3df8088ac8fd9
          path: forkrecipe

      - name: Checkout pinned UniTools protected baseline
        uses: actions/checkout@v4
        with:
          repository: farcrak/unitools-recipes
          ref: 1d09e9548d957dd0375301146a86dddf5e269c1b
          path: unitools

      - name: Checkout pinned CC0 protected baseline
        uses: actions/checkout@v4
        with:
          repository: sylGauthier/recipes
          ref: b12e481d1c220a13e0847a34e148d5872a16928e
          path: cc0-recipes

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Artusi 1891 source-specific gate
        run: node --test tests/corpus-scale-step8g-ora-artusi-1891.test.js

      - name: Measure exact 829-row Artusi cohort against live v8009 baseline
        run: >-
          node scripts/run-corpus-scale-step8g-ora-artusi-1891.mjs
          --ora=./open-recipe-archive
          --forkrecipe=./forkrecipe
          --unitools=./unitools
          --cc0=./cc0-recipes
          --rights-doc=./docs/CORPUS_SCALE_STEP8G_ARTUSI_1891_RIGHTS_AND_MEASUREMENT.md
          --out=.tmp/step8g-artusi-1891-measurement

      - name: Verify bounded measurement authority and no-write boundaries
        run: >-
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(".tmp/step8g-artusi-1891-measurement/measurement.json","utf8"));
          if(p.pass!==true||p.terminal!=="STEP_8G_ORA_ARTUSI_1891_MEASUREMENT_EARNED_COHORT_CANDIDATE")process.exit(1);
          if(p.baseline.activeProtectedVersion!=="v8009"||p.baseline.activeProtectedCount!==10923)process.exit(1);
          if(p.candidate?.recipeCount!==829||p.candidate?.sourceUrl!=="https://www.gutenberg.org/ebooks/59047"||p.candidate?.sourceYearSemantics!=="WORK_FIRST_PUBLICATION_YEAR"||p.candidate?.digitizedEditionYear!=="1922")process.exit(1);
          const g=p.gates;if(!g.rightsDocumented||!g.repositoryReusePass||!g.attributionClassified||!g.editionSemanticsClassified||!g.sourceGroundingSamplePass||!g.exactCountPass||!g.singleSourcePass||!g.rightsMetadataPass||!g.rightsAuditPass||!g.structuralQualityPass||!g.culinaryCoveragePass)process.exit(1);
          const b=p.boundaries;if(b.liveD1WritesPerformed!==0||b.protectedPopulationAuthorized!==false||b.publicRuntimeChangeAuthorized!==false||b.recommendationAdmissionAuthorized!==false||b.thirdShardAuthorized!==false||b.d1BudgetExpansionAuthorized!==false||b.billingExpansionAuthorized!==false)process.exit(1);
          if(p.nextAuthority!=="SOURCE_SPECIFIC_PREWRITE_CAPACITY_MEASUREMENT_ONLY")process.exit(1);
          console.log(JSON.stringify({terminal:p.terminal,recipes:p.candidate.recipeCount,parseable:p.candidate.parseableRecipeRatio,unique:p.candidate.uniqueTitleRatio,novel:p.candidate.novelTitleRatio,nextAuthority:p.nextAuthority}));'

      - name: Verify frozen Artusi measurement parity
        run: >-
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync(".tmp/step8g-artusi-1891-measurement/measurement.json","utf8"));const f=JSON.parse(fs.readFileSync("data/generated/step8g/artusi-1891-v8009-measurement.json","utf8"));
          const pick=x=>({schema:x.schema,pass:x.pass,terminal:x.terminal,baseline:x.baseline,candidate:x.candidate,thresholds:x.thresholds,gates:x.gates,evidenceSamples:x.evidenceSamples,nextAuthority:x.nextAuthority,boundaries:x.boundaries,date:x.date,sourceRepository:x.sourceRepository,sourceCommit:x.sourceCommit,sourcePins:x.sourcePins,publicRuntimeRecipeCount:x.publicRuntimeRecipeCount});
          if(JSON.stringify(pick(a))!==JSON.stringify(pick(f)))process.exit(1);
          console.log("STEP8G_ARTUSI_1891_V8009_FROZEN_MEASUREMENT_PARITY_PASS");'

      - name: Upload Artusi 1891 bounded measurement evidence
        uses: actions/upload-artifact@v4
        with:
          name: step8g-artusi-1891-v8009-measurement
          path: .tmp/step8g-artusi-1891-measurement/measurement.json
          if-no-files-found: error
          retention-days: 30

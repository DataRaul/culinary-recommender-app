name: Nutrition B22 priority reconciliation

on:
  push:
    branches:
      - agent/nutrition-b22-priority-reconciliation

permissions:
  contents: read

jobs:
  priorities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Generate merged-main nutrition unlock priorities
        run: node scripts/report-nutrition-unlock-priorities.mjs | tee /tmp/nutrition-b22-priorities.json
      - uses: actions/upload-artifact@v4
        with:
          name: nutrition-b22-priorities
          path: /tmp/nutrition-b22-priorities.json
          if-no-files-found: error
          retention-days: 7

name: Nutrition B23 bounded finalization
on:
  push:
    branches: [agent/nutrition-b23-priority-reconciliation]
    paths:
      - .github/workflows/nutrition-b23-priority.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert authoritative base
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5c06369cca893933d5365373198da5e5288d32a6"
      - name: Integrate exact raw pumpkin composition evidence
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          source = '''// Bounded static composition evidence from the official Norwegian Food Composition Table 2026.
          // B23 is composition-only: the source row's edible-part yield is deliberately not admitted as quantity evidence.
          // Canonical pumpkin is generic; this tranche does not authorize cultivar/species-specific or processed pumpkin forms.

          export const MATVARETABELLEN_COMPOSITION_SOURCE_B23 = Object.freeze({
            id: "matvaretabellen-2026-composition-b23",
            authority: "Norwegian Food Safety Authority (Mattilsynet)",
            dataset: "Norwegian Food Composition Table 2026",
            releaseDate: "2026-01",
            apiUrl: "https://www.matvaretabellen.no/api/en/foods.json",
            website: "https://www.matvaretabellen.no/en/pumpkin-raw/",
            license: "NLOD 2.0 / Norsk lisens for offentlige data",
            requiredAttribution: "Norwegian Food Composition Table 2026. The Norwegian Food Safety Authority. www.matvaretabellen.no",
            country: "Norway",
            region: "Europe",
            state: "BOUNDED_STATIC_REVIEWED_COMPOSITION_EVIDENCE",
            runtimePolicy: "ELIGIBLE_VIA_EUROPEAN_PRIMARY_POLICY_V1",
            evidenceTranche: "B23",
            runtimeFetch: false,
            compositionScope: "EXACT_REVIEWED_FOOD_RECORDS_ONLY",
            carbohydrateSemantic: "AVAILABLE_CARBOHYDRATE_MATVARETABELLEN_CHO"
          });

          const pumpkin = Object.freeze({
            canonicalIngredientId: "pumpkin",
            foodId: "06.033",
            foodName: "Pumpkin, raw",
            scientificName: "Cucurbita pepo L.",
            foodEx2: "Pumpkins (A00KH)",
            foodForm: "EXACT_GENERIC_RAW_PUMPKIN_EDIBLE_FLESH",
            matchConfidence: "high",
            matchNotes: "Exact source identity Pumpkin, raw under FoodEx2 Pumpkins with raw/no-heat processing and peel, core and seed removed. Canonical pumpkin is generic and both authored uses are gram-denominated small-cube ingredients. This does not authorize butternut, Hokkaido or another cultivar/species-specific pumpkin record, cooked, roasted, canned or puree forms, the source edible-part yield, or any household-unit conversion.",
            per100g: Object.freeze({
              energyKcal: 40,
              proteinG: 1.0,
              carbohydrateG: 7.3,
              fatG: 0.2,
              fibreG: 3.0
            }),
            fieldEvidence: Object.freeze({
              energyKcal: Object.freeze({ valueType: "Published", method: "Published energy in 100 g: 169 kJ / 40 kcal" }),
              proteinG: Object.freeze({ sourceCode: "420h", valueType: "Weighted", method: "Official source weighted value; source 420h is DTU Frida version 4.1 (2022)" }),
              carbohydrateG: Object.freeze({ sourceCode: "MI0181", valueType: "Best estimate", method: "Carbohydrate, available calculated from sugar and starch (CHO = SUGAR + STARCH)" }),
              fatG: Object.freeze({ sourceCode: "420h", valueType: "Weighted", method: "Official source weighted value; source 420h is DTU Frida version 4.1 (2022)" }),
              fibreG: Object.freeze({ sourceCode: "420h", valueType: "Weighted", method: "Official source weighted value; source 420h is DTU Frida version 4.1 (2022)" })
            }),
            evidenceState: "MATVARETABELLEN_2026_EXACT_COMPOSITION_MATCH",
            sourceId: MATVARETABELLEN_COMPOSITION_SOURCE_B23.id,
            evidenceTranche: "B23"
          });

          export const MATVARETABELLEN_COMPOSITION_DENSITIES_B23 = Object.freeze({ pumpkin });

          export const matvaretabellenCompositionB23ForIngredient = ingredientId =>
            MATVARETABELLEN_COMPOSITION_DENSITIES_B23[ingredientId] || null;
          '''
          source = "\n".join(line[10:] if line.startswith("          ") else line for line in source.splitlines()) + "\n"
          Path("src/data/matvaretabellen-composition-b23.js").write_text(source)

          policy = "src/domain/nutrition-source-policy.js"
          replace_once(policy,
          '''import {
            MATVARETABELLEN_COMPOSITION_DENSITIES_B22,
            MATVARETABELLEN_COMPOSITION_SOURCE_B22
          } from "../data/matvaretabellen-composition-b22.js";
          import {
            USDA_FOUNDATION_DENSITIES,'''.replace("          ", ""),
          '''import {
            MATVARETABELLEN_COMPOSITION_DENSITIES_B22,
            MATVARETABELLEN_COMPOSITION_SOURCE_B22
          } from "../data/matvaretabellen-composition-b22.js";
          import {
            MATVARETABELLEN_COMPOSITION_DENSITIES_B23,
            MATVARETABELLEN_COMPOSITION_SOURCE_B23
          } from "../data/matvaretabellen-composition-b23.js";
          import {
            USDA_FOUNDATION_DENSITIES,'''.replace("          ", ""))

          replace_once(policy,
          '''if (overlappingMatvaretabellenB22Ids.length) {
            throw new Error(`Matvaretabellen B22 must remain a bounded no-overlap composition extension: ${overlappingMatvaretabellenB22Ids.sort().join(", ")}`);
          }

          const formRank = confidence => ({ high: 3, medium: 2, low: 1 }[confidence] || 0);'''.replace("          ", ""),
          '''if (overlappingMatvaretabellenB22Ids.length) {
            throw new Error(`Matvaretabellen B22 must remain a bounded no-overlap composition extension: ${overlappingMatvaretabellenB22Ids.sort().join(", ")}`);
          }

          const matvaretabellenB23Ids = Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B23);
          const overlappingMatvaretabellenB23Ids = matvaretabellenB23Ids.filter(ingredientId =>
            Object.hasOwn(CIQUAL_CANONICAL_DENSITIES, ingredientId) ||
            Object.hasOwn(USDA_FOUNDATION_DENSITIES, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B9, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B11, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B14, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B16, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B18, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B19, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B20, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B22, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B10, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B12, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B13, ingredientId) ||
            Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B21, ingredientId)
          );
          if (overlappingMatvaretabellenB23Ids.length) {
            throw new Error(`Matvaretabellen B23 must remain a bounded no-overlap composition extension: ${overlappingMatvaretabellenB23Ids.sort().join(", ")}`);
          }

          const formRank = confidence => ({ high: 3, medium: 2, low: 1 }[confidence] || 0);'''.replace("          ", ""))

          replace_once(policy,
          '''  if (source === "matvaretabellen-b22") {
            return matvaretabellenCandidate(ingredientId, nutrientKey, MATVARETABELLEN_COMPOSITION_DENSITIES_B22, MATVARETABELLEN_COMPOSITION_SOURCE_B22);
          }

          const record = USDA_FOUNDATION_DENSITIES[ingredientId];'''.replace("          ", ""),
          '''  if (source === "matvaretabellen-b22") {
            return matvaretabellenCandidate(ingredientId, nutrientKey, MATVARETABELLEN_COMPOSITION_DENSITIES_B22, MATVARETABELLEN_COMPOSITION_SOURCE_B22);
          }

            if (source === "matvaretabellen-b23") {
            return matvaretabellenCandidate(ingredientId, nutrientKey, MATVARETABELLEN_COMPOSITION_DENSITIES_B23, MATVARETABELLEN_COMPOSITION_SOURCE_B23);
          }

          const record = USDA_FOUNDATION_DENSITIES[ingredientId];'''.replace("          ", ""))

          replace_once(policy,
          '''    sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b20") ||
            sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b22");'''.replace("          ", ""),
          '''    sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b20") ||
            sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b22") ||
            sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b23");'''.replace("          ", ""))

          replace_once(policy,
          '''    ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B20),
            ...Object.keys(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B21),
            ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B22)
          ])]'''.replace("          ", ""),
          '''    ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B20),
            ...Object.keys(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B21),
            ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B22),
            ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B23)
          ])]'''.replace("          ", ""))

          replace_once(policy,
          '''    matvaretabellenB21SelectedCount: selections.filter(item => item.source === "matvaretabellen" && item.evidenceTranche === "B21").length,
            matvaretabellenB22SelectedCount: selections.filter(item => item.source === "matvaretabellen" && item.evidenceTranche === "B22").length,
            selections'''.replace("          ", ""),
          '''    matvaretabellenB21SelectedCount: selections.filter(item => item.source === "matvaretabellen" && item.evidenceTranche === "B21").length,
            matvaretabellenB22SelectedCount: selections.filter(item => item.source === "matvaretabellen" && item.evidenceTranche === "B22").length,
            matvaretabellenB23SelectedCount: selections.filter(item => item.source === "matvaretabellen" && item.evidenceTranche === "B23").length,
            selections'''.replace("          ", ""))

          decisions_path = Path("scripts/nutrition-unlock-reviewed-decisions-v1.json")
          decisions = json.loads(decisions_path.read_text())
          if "pumpkin" in decisions["decisions"]:
              raise SystemExit("pumpkin decision already exists")
          decisions["decisions"]["pumpkin"] = {
              "decision": "ADMIT_EXACT_MATVARETABELLEN_2026_B23",
              "candidateClass": "COMPOSITION_EVIDENCE",
              "sourceId": "matvaretabellen-2026-composition-b23",
              "foodId": "06.033",
              "foodName": "Pumpkin, raw",
              "scientificName": "Cucurbita pepo L.",
              "foodEx2": "Pumpkins (A00KH)",
              "formMatch": "EXACT_GENERIC_RAW_PUMPKIN_EDIBLE_FLESH",
              "carbohydrateSemantic": "AVAILABLE_CARBOHYDRATE_MATVARETABELLEN_CHO",
              "boundary": "B23 maps only canonical generic pumpkin to the reviewed source identity Pumpkin, raw under FoodEx2 Pumpkins. It does not authorize butternut, Hokkaido or another cultivar/species-specific pumpkin identity, cooked/roasted/canned/puree forms, the source edible-part yield, or any household-unit conversion.",
              "quantityState": "DIRECT_GRAM_AUTHORED_USES_ONLY_NO_PORTION_OR_EDIBLE_YIELD_AUTHORIZATION",
              "runtimeChange": True
          }
          decisions_path.write_text(json.dumps(decisions, indent=2, ensure_ascii=False) + "\n")

          replace_once("THIRD_PARTY_NOTICES.md",
              "B9, B11, B14, B16, B18, B19, B20 and B22 are standalone exact composition roles.",
              "B9, B11, B14, B16, B18, B19, B20, B22 and B23 are standalone exact composition roles.")

          test_source = '''import test from "node:test";
          import assert from "node:assert/strict";
          import {
            MATVARETABELLEN_COMPOSITION_DENSITIES_B23,
            MATVARETABELLEN_COMPOSITION_SOURCE_B23,
            matvaretabellenCompositionB23ForIngredient
          } from "../src/data/matvaretabellen-composition-b23.js";
          import { AUTHORED_RECIPES } from "../src/data/corpus-v1.js";
          import { INGREDIENTS } from "../src/data/ingredients.js";
          import { calculatePerServingFromDensities, publicNutritionSource } from "../src/domain/nutrition.js";
          import { buildNutritionCoverageAudit } from "../src/domain/nutrition-coverage-audit.js";
          import {
            EUROPEAN_PRIMARY_DENSITIES_V1,
            europeanPrimaryPolicyCoverage,
            selectEuropeanPrimaryNutrient
          } from "../src/domain/nutrition-source-policy.js";

          test("B23 source is explicit static Matvaretabellen standalone raw-pumpkin composition evidence", () => {
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B23.id, "matvaretabellen-2026-composition-b23");
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B23.authority, "Norwegian Food Safety Authority (Mattilsynet)");
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B23.releaseDate, "2026-01");
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B23.evidenceTranche, "B23");
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B23.runtimeFetch, false);
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B23.state, "BOUNDED_STATIC_REVIEWED_COMPOSITION_EVIDENCE");
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B23.runtimePolicy, "ELIGIBLE_VIA_EUROPEAN_PRIMARY_POLICY_V1");
            assert.match(MATVARETABELLEN_COMPOSITION_SOURCE_B23.license, /NLOD 2\\.0/);
          });

          test("B23 admits exactly official food 06.033 Pumpkin, raw with reviewed tracked composition", () => {
            assert.deepEqual(Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B23), ["pumpkin"]);
            const pumpkin = matvaretabellenCompositionB23ForIngredient("pumpkin");
            assert.equal(pumpkin.foodId, "06.033");
            assert.equal(pumpkin.foodName, "Pumpkin, raw");
            assert.equal(pumpkin.scientificName, "Cucurbita pepo L.");
            assert.equal(pumpkin.foodEx2, "Pumpkins (A00KH)");
            assert.equal(pumpkin.foodForm, "EXACT_GENERIC_RAW_PUMPKIN_EDIBLE_FLESH");
            assert.deepEqual(pumpkin.per100g, {
              energyKcal: 40,
              proteinG: 1,
              carbohydrateG: 7.3,
              fatG: 0.2,
              fibreG: 3
            });
            assert.equal(pumpkin.fieldEvidence.energyKcal.sourceCode, undefined);
            assert.equal(pumpkin.fieldEvidence.proteinG.sourceCode, "420h");
            assert.equal(pumpkin.fieldEvidence.carbohydrateG.sourceCode, "MI0181");
            assert.equal(pumpkin.fieldEvidence.fatG.sourceCode, "420h");
            assert.equal(pumpkin.fieldEvidence.fibreG.sourceCode, "420h");
          });

          test("repository-native pumpkin semantics establish generic gram-denominated raw inputs", () => {
            assert.equal(INGREDIENTS.pumpkin.name, "pumpkin");
            assert.ok(INGREDIENTS.pumpkin.aliases.includes("calabaza"));
            const rows = AUTHORED_RECIPES
              .filter(recipe => recipe.ingredients.some(ingredient => ingredient.canonicalIngredientId === "pumpkin"))
              .map(recipe => ({
                recipeId: recipe.id,
                ingredient: recipe.ingredients.find(ingredient => ingredient.canonicalIngredientId === "pumpkin")
              }));
            assert.equal(rows.length, 2);
            assert.deepEqual(rows.map(row => row.recipeId).sort(), [
              "indian_pumpkin_red_lentil_dal",
              "med_pumpkin_white_bean_barley_stew"
            ]);
            assert.ok(rows.every(row => row.ingredient.unit === "g"));
            assert.ok(rows.every(row => row.ingredient.preparation === "small cubes"));
            assert.ok(rows.every(row => Number.isFinite(row.ingredient.quantity) && row.ingredient.quantity > 0));
          });

          test("B23 generic raw-pumpkin identity does not bleed into cultivar-specific or processed neighbors", () => {
            for (const unsupported of [
              "pumpkin_butternut",
              "butternut_squash",
              "pumpkin_hokkaido",
              "hokkaido_pumpkin",
              "pumpkin_puree",
              "cooked_pumpkin",
              "courgette"
            ]) {
              assert.equal(matvaretabellenCompositionB23ForIngredient(unsupported), null, unsupported);
              const selection = selectEuropeanPrimaryNutrient(unsupported, "proteinG");
              assert.notEqual(selection?.sourceId, MATVARETABELLEN_COMPOSITION_SOURCE_B23.id, unsupported);
            }
          });

          test("European-primary policy selects exact B23 pumpkin provenance for every tracked nutrient", () => {
            const expectedCodes = {
              energyKcal: [],
              proteinG: ["420h"],
              carbohydrateG: ["MI0181"],
              fatG: ["420h"],
              fibreG: ["420h"]
            };
            for (const [nutrient, sourceCodes] of Object.entries(expectedCodes)) {
              const selection = selectEuropeanPrimaryNutrient("pumpkin", nutrient);
              assert.equal(selection.source, "matvaretabellen", nutrient);
              assert.equal(selection.sourceId, MATVARETABELLEN_COMPOSITION_SOURCE_B23.id, nutrient);
              assert.equal(selection.sourceIdentifier, "06.033", nutrient);
              assert.equal(selection.evidenceTranche, "B23", nutrient);
              assert.equal(selection.selectionReason, "ONLY_REVIEWED_SOURCE_AVAILABLE", nutrient);
              assert.deepEqual(selection.sourceCodes, sourceCodes, nutrient);
            }
            assert.equal(selectEuropeanPrimaryNutrient("pumpkin", "carbohydrateG").semantic, "AVAILABLE_CARBOHYDRATE_MATVARETABELLEN_CHO");
            const coverage = europeanPrimaryPolicyCoverage(["pumpkin"]);
            assert.equal(coverage.matvaretabellenB23SelectedCount, 5);
            assert.equal(coverage.matvaretabellenSelectedCount, 5);
          });

          test("B23 composition evidence does not authorize the source edible-part yield or a household portion", () => {
            const pumpkin = matvaretabellenCompositionB23ForIngredient("pumpkin");
            assert.equal(pumpkin.gramsPerUnit, undefined);
            assert.equal(pumpkin.units, undefined);
            assert.equal(pumpkin.sourcePortionId, undefined);
            assert.equal(pumpkin.ediblePartPercent, undefined);
          });

          test("B23 removes exactly two pumpkin density blockers while preserving independent blockers", () => {
            const audit = buildNutritionCoverageAudit(AUTHORED_RECIPES, publicNutritionSource);
            assert.equal(audit.authoritativeRecipeCount, 16);
            assert.equal(audit.estimateRecipeCount, 60);
            assert.equal(audit.blockerCounts.missing_density, 89);

            const dal = audit.recipeDetails.find(row => row.recipeId === "indian_pumpkin_red_lentil_dal");
            assert.equal(dal.authoritative, false);
            assert.ok(!dal.blockers.some(blocker => blocker.ingredientId === "pumpkin"));
            assert.ok(dal.blockers.some(blocker => blocker.ingredientId === "garam_masala"));

            const stew = audit.recipeDetails.find(row => row.recipeId === "med_pumpkin_white_bean_barley_stew");
            assert.equal(stew.authoritative, false);
            assert.ok(!stew.blockers.some(blocker => blocker.ingredientId === "pumpkin"));
          });

          test("B23 available carbohydrate remains incompatible with USDA carbohydrate-by-difference", () => {
            const recipe = {
              ingredients: [
                { canonicalIngredientId: "pumpkin", quantity: 100, unit: "g" },
                { canonicalIngredientId: "synthetic_usda", quantity: 100, unit: "g" }
              ],
              serving: { servings: 1 }
            };
            const densityMap = {
              pumpkin: EUROPEAN_PRIMARY_DENSITIES_V1.pumpkin,
              synthetic_usda: {
                per100g: { energyKcal: 1, proteinG: 1, carbohydrateG: 1, fatG: 1, fibreG: 1 },
                provenanceByNutrient: {
                  carbohydrateG: { semantic: "CARBOHYDRATE_BY_DIFFERENCE_USDA_1005" }
                }
              }
            };
            const result = calculatePerServingFromDensities(recipe, densityMap);
            assert.equal(result.nutrientCoverage.carbohydrateG.semanticCompatibility, false);
            assert.equal(result.nutrientCoverage.carbohydrateG.semanticIssue, "mixed_incompatible_carbohydrate_semantics");
            assert.equal(result.perServing.carbohydrateG, null);
            assert.equal(result.complete, false);
          });
          '''
          test_source = "\n".join(line[10:] if line.startswith("          ") else line for line in test_source.splitlines()) + "\n"
          Path("tests/matvaretabellen-composition-b23.test.js").write_text(test_source)

          for filename in [
              "tests/matvaretabellen-composition-b18.test.js",
              "tests/matvaretabellen-composition-b19.test.js",
              "tests/matvaretabellen-composition-b20.test.js",
              "tests/matvaretabellen-composition-b21.test.js",
              "tests/matvaretabellen-composition-b22.test.js",
              "tests/nutrition-coverage-audit.test.js"
          ]:
              p = Path(filename)
              text = p.read_text()
              text = text.replace("audit.blockerCounts.missing_density, 91", "audit.blockerCounts.missing_density, 89")
              text = text.replace("missing_density: 91,", "missing_density: 89,")
              p.write_text(text)

          audit_test = Path("tests/nutrition-coverage-audit.test.js")
          text = audit_test.read_text().replace(
              'test("B22 exact raw-mint composition preserves cumulative unlock truth without weakening fail-closed controls",',
              'test("B23 exact raw-pumpkin composition preserves cumulative unlock truth without weakening fail-closed controls",'
          )
          audit_test.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Focused B23 test
        run: node --test tests/matvaretabellen-composition-b23.test.js
      - name: Full deterministic test suite
        run: npm test
      - name: Validate public V0
        run: npm run validate
      - name: Measure B23 audit truth
        run: node scripts/report-nutrition-unlock-priorities.mjs
      - name: Commit permanent B23 tranche and remove temporary workflow
        run: |
          git rm .github/workflows/nutrition-b23-priority.yml
          git add THIRD_PARTY_NOTICES.md scripts/nutrition-unlock-reviewed-decisions-v1.json src/data/matvaretabellen-composition-b23.js src/domain/nutrition-source-policy.js tests
          git config user.name "Raul M."
          git config user.email "67912886+DataRaul@users.noreply.github.com"
          git commit -m "Nutrition B23: add exact raw pumpkin composition evidence"
          git push origin HEAD:agent/nutrition-b23-priority-reconciliation

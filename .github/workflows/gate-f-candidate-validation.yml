name: Gate F candidate validation
on:
  push:
    branches: [v1-1-recipe-corpus-gate-f-wikibooks]
    paths:
      - .github/workflows/gate-f-candidate-validation.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-1-recipe-corpus-gate-f-wikibooks
          fetch-depth: 0
      - name: Reconcile current main and Gate F roadmap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ "$unresolved" != "docs/ROADMAP.md" ]; then
              echo "Unexpected merge conflicts: $unresolved" >&2
              exit 1
            fi
            git checkout --ours docs/ROADMAP.md
            git add docs/ROADMAP.md
            git commit --no-edit
          fi
          git show origin/main:docs/ROADMAP.md > docs/ROADMAP.md
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("docs/ROADMAP.md")
          text = p.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f"ROADMAP reconciliation anchor missing: {label}")
              text = text.replace(old, new, 1)

          replace_once(
              "| V1.1 / Recipe Corpus Gate F | OPEN / BLOCKING | Brain-side discovery/rights/verification scaffolding exists; app-owned external `RecipeSource` ingestion, provenance rendering, tests and human acceptance remain required |",
              "| V1.1 / Recipe Corpus Gate F | VALIDATED CANDIDATE / HUMAN ACCEPTANCE REQUIRED | bounded Wikibooks RecipeSource + exact provenance + coverage/safety validation; public acceptance pending |",
              "Gate F table row",
          )
          replace_once(
              "## V1.1 Recipe Corpus Gate F — OPEN / BLOCKING",
              "## V1.1 Recipe Corpus Gate F — VALIDATED CANDIDATE / HUMAN ACCEPTANCE REQUIRED",
              "Gate F heading",
          )

          mandatory_pattern = re.compile(r"### Mandatory initial corpus\n\n.*?\n\n### Ownership and runtime contract", re.S)
          mandatory_replacement = "\n".join([
              "### Mandatory initial corpus",
              "",
              "**Wikibooks Cookbook is the first external recipe acquisition source for the public app.** The exact rights/provenance audit is complete and passes for a bounded **text-only CC BY-SA 4.0** path with page/revision provenance, Wikibooks contributor attribution, ShareAlike and transformation notices. No Wikibooks images or other media are admitted.",
              "",
              "The Brain/Atlas source-navigation snapshot on its separate development lineage recorded 3,825 English recipe pages plus 158 cuisine pages. The later bounded Gate F acquisition run measured **3,792 current pages in English Wikibooks `Category:Recipes`**. These are discovery/navigation counts, not normalized dish-family counts or claims of balanced world coverage. Gate F bundles only **eight manually reviewed exact revisions**.",
              "",
              "### Ownership and runtime contract",
          ])
          text, count = mandatory_pattern.subn(mandatory_replacement, text, count=1)
          if count != 1:
              raise SystemExit("ROADMAP reconciliation anchor missing: Mandatory initial corpus section")

          replace_once(
              "Freshness-sensitive/trending coverage is expected to need later sources because Wikibooks is a floor, not a complete universe. Additional corpora may be admitted only for a named coverage or evidence gain under the same provenance/rights rules.\n\n### Exit criteria\n\nGate F remains **OPEN / BLOCKING** until all of the following are true:",
              "Freshness-sensitive/trending coverage is expected to need later sources because Wikibooks is a floor, not a complete universe. Additional corpora may be admitted only for a named coverage or evidence gain under the same provenance/rights rules.\n\n### Current candidate state\n\nThe app-owned RecipeSource universe is now **84 recipes**: 76 curated project-authored records plus eight exact-revision Wikibooks records, normalized into **83 dish families**. The `spanish_potato_omelet` family explicitly preserves one authored and one external variant instead of silently replacing either.\n\nOnly **Baba Ganoush** and **Bruschetta (base)** are `SEARCH_ONLY`; six external records remain `REFERENCE_ONLY_INCOMPLETE_HARD_METADATA` because source-backed hard metadata is incomplete. Missing time/serving values remain unknown rather than guessed. The seven-role audit truthfully leaves `contemporary_modern` and `genuinely_new_trending` uncovered in this first tranche.\n\nExternal source nutrition is explicitly **not** imported as authoritative NutritionSource composition. RecipeSource, NutritionSource and regulatory evidence remain separate truth lanes; allergens, dietary constraints, permanent exclusions, quantity semantics and fail-closed recommendation policy remain intact. The private Knowledge Core remains offline at runtime. The authored 76-recipe B6 nutrition baseline remains frozen independently.\n\n### Exit criteria\n\nThe technical candidate implements and validates the following requirements; Gate F remains incomplete until the final human acceptance item passes:",
              "Gate F candidate/exit block",
          )
          replace_once(
              "Until then, `V1.x / Corpus breadth` is **GATED** rather than complete merely because authored recipes or Atlas candidates increase.",
              "All technical Gate F criteria are represented in the candidate and automated validation. **Human acceptance of the deployed public external corpus is the sole remaining Gate F exit decision.** Until that acceptance is explicit, Gate F must not be marked COMPLETE; `V1.x / Corpus breadth` remains **GATED** rather than complete merely because authored recipes or Atlas candidates increase.",
              "Gate F terminal state",
          )

          p.write_text(text)
          PY
          git diff --check
          if ! git diff --quiet -- docs/ROADMAP.md; then
            git add docs/ROADMAP.md
            git commit -m "Reconcile Gate F with current roadmap"
          fi
          git push origin HEAD:v1-1-recipe-corpus-gate-f-wikibooks
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run validate
      - run: npm run test:matrix
      - run: npm run report:recipe-universe
      - run: npm run verify:wikibooks-gate-f
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/culinary-http.log 2>&1 &
      - run: npm run test:browser

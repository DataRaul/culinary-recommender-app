name: Corpus Scale Step 8G Turabi v8006 live implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-turabi-v8006-live.yml'
      - 'data/generated/step8g/v8006-runtime-descriptor.mjs'
      - 'src/server/step8g-v8006-live-runtime.mjs'
      - 'src/server/step8g-v8006-hydration-runtime.mjs'
      - 'functions/api/step8g/v8006.js'
      - 'scripts/verify-step8g-v8006-live-payloads.mjs'
      - 'tests/step8g-v8006-live.test.js'
      - 'step8g-v8006-populate.html'
      - 'data/generated/step8g/ora-turabi-v8006-prewrite-evidence.json'
      - 'data/generated/step8g/ora-turabi-v8006-prewrite-validation.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-step8g-turabi-v8006-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4

      - name: Checkout pinned Open Recipe Archive source
        uses: actions/checkout@v4
        with:
          repository: AdamBouhmad/open-recipe-archive
          ref: ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
          path: open-recipe-archive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v8006 prewrite remains the implementation authority
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('data/generated/step8g/ora-turabi-v8006-prewrite-evidence.json','utf8'));
          const v=JSON.parse(fs.readFileSync('data/generated/step8g/ora-turabi-v8006-prewrite-validation.json','utf8'));
          if(e.pass!==true||v.pass!==true||e.parent?.activeCorpusVersion!=='v8005'||e.parent?.composedRecipeCount!==2464||e.layer?.corpusVersion!=='v8006'||e.layer?.recipeCount!==442||e.composition?.cumulativeRecipeCount!==2906||e.layer?.operationBudget?.maxPlannedD1Subqueries!==16||e.layer?.operationBudget?.headroomAssumed!==false||e.boundaries?.liveD1WritesPerformed!==0) process.exit(1);
          NODE

      - name: Run v8006 runtime unit tests
        run: node --test tests/step8g-v8006-live.test.js

      - name: Regenerate exact source/body/route fingerprints
        run: node scripts/verify-step8g-v8006-live-payloads.mjs --candidate=./open-recipe-archive

      - name: Assert implementation remains non-public and non-billing
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('step8g-v8006-populate.html','utf8');
          const api=fs.readFileSync('functions/api/step8g/v8006.js','utf8');
          if(!html.includes('owner-only')||!html.includes('2,906')||!html.includes('six-layer hydration')) process.exit(1);
          if(!api.includes('STEP8G_V8006_FREE_LIMIT_FAIL_CLOSED')||!api.includes('publicRuntimeChanged:false')||!api.includes('billingExpansion:false')) process.exit(1);
          NODE

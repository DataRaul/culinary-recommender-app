name: Corpus scale Step 1 benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/corpus-scale-step1.yml"
      - "docs/CORPUS_SCALE_STEP1_CONTRACT.md"
      - "package.json"
      - "scripts/corpus-scale-step1-core.mjs"
      - "scripts/run-corpus-scale-step1.mjs"
      - "tests/corpus-scale-step1.test.js"

concurrency:
  group: corpus-scale-step1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Step 1 contract tests
        run: node --test tests/corpus-scale-step1.test.js
      - name: Run deterministic 1k to 100k benchmark
        run: npm run benchmark:corpus-scale-step1

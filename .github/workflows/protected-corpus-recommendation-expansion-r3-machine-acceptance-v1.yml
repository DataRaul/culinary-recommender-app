name: Protected corpus recommendation expansion R3 machine acceptance

on:
  pull_request:
    paths:
      - "config/protected_corpus_recommendation_expansion_r3_machine_acceptance_v1.json"
      - "data/generated/protected-corpus-recommendation-expansion-r2-hard-safety-summary-v1.json"
      - "data/generated/protected-corpus-recommendation-expansion-r3-chimichurri-candidate-v1.json"
      - "data/generated/protected-corpus-recommendation-expansion-r3-machine-acceptance-summary-v1.json"
      - "scripts/protected-corpus-recommendation-expansion-r3-machine-acceptance-core.mjs"
      - "scripts/run-protected-corpus-recommendation-expansion-r3-machine-acceptance-v1.mjs"
      - "tests/protected-corpus-recommendation-expansion-r3-machine-acceptance-v1.test.js"
      - ".github/workflows/protected-corpus-recommendation-expansion-r3-machine-acceptance-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-r3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checkout exact pinned UniTools
        run: |
          git clone --filter=blob:none https://github.com/farcrak/unitools-recipes.git .tmp/unitools
          git -C .tmp/unitools checkout --detach 1d09e9548d957dd0375301146a86dddf5e269c1b
      - name: Run deterministic R3 tests
        run: node --test tests/protected-corpus-recommendation-expansion-r3-machine-acceptance-v1.test.js
      - name: Reproduce R3 machine acceptance
        run: |
          node scripts/run-protected-corpus-recommendation-expansion-r3-machine-acceptance-v1.mjs \
            --contract=config/protected_corpus_recommendation_expansion_r3_machine_acceptance_v1.json \
            --r2=data/generated/protected-corpus-recommendation-expansion-r2-hard-safety-summary-v1.json \
            --candidate=data/generated/protected-corpus-recommendation-expansion-r3-chimichurri-candidate-v1.json \
            --unitools=.tmp/unitools \
            --summary=.tmp/protected-corpus-recommendation-expansion-r3-machine-acceptance-v1.json
      - name: Compare committed R3 evidence
        run: diff -u data/generated/protected-corpus-recommendation-expansion-r3-machine-acceptance-summary-v1.json .tmp/protected-corpus-recommendation-expansion-r3-machine-acceptance-v1.json

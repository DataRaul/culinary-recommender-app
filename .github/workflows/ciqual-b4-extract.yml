name: One-off Ciqual 2025 B4 reviewed extract
on:
  push:
    branches: [v1-european-evidence-b4]
    paths:
      - '.github/workflows/ciqual-b4-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download official Ciqual 2025 XML files
        run: |
          curl --fail --location --retry 3 --output /tmp/alim.xml 'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/OH8KXC'
          curl --fail --location --retry 3 --output /tmp/const.xml 'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/FWSPCX'
          curl --fail --location --retry 3 --output /tmp/compo.xml 'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/O73GDX'
          test "$(stat -c%s /tmp/alim.xml)" -gt 1000000
          test "$(stat -c%s /tmp/const.xml)" -gt 10000
          test "$(stat -c%s /tmp/compo.xml)" -gt 60000000
      - name: Extract reviewed B4 composition
        run: node scripts/extract-ciqual-b4.mjs /tmp/alim.xml /tmp/const.xml /tmp/compo.xml scripts/ciqual-b4-reviewed-targets.json /tmp/ciqual-b4-reviewed.json
      - uses: actions/upload-artifact@v4
        with:
          name: ciqual-b4-reviewed-extract
          path: /tmp/ciqual-b4-reviewed.json
          retention-days: 1

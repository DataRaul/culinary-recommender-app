name: Corpus Scale Step 8G ORA next-source discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-ora-next-source-discovery.yml'
      - 'scripts/corpus-scale-step8g-ora-next-source-discovery-core.mjs'
      - 'scripts/run-corpus-scale-step8g-ora-next-source-discovery.mjs'
      - 'tests/corpus-scale-step8g-ora-next-source-discovery.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-step8g-ora-next-source-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-next-ora-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4

      - name: Checkout pinned Open Recipe Archive
        uses: actions/checkout@v4
        with:
          repository: AdamBouhmad/open-recipe-archive
          ref: ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
          path: open-recipe-archive

      - name: Checkout pinned ForkRecipe protected baseline
        uses: actions/checkout@v4
        with:
          repository: futurechef/forkrecipe-recipes
          ref: c32255266af39bd77444d39452f3df8088ac8fd9
          path: forkrecipe

      - name: Checkout pinned UniTools protected baseline
        uses: actions/checkout@v4
        with:
          repository: farcrak/unitools-recipes
          ref: 1d09e9548d957dd0375301146a86dddf5e269c1b
          path: unitools

      - name: Checkout pinned CC0 protected baseline
        uses: actions/checkout@v4
        with:
          repository: sylGauthier/recipes
          ref: b12e481d1c220a13e0847a34e148d5872a16928e
          path: cc0-recipes

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test source-discovery contract
        run: node --test tests/corpus-scale-step8g-ora-next-source-discovery.test.js

      - name: Scan source-level ORA cohorts against active v8018 baseline
        run: >-
          node scripts/run-corpus-scale-step8g-ora-next-source-discovery.mjs
          --ora=./open-recipe-archive
          --forkrecipe=./forkrecipe
          --unitools=./unitools
          --cc0=./cc0-recipes
          --out=.tmp/step8g-ora-next-source-discovery

      - name: Verify discovery remains no-write and cannot clear rights
        run: >-
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(".tmp/step8g-ora-next-source-discovery/discovery.json","utf8"));
          if(p.baseline.activeProtectedVersion!=="v8018"||p.baseline.activeProtectedCount!==19268)process.exit(1);
          const b=p.boundaries;
          if(b.liveD1WritesPerformed!==0||b.sourceRightsClearedByDiscovery!==false||b.measurementEarnedByDiscovery!==false||b.protectedPopulationAuthorized!==false||b.publicRuntimeChangeAuthorized!==false||b.recommendationAdmissionAuthorized!==false||b.thirdShardAuthorized!==false||b.d1BudgetExpansionAuthorized!==false||b.billingExpansionAuthorized!==false)process.exit(1);
          if(p.exclusions.heldCollections.includes("cocina-espanola")!==true)process.exit(1);
          const held=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://archive.org/details/b28112982");
          if(!held||held.reason!=="ORA_AUTHOR_METADATA_CONFLICTS_WITH_EXACT_1901_SOURCE_BIBLIOGRAPHY")process.exit(1);
          const excluded=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/b28112982");
          if(!excluded||!excluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          const ceskaHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://archive.org/details/ceska_kucharka-dumkova");
          if(!ceskaHeld||ceskaHeld.reason!=="ORA_AUTHOR_METADATA_CONFLICTS_WITH_CZECH_NATIONAL_LIBRARY_1883_MONOGRAPH")process.exit(1);
          const ceskaExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/ceska_kucharka-dumkova");
          if(!ceskaExcluded||!ceskaExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          const annaHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://archive.org/details/b21525936");
          if(!annaHeld||annaHeld.reason!=="ORA_AUTHOR_METADATA_CONFLICTS_WITH_EXACT_1825_SOURCE_BIBLIOGRAPHY_ANNA_HOFBAUER")process.exit(1);
          const annaExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/b21525936");
          if(!annaExcluded||!annaExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          const menon=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/b22019935");
          if(!menon||!menon.reasons.includes("ALREADY_PROTECTED_SOURCE"))process.exit(1);
          const artusi=p.excludedSources.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/59047");
          if(!artusi||!artusi.reasons.includes("ALREADY_PROTECTED_SOURCE"))process.exit(1);
          const froken=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/frkenjensensko00jens");
          if(!froken||!froken.reasons.includes("ALREADY_PROTECTED_SOURCE"))process.exit(1);
          const seleskowitz=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/bub_gb_oP8yAQAAMAAJ");
          if(!seleskowitz||!seleskowitz.reasons.includes("ALREADY_PROTECTED_SOURCE"))process.exit(1);
          const viard=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/lecuisinierimpe00viargoog");
          if(!viard||!viard.reasons.includes("ALREADY_PROTECTED_SOURCE"))process.exit(1);
          const hearn=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/lacuisinecreolec00hear");
          if(!hearn||!hearn.reasons.includes("ALREADY_PROTECTED_SOURCE"))process.exit(1);
          const chan=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/chinesecookbook00chan");
          if(!chan||!chan.reasons.includes("ALREADY_PROTECTED_SOURCE"))process.exit(1);
          const kenney=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/culinaryjottings00kenn");
          if(!kenney||!kenney.reasons.includes("ALREADY_PROTECTED_SOURCE"))process.exit(1);
          const fannie=p.excludedSources.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/65061");
          if(!fannie||!fannie.reasons.includes("ALREADY_PROTECTED_SOURCE"))process.exit(1);
          const atrutel=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/b2807967x");
          if(!atrutel||!atrutel.reasons.includes("ALREADY_PROTECTED_SOURCE"))process.exit(1);
          const wanneeHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://archive.org/details/bwb_Y0-BXP-037");
          if(!wanneeHeld||wanneeHeld.reason!=="ORA_1910_WORK_YEAR_POINTS_TO_1958_14TH_EDITION_WITH_LATER_EDITORIAL_RIGHTS_LAYER")process.exit(1);
          const wanneeExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/bwb_Y0-BXP-037");
          if(!wanneeExcluded||!wanneeExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          const schillerHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/52879");
          if(!schillerHeld||schillerHeld.reason!=="ORA_SOURCE_YEAR_1858_CONFLICTS_WITH_EXACT_GUTENBERG_1843_TITLE_PAGE_AND_BIBLIOGRAPHY")process.exit(1);
          const schillerExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/52879");
          if(!schillerExcluded||!schillerExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          const indianHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://archive.org/details/cu31924059630735");
          if(!indianHeld||indianHeld.reason!=="ORA_AUTHOR_METADATA_E_P_VEERASAWMY_CONFLICTS_WITH_EXACT_ARCHIVE_ITEM_MRS_I_R_DEY")process.exit(1);
          const indianExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/cu31924059630735");
          if(!indianExcluded||!indianExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          const heylHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/13921");
          if(!heylHeld||heylHeld.reason!=="EXACT_1905_EDITION_CREDITS_UNIDENTIFIED_FRAU_DR_ENGELKEN_WITH_NEW_ORDERING_AND_ADDITIONS__CONTRIBUTOR_TERM_UNRESOLVED")process.exit(1);
          const heylExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/13921");
          if(!heylExcluded||!heylExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          const gorritiHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://archive.org/details/cocina-eclectica-juana-manuela-gorriti");
          if(!gorritiHeld||gorritiHeld.reason!=="COMMUNITY_COOKBOOK_SEPARATELY_ATTRIBUTED_CONTRIBUTOR_TERMS_UNRESOLVED_SPAIN_FACING")process.exit(1);
          const gorritiExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/cocina-eclectica-juana-manuela-gorriti");
          if(!gorritiExcluded||!gorritiExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          const americanHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/12815");
          if(!americanHeld||americanHeld.reason!=="EXACT_1796_EDITION_UNNAMED_PRESS_PREPARER_ALTERATIONS__ORA_EXTRACT_PRESERVES_UNCORRECTED_RECIPE_VALUES")process.exit(1);
          const americanExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/12815");
          if(!americanExcluded||!americanExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          if(p.topRightsReviewCandidates?.some(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/12815"))process.exit(1);
          const beetonHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/10136");
          if(!beetonHeld||beetonHeld.reason!=="BEETON_1861_RECIPE_MATTER_FROM_UNNAMED_CORRESPONDENTS_PRIVATE_CIRCLE_AND_OTHER_WRITERS__ORA_FLATTENS_TO_BEETON")process.exit(1);
          const beetonExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/10136");
          if(!beetonExcluded||!beetonExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          if(p.topRightsReviewCandidates?.some(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/10136"))process.exit(1);
          const leslieHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/60025");
          if(!leslieHeld||leslieHeld.reason!=="ORA_SOURCE_YEAR_1851_CONFLICTS_WITH_EXACT_GUTENBERG_1853_FORTY_NINTH_REVISED_EDITION")process.exit(1);
          const leslieExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/60025");
          if(!leslieExcluded||!leslieExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          if(p.topRightsReviewCandidates?.some(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/60025"))process.exit(1);
          const whitehouseHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/13923");
          if(!whitehouseHeld||whitehouseHeld.reason!=="ORA_SINGLE_AUTHOR_GILLETTE_CONFLICTS_WITH_EXACT_TWO_AUTHOR_GILLETTE_AND_ZIEMANN")process.exit(1);
          const whitehouseExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/13923");
          if(!whitehouseExcluded||!whitehouseExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          if(p.topRightsReviewCandidates?.some(x=>x.sourceUrl==="https://www.gutenberg.org/ebooks/13923"))process.exit(1);
          const greenbaumHeld=p.exclusions.heldSources?.find(x=>x.sourceUrl==="https://archive.org/details/cu31924003580952");
          if(!greenbaumHeld||greenbaumHeld.reason!=="VERIFIED_AUTHOR_DEATH_DATE_ABSENT__SPAIN_TERM_UNCOMPUTABLE")process.exit(1);
          const greenbaumExcluded=p.excludedSources.find(x=>x.sourceUrl==="https://archive.org/details/cu31924003580952");
          if(!greenbaumExcluded||!greenbaumExcluded.reasons.includes("SOURCE_RIGHTS_OR_PROVENANCE_HOLD"))process.exit(1);
          if(p.topRightsReviewCandidates?.some(x=>x.sourceUrl==="https://archive.org/details/cu31924003580952"))process.exit(1);
          if(!Number.isInteger(p.rightsReviewEligibleCount)||p.rightsReviewEligibleCount<0)process.exit(1);
          console.log(JSON.stringify({terminal:p.terminal,rightsReviewEligibleCount:p.rightsReviewEligibleCount,nextSource:p.topRightsReviewCandidates?.[0]?.sourceTitle||null,nextAuthority:p.nextAuthority}));'

      - name: Expose compact discovery summary
        id: metrics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('.tmp/step8g-ora-next-source-discovery/discovery.json', 'utf8'));
          const fields = {
            groups: p.sourceGroupCount,
            measured: p.measuredCandidateCount,
            eligible: p.rightsReviewEligibleCount,
            collections: p.collectionCount
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(fields).map(([k,v]) => `${k}=${v}\n`).join(''));
          NODE

      - name: Upload no-write discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: step8g-ora-next-discovery-c${{ steps.metrics.outputs.collections }}-g${{ steps.metrics.outputs.groups }}-m${{ steps.metrics.outputs.measured }}-e${{ steps.metrics.outputs.eligible }}
          path: .tmp/step8g-ora-next-source-discovery/discovery.json
          if-no-files-found: error
          retention-days: 30

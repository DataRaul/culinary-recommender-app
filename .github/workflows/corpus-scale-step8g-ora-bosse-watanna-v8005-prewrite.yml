name: Corpus Scale Step 8G Bosse Watanna v8005 prewrite

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-ora-bosse-watanna-v8005-prewrite.yml'
      - 'scripts/corpus-scale-step8g-ora-bosse-watanna-prewrite-core.mjs'
      - 'scripts/run-corpus-scale-step8g-ora-bosse-watanna-prewrite.mjs'
      - 'scripts/verify-step8g-ora-bosse-watanna-v8005-prewrite.mjs'
      - 'tests/corpus-scale-step8g-ora-bosse-watanna-v8005-prewrite.test.js'
      - 'tests/corpus-scale-step8g-v8005-prewrite-closeout.test.js'
      - 'data/generated/step8g/ora-bosse-watanna-1914-measurement.json'
      - 'data/generated/step8g/ora-bosse-watanna-v8005-prewrite-evidence.json'
      - 'data/generated/step8g/ora-bosse-watanna-v8005-prewrite-validation.json'
      - 'data/generated/step8g/ora-abbott-v8004-prewrite-evidence.json'
      - 'data/generated/step8g/ora-abbott-v8004-live-pass.json'
      - 'data/generated/step8g/v8004-runtime-descriptor.mjs'
      - 'docs/CORPUS_SCALE_STEP8G_ORA_BOSSE_WATANNA_V8005_PREWRITE.md'
      - 'config/corpus_scale_step8_roadmap.json'
      - 'docs/handovers/CURRENT.json'
      - 'docs/handovers/PREVIOUS.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-step8g-bosse-watanna-v8005-prewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prewrite-v8005:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4

      - name: Checkout pinned Open Recipe Archive source
        uses: actions/checkout@v4
        with:
          repository: AdamBouhmad/open-recipe-archive
          ref: ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
          path: open-recipe-archive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test v8005 prewrite contract
        run: node --test tests/corpus-scale-step8g-ora-bosse-watanna-v8005-prewrite.test.js

      - name: Build exact v8005 no-write prewrite
        run: >-
          node scripts/run-corpus-scale-step8g-ora-bosse-watanna-prewrite.mjs
          --ora=./open-recipe-archive
          --measurement=./data/generated/step8g/ora-bosse-watanna-1914-measurement.json
          --parent-prewrite=./data/generated/step8g/ora-abbott-v8004-prewrite-evidence.json
          --parent-live=./data/generated/step8g/ora-abbott-v8004-live-pass.json
          --out=.tmp/step8g-ora-bosse-watanna-v8005-prewrite

      - name: Verify request and complete D1-operation envelope
        run: >-
          node scripts/verify-step8g-ora-bosse-watanna-v8005-prewrite.mjs
          --evidence=.tmp/step8g-ora-bosse-watanna-v8005-prewrite/evidence.json
          --plan=.tmp/step8g-ora-bosse-watanna-v8005-prewrite/population-plan-descriptors.json
          --out=.tmp/step8g-ora-bosse-watanna-v8005-prewrite/prewrite-validation.json

      - name: Verify canonical freeze matches regenerated evidence
        run: |
          cmp -s .tmp/step8g-ora-bosse-watanna-v8005-prewrite/evidence.json data/generated/step8g/ora-bosse-watanna-v8005-prewrite-evidence.json
          cmp -s .tmp/step8g-ora-bosse-watanna-v8005-prewrite/prewrite-validation.json data/generated/step8g/ora-bosse-watanna-v8005-prewrite-validation.json
          node --test tests/corpus-scale-step8g-v8005-prewrite-closeout.test.js

      - name: Upload v8005 prewrite evidence
        uses: actions/upload-artifact@v4
        with:
          name: step8g-ora-bosse-watanna-v8005-prewrite
          path: .tmp/step8g-ora-bosse-watanna-v8005-prewrite
          if-no-files-found: error
          retention-days: 30

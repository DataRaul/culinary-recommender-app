name: Ciqual B5 extract

on:
  push:
    branches:
      - v1-nutrition-b5-ciqual-coverage
    paths:
      - scripts/ciqual-b5-reviewed-targets.json
      - .github/workflows/ciqual-b5-extract.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download official Ciqual XML inputs
        run: |
          curl -L --fail --retry 3 'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/OH8KXC' -o alim.xml
          curl -L --fail --retry 3 'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/FWSPCX' -o const.xml
          curl -L --fail --retry 3 'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/O73GDX' -o compo.xml
      - name: Verify official input checksums
        run: |
          echo '8e1171d63cee4b6010cfce25dd29243d  alim.xml' | md5sum -c -
          echo 'd8f2f25fdacb887bc993a6eeaf80f203  const.xml' | md5sum -c -
          echo '2da725585946434df320d8041631998b  compo.xml' | md5sum -c -
      - name: Extract reviewed records
        run: node scripts/extract-ciqual-b4.mjs alim.xml const.xml compo.xml scripts/ciqual-b5-reviewed-targets.json ciqual-b5-reviewed.json
      - uses: actions/upload-artifact@v4
        with:
          name: ciqual-b5-reviewed
          path: ciqual-b5-reviewed.json
          retention-days: 1

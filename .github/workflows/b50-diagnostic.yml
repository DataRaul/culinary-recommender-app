name: B50 focused diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/b50-diagnostic.mjs"
      - "src/data/afcd-composition-b50.js"
      - "src/domain/nutrition-source-policy-runtime.js"
      - "src/domain/nutrition.js"
      - "src/data/recipes*.js"
      - "src/data/corpus-v1.js"
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/b50-diagnostic.mjs

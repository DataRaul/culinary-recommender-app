name: Wikibooks Gate F discovery
on:
  push:
    branches: [v1-1-recipe-corpus-gate-f-wikibooks]
    paths:
      - scripts/wikibooks-gate-f-discover.mjs
      - .github/workflows/wikibooks-gate-f-discovery.yml
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wikibooks-gate-f-discover.mjs

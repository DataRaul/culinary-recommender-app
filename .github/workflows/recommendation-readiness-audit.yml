name: Recommendation readiness audit

on:
  pull_request:
    paths:
      - "config/recommendation_readiness_audit_v1.json"
      - "config/recommendation_readiness_repair_v1.json"
      - "scripts/recommendation-readiness-core.mjs"
      - "scripts/run-recommendation-readiness-audit.mjs"
      - "tests/recommendation-readiness-core.test.js"
      - "tests/recommendation-readiness-current-runtime.test.js"
      - "data/generated/recommendation-readiness-audit-v1.json"
      - "docs/RECOMMENDATION_READINESS_AUDIT_V1.md"
      - "src/domain/recommendation.js"
      - ".github/workflows/recommendation-readiness-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run readiness semantic tests
        run: node --test tests/recommendation-readiness-core.test.js tests/recommendation-readiness-current-runtime.test.js
      - name: Verify frozen V1 evidence remains historical
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; const contract=JSON.parse(readFileSync("config/recommendation_readiness_audit_v1.json","utf8")); const frozen=JSON.parse(readFileSync("data/generated/recommendation-readiness-audit-v1.json","utf8")); assert.equal(contract.expectedPublicRuntimeRecipeCount,85); assert.equal(frozen.publicRuntime.recipeCount,85); assert.equal(frozen.publicRuntime.recommendationEligibleStateCount,77); assert.equal(frozen.terminal,"USABLE_RECOMMENDATION_BASELINE_PASS");'

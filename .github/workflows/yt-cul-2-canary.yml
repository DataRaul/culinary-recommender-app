name: YT-CUL-2 tiny live connectivity canary

on:
  push:
    branches:
      - agent/yt-cul-2-live-canary
    paths:
      - .github/workflows/yt-cul-2-canary.yml
      - scripts/run-youtube-culinary-connectivity-canary.mjs
      - tests/youtube-culinary-connectivity-canary.test.js
      - docs/YT_CUL_2_CONNECTIVITY_CANARY_CONTRACT.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yt-cul-2-connectivity-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CULINARY_YOUTUBE_API_KEY: ${{ secrets.CULINARY_YOUTUBE_API_KEY }}
      CULINARY_YOUTUBE_SEARCH_DAILY_LIMIT: ${{ vars.CULINARY_YOUTUBE_SEARCH_DAILY_LIMIT }}
      CULINARY_YOUTUBE_PROJECT_IDENTITY: ${{ vars.CULINARY_YOUTUBE_PROJECT_IDENTITY }}
      YT_CUL_POLICY_RECHECKED_AT: "2026-09-05"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fail-closed YT-CUL-1 preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CULINARY_YOUTUBE_API_KEY:-}" ]]; then
            echo "::error::CULINARY_YOUTUBE_API_KEY is not available to this workflow."
            exit 2
          fi
          echo "::add-mask::$CULINARY_YOUTUBE_API_KEY"
          if [[ -z "${CULINARY_YOUTUBE_SEARCH_DAILY_LIMIT:-}" ]]; then
            echo "::error::CULINARY_YOUTUBE_SEARCH_DAILY_LIMIT is missing. Record the already-verified non-secret Search Queries daily limit as a repository Actions variable."
            exit 2
          fi

      - name: Validate canary safety contract
        run: node --test tests/youtube-culinary-connectivity-canary.test.js tests/youtube-culinary-discovery-control-plane.test.js

      - name: Execute exactly one live Search Queries call
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-youtube-culinary-connectivity-canary.mjs | tee "$RUNNER_TEMP/yt-cul-2-safe-summary.json"

      - name: Record policy-safe job summary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          const summary = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/yt-cul-2-safe-summary.json`, 'utf8'));
          const lines = [
            '# YT-CUL-2 connectivity canary',
            '',
            `- Result: **${summary.result}**`,
            `- Client: \`${summary.clientId}\``,
            `- Project identity: \`${summary.projectIdentity}\``,
            `- Search Queries calls: ${summary.quota.executedCalls}/${summary.quota.verifiedAssignedDailyLimit}`,
            `- Protected reserve: ${summary.quota.reserveCalls}`,
            `- HTTP status: ${summary.api.httpStatus}`,
            `- Result slots observed: ${summary.api.resultSlotsObserved}`,
            `- Transient raw payload deleted before exit: ${summary.transientCache.deletedBeforeJobExit}`,
            `- Raw YouTube API Data embedded in durable summary: ${summary.rawYoutubeApiDataEmbedded}`,
            `- Blue Lagoon credential mapped: ${summary.blueLagoonCredentialMapped}`,
            ''
          ].join('\n');
          await appendFile(process.env.GITHUB_STEP_SUMMARY, lines, 'utf8');
          NODE

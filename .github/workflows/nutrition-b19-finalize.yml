name: Nutrition B19 bulgur finalization

on:
  push:
    branches:
      - agent/nutrition-b19-bulgur-exact-composition

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Add temporary B19 finalization workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Add bounded permanent B19 composition evidence
        run: |
          cat > src/data/matvaretabellen-composition-b19.js <<'EOF'
          // Bounded static composition evidence from the official Norwegian Food Composition Table 2026.
          // B19 is composition-only: household portions published on the source row are deliberately not admitted.
          // Repository-authored bulgur gram quantities are weighed before the instructions hydrate/cook the bulgur.

          export const MATVARETABELLEN_COMPOSITION_SOURCE_B19 = Object.freeze({
            id: "matvaretabellen-2026-composition-b19",
            authority: "Norwegian Food Safety Authority (Mattilsynet)",
            dataset: "Norwegian Food Composition Table 2026",
            releaseDate: "2026-01",
            apiUrl: "https://www.matvaretabellen.no/api/en/foods.json",
            website: "https://www.matvaretabellen.no/en/bulgur-uncooked/",
            license: "NLOD 2.0 / Norsk lisens for offentlige data",
            requiredAttribution: "Norwegian Food Composition Table 2026. The Norwegian Food Safety Authority. www.matvaretabellen.no",
            country: "Norway",
            region: "Europe",
            state: "BOUNDED_STATIC_REVIEWED_COMPOSITION_EVIDENCE",
            runtimePolicy: "ELIGIBLE_VIA_EUROPEAN_PRIMARY_POLICY_V1",
            evidenceTranche: "B19",
            runtimeFetch: false,
            compositionScope: "EXACT_REVIEWED_FOOD_RECORDS_ONLY",
            carbohydrateSemantic: "AVAILABLE_CARBOHYDRATE_MATVARETABELLEN_CHO"
          });

          const bulgur = Object.freeze({
            canonicalIngredientId: "bulgur",
            foodId: "05.233",
            foodName: "Bulgur, uncooked",
            scientificName: "Triticum aestivum L.",
            foodEx2: "Bulgur (A004G)",
            foodForm: "EXACT_UNCOOKED_BULGUR",
            matchConfidence: "high",
            matchNotes: "Exact source identity is uncooked bulgur. All three authored bulgur quantities are grams and each recipe hydrates/cooks the declared bulgur afterward, establishing pre-cooking input form. This does not authorize cooked bulgur or neighboring wheat/grain identities.",
            per100g: Object.freeze({
              energyKcal: 288,
              proteinG: 11.8,
              carbohydrateG: 50.9,
              fatG: 1.9,
              fibreG: 10.0
            }),
            fieldEvidence: Object.freeze({
              energyKcal: Object.freeze({ sourceCode: "MI0115", valueType: "Published", method: "Published energy in 100 g: 1215.4 kJ / 288 kcal" }),
              proteinG: Object.freeze({ sourceCode: "420f", valueType: "Weighted", method: "Food composition table; analytical results; method not known" }),
              carbohydrateG: Object.freeze({ sourceCode: "MI0181", valueType: "Best estimate", method: "Carbohydrate, available calculated from sugar and starch (CHO = SUGAR + STARCH)" }),
              fatG: Object.freeze({ sourceCode: "611a", valueType: "Weighted", method: "Independent laboratory; analytical results; analytical method" }),
              fibreG: Object.freeze({ sourceCode: "611a", valueType: "Weighted", method: "Independent laboratory; analytical results; analytical method" })
            }),
            evidenceState: "MATVARETABELLEN_2026_EXACT_COMPOSITION_MATCH",
            sourceId: MATVARETABELLEN_COMPOSITION_SOURCE_B19.id,
            evidenceTranche: "B19"
          });

          export const MATVARETABELLEN_COMPOSITION_DENSITIES_B19 = Object.freeze({ bulgur });

          export const matvaretabellenCompositionB19ForIngredient = ingredientId =>
            MATVARETABELLEN_COMPOSITION_DENSITIES_B19[ingredientId] || null;
          EOF
      - name: Integrate B19 into the bounded European-primary policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/domain/nutrition-source-policy.js')
          s = p.read_text()

          old = '''import {\n  MATVARETABELLEN_COMPOSITION_DENSITIES_B18,\n  MATVARETABELLEN_COMPOSITION_SOURCE_B18\n} from "../data/matvaretabellen-composition-b18.js";'''
          new = old + '''\nimport {\n  MATVARETABELLEN_COMPOSITION_DENSITIES_B19,\n  MATVARETABELLEN_COMPOSITION_SOURCE_B19\n} from "../data/matvaretabellen-composition-b19.js";'''
          if old not in s: raise SystemExit('B19 import anchor missing')
          s = s.replace(old, new, 1)

          old = '''if (overlappingMatvaretabellenB18Ids.length) {\n  throw new Error(`Matvaretabellen B18 must remain a bounded no-overlap composition extension: ${overlappingMatvaretabellenB18Ids.sort().join(", ")}`);\n}\n'''
          new = old + '''\nconst matvaretabellenB19Ids = Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B19);\nconst overlappingMatvaretabellenB19Ids = matvaretabellenB19Ids.filter(ingredientId =>\n  Object.hasOwn(CIQUAL_CANONICAL_DENSITIES, ingredientId) ||\n  Object.hasOwn(USDA_FOUNDATION_DENSITIES, ingredientId) ||\n  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B9, ingredientId) ||\n  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B11, ingredientId) ||\n  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B14, ingredientId) ||\n  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B16, ingredientId) ||\n  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B18, ingredientId) ||\n  Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B10, ingredientId) ||\n  Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B12, ingredientId) ||\n  Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B13, ingredientId)\n);\nif (overlappingMatvaretabellenB19Ids.length) {\n  throw new Error(`Matvaretabellen B19 must remain a bounded no-overlap composition extension: ${overlappingMatvaretabellenB19Ids.sort().join(", ")}`);\n}\n'''
          if old not in s: raise SystemExit('B19 overlap anchor missing')
          s = s.replace(old, new, 1)

          old = '''  if (source === "matvaretabellen-b18") {\n    return matvaretabellenCandidate(ingredientId, nutrientKey, MATVARETABELLEN_COMPOSITION_DENSITIES_B18, MATVARETABELLEN_COMPOSITION_SOURCE_B18);\n  }\n'''
          new = old + '''\n  if (source === "matvaretabellen-b19") {\n    return matvaretabellenCandidate(ingredientId, nutrientKey, MATVARETABELLEN_COMPOSITION_DENSITIES_B19, MATVARETABELLEN_COMPOSITION_SOURCE_B19);\n  }\n'''
          if old not in s: raise SystemExit('B19 source anchor missing')
          s = s.replace(old, new, 1)

          old = '''    sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b16") ||\n    sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b18");'''
          new = '''    sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b16") ||\n    sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b18") ||\n    sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b19");'''
          if old not in s: raise SystemExit('B19 standalone-source anchor missing')
          s = s.replace(old, new, 1)

          old = '''    ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B16),\n    ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B18)'''
          new = '''    ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B16),\n    ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B18),\n    ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B19)'''
          if old not in s: raise SystemExit('B19 density-map anchor missing')
          s = s.replace(old, new, 1)

          old = '''    matvaretabellenB18SelectedCount: selections.filter(item => item.source === "matvaretabellen" && item.evidenceTranche === "B18").length,'''
          new = old + '''\n    matvaretabellenB19SelectedCount: selections.filter(item => item.source === "matvaretabellen" && item.evidenceTranche === "B19").length,'''
          if old not in s: raise SystemExit('B19 coverage anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Add B19 deterministic evidence and boundary tests
        run: |
          cat > tests/matvaretabellen-composition-b19.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import {
            MATVARETABELLEN_COMPOSITION_DENSITIES_B19,
            MATVARETABELLEN_COMPOSITION_SOURCE_B19,
            matvaretabellenCompositionB19ForIngredient
          } from "../src/data/matvaretabellen-composition-b19.js";
          import { AUTHORED_RECIPES } from "../src/data/corpus-v1.js";
          import { calculatePerServingFromDensities, publicNutritionSource } from "../src/domain/nutrition.js";
          import { buildNutritionCoverageAudit } from "../src/domain/nutrition-coverage-audit.js";
          import {
            EUROPEAN_PRIMARY_DENSITIES_V1,
            europeanPrimaryPolicyCoverage,
            selectEuropeanPrimaryNutrient
          } from "../src/domain/nutrition-source-policy.js";

          test("B19 source is explicit static Matvaretabellen standalone uncooked-bulgur composition evidence", () => {
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B19.id, "matvaretabellen-2026-composition-b19");
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B19.authority, "Norwegian Food Safety Authority (Mattilsynet)");
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B19.releaseDate, "2026-01");
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B19.evidenceTranche, "B19");
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B19.runtimeFetch, false);
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B19.state, "BOUNDED_STATIC_REVIEWED_COMPOSITION_EVIDENCE");
            assert.equal(MATVARETABELLEN_COMPOSITION_SOURCE_B19.runtimePolicy, "ELIGIBLE_VIA_EUROPEAN_PRIMARY_POLICY_V1");
            assert.match(MATVARETABELLEN_COMPOSITION_SOURCE_B19.license, /NLOD 2\.0/);
          });

          test("B19 admits exactly official food 05.233 Bulgur, uncooked with published tracked composition", () => {
            assert.deepEqual(Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B19), ["bulgur"]);
            const bulgur = matvaretabellenCompositionB19ForIngredient("bulgur");
            assert.equal(bulgur.foodId, "05.233");
            assert.equal(bulgur.foodName, "Bulgur, uncooked");
            assert.equal(bulgur.scientificName, "Triticum aestivum L.");
            assert.equal(bulgur.foodEx2, "Bulgur (A004G)");
            assert.equal(bulgur.foodForm, "EXACT_UNCOOKED_BULGUR");
            assert.deepEqual(bulgur.per100g, {
              energyKcal: 288,
              proteinG: 11.8,
              carbohydrateG: 50.9,
              fatG: 1.9,
              fibreG: 10
            });
            assert.equal(bulgur.fieldEvidence.energyKcal.sourceCode, "MI0115");
            assert.equal(bulgur.fieldEvidence.proteinG.sourceCode, "420f");
            assert.equal(bulgur.fieldEvidence.carbohydrateG.sourceCode, "MI0181");
            assert.equal(bulgur.fieldEvidence.fatG.sourceCode, "611a");
            assert.equal(bulgur.fieldEvidence.fibreG.sourceCode, "611a");
          });

          test("repository-authored bulgur grams are pre-hydration or pre-cooking inputs", () => {
            const rows = AUTHORED_RECIPES
              .filter(recipe => recipe.ingredients.some(ingredient => ingredient.canonicalIngredientId === "bulgur"))
              .map(recipe => ({
                recipeId: recipe.id,
                ingredient: recipe.ingredients.find(ingredient => ingredient.canonicalIngredientId === "bulgur"),
                firstInstruction: recipe.instructions[0]?.text
              }));
            assert.deepEqual(rows.map(row => [row.recipeId, row.ingredient.quantity, row.ingredient.unit]), [
              ["middle_eastern_bulgur_chickpea_salad", 150, "g"],
              ["middle_eastern_lentil_bulgur_herb_bowl", 130, "g"],
              ["middle_eastern_turkey_bulgur_pepper_bowl", 140, "g"]
            ]);
            for (const row of rows) assert.equal(row.ingredient.preparation, null, row.recipeId);
            assert.match(rows[0].firstInstruction, /Cover bulgur with hot water and rest until tender/i);
            assert.match(rows[1].firstInstruction, /bulgur until fluffy/i);
            assert.match(rows[2].firstInstruction, /Cook bulgur until tender/i);
          });

          test("B19 exact uncooked-bulgur identity does not bleed into cooked bulgur or neighboring grains", () => {
            for (const unsupported of ["cooked_bulgur", "couscous", "cracked_wheat", "wheat"]) {
              assert.equal(matvaretabellenCompositionB19ForIngredient(unsupported), null, unsupported);
              const selection = selectEuropeanPrimaryNutrient(unsupported, "carbohydrateG");
              assert.notEqual(selection?.sourceId, MATVARETABELLEN_COMPOSITION_SOURCE_B19.id, unsupported);
            }
          });

          test("European-primary policy selects exact B19 bulgur provenance for every tracked nutrient", () => {
            const expectedCodes = {
              energyKcal: "MI0115",
              proteinG: "420f",
              carbohydrateG: "MI0181",
              fatG: "611a",
              fibreG: "611a"
            };
            for (const nutrient of Object.keys(expectedCodes)) {
              const selection = selectEuropeanPrimaryNutrient("bulgur", nutrient);
              assert.equal(selection.source, "matvaretabellen", nutrient);
              assert.equal(selection.sourceId, MATVARETABELLEN_COMPOSITION_SOURCE_B19.id, nutrient);
              assert.equal(selection.sourceIdentifier, "05.233", nutrient);
              assert.equal(selection.evidenceTranche, "B19", nutrient);
              assert.equal(selection.selectionReason, "ONLY_REVIEWED_SOURCE_AVAILABLE", nutrient);
              assert.deepEqual(selection.sourceCodes, [expectedCodes[nutrient]], nutrient);
            }
            assert.equal(selectEuropeanPrimaryNutrient("bulgur", "carbohydrateG").semantic, "AVAILABLE_CARBOHYDRATE_MATVARETABELLEN_CHO");
            const coverage = europeanPrimaryPolicyCoverage(["bulgur"]);
            assert.equal(coverage.matvaretabellenB19SelectedCount, 5);
            assert.equal(coverage.matvaretabellenSelectedCount, 5);
          });

          test("B19 composition evidence does not authorize source household portions", () => {
            const bulgur = matvaretabellenCompositionB19ForIngredient("bulgur");
            assert.equal(bulgur.gramsPerUnit, undefined);
            assert.equal(bulgur.units, undefined);
            assert.equal(bulgur.sourcePortionId, undefined);
          });

          test("B19 removes exactly three bulgur density blockers while preserving all residual blockers", () => {
            const audit = buildNutritionCoverageAudit(AUTHORED_RECIPES, publicNutritionSource);
            assert.equal(audit.authoritativeRecipeCount, 15);
            assert.equal(audit.estimateRecipeCount, 61);
            assert.equal(audit.blockerCounts.missing_density, 94);
            const expected = {
              middle_eastern_bulgur_chickpea_salad: [["mint", "missing_density"]],
              middle_eastern_lentil_bulgur_herb_bowl: [["lentils", "missing_density"], ["mint", "missing_density"]],
              middle_eastern_turkey_bulgur_pepper_bowl: [["turkey_mince", "missing_density"]]
            };
            for (const [recipeId, blockers] of Object.entries(expected)) {
              const detail = audit.recipeDetails.find(row => row.recipeId === recipeId);
              assert.equal(detail.authoritative, false, recipeId);
              assert.deepEqual(detail.blockers.map(blocker => [blocker.ingredientId, blocker.reason]), blockers, recipeId);
              assert.equal(detail.blockers.some(blocker => blocker.ingredientId === "bulgur"), false, recipeId);
            }
          });

          test("B19 available carbohydrate remains incompatible with USDA carbohydrate-by-difference", () => {
            const recipe = {
              ingredients: [
                { canonicalIngredientId: "bulgur", quantity: 100, unit: "g" },
                { canonicalIngredientId: "synthetic_usda", quantity: 100, unit: "g" }
              ],
              serving: { servings: 1 }
            };
            const densityMap = {
              bulgur: EUROPEAN_PRIMARY_DENSITIES_V1.bulgur,
              synthetic_usda: {
                per100g: { energyKcal: 1, proteinG: 1, carbohydrateG: 1, fatG: 1, fibreG: 1 },
                provenanceByNutrient: {
                  carbohydrateG: { semantic: "CARBOHYDRATE_BY_DIFFERENCE_USDA_1005" }
                }
              }
            };
            const result = calculatePerServingFromDensities(recipe, densityMap);
            assert.equal(result.nutrientCoverage.carbohydrateG.semanticCompatibility, false);
            assert.equal(result.nutrientCoverage.carbohydrateG.semanticIssue, "mixed_incompatible_carbohydrate_semantics");
            assert.equal(result.perServing.carbohydrateG, null);
            assert.equal(result.complete, false);
          });
          EOF
      - name: Update audit truth, reviewed decision and third-party role accounting
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('tests/nutrition-coverage-audit.test.js')
          s = p.read_text()
          old_title = 'test("B18 exact cottage-cheese composition adds one bounded authored unlock without weakening fail-closed controls", () => {'
          new_title = 'test("B19 exact uncooked-bulgur composition removes three density blockers without weakening fail-closed controls", () => {'
          if old_title not in s: raise SystemExit('coverage test title anchor missing')
          s = s.replace(old_title, new_title, 1)
          old_counts = '''  assert.deepEqual(audit.blockerCounts, {\n    ambiguous_portion_unit: 20,\n    missing_density: 97,\n    unsupported_quantity_unit: 7\n  });'''
          new_counts = '''  assert.deepEqual(audit.blockerCounts, {\n    ambiguous_portion_unit: 20,\n    missing_density: 94,\n    unsupported_quantity_unit: 7\n  });'''
          if old_counts not in s: raise SystemExit('coverage blocker-count anchor missing')
          s = s.replace(old_counts, new_counts, 1)
          p.write_text(s)

          p = Path('scripts/nutrition-unlock-reviewed-decisions-v1.json')
          data = json.loads(p.read_text())
          data['decisions']['bulgur'] = {
            'decision': 'ADMIT_EXACT_MATVARETABELLEN_2026_B19',
            'candidateClass': 'COMPOSITION_EVIDENCE',
            'sourceId': 'matvaretabellen-2026-composition-b19',
            'foodId': '05.233',
            'foodName': 'Bulgur, uncooked',
            'scientificName': 'Triticum aestivum L.',
            'foodEx2': 'Bulgur (A004G)',
            'formMatch': 'EXACT_UNCOOKED_BULGUR',
            'carbohydrateSemantic': 'AVAILABLE_CARBOHYDRATE_MATVARETABELLEN_CHO',
            'boundary': 'B19 maps only canonical bulgur to exact source identity Bulgur, uncooked. All three authored bulgur gram inputs are hydrated or cooked by subsequent recipe instructions, establishing pre-cooking form. It does not authorize cooked bulgur, generic wheat or grains, or any household portion from the same source row.',
            'quantityState': 'COMPOSITION_ONLY_NO_HOUSEHOLD_PORTION_AUTHORIZATION',
            'runtimeChange': True
          }
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          p = Path('THIRD_PARTY_NOTICES.md')
          s = p.read_text()
          old = 'B6, B15 and B17 are separate bounded portion-evidence roles. B9, B11, B14, B16 and B18 are standalone exact composition roles. B10, B12 and B13 are exact tracked-field completion roles where existing reviewed composition has no value.'
          new = 'B6, B15 and B17 are separate bounded portion-evidence roles. B9, B11, B14, B16, B18 and B19 are standalone exact composition roles. B10, B12 and B13 are exact tracked-field completion roles where existing reviewed composition has no value.'
          if old not in s: raise SystemExit('third-party role anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run focused B19 tests
        run: node --test tests/matvaretabellen-composition-b19.test.js tests/nutrition-coverage-audit.test.js
      - name: Verify exact B19 merged-state audit truth
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { AUTHORED_RECIPES } from './src/data/corpus-v1.js';
          import { publicNutritionSource } from './src/domain/nutrition.js';
          import { buildNutritionCoverageAudit } from './src/domain/nutrition-coverage-audit.js';
          const audit = buildNutritionCoverageAudit(AUTHORED_RECIPES, publicNutritionSource);
          assert.equal(audit.recipeCount, 76);
          assert.equal(audit.authoritativeRecipeCount, 15);
          assert.equal(audit.estimateRecipeCount, 61);
          assert.deepEqual(audit.blockerCounts, {
            ambiguous_portion_unit: 20,
            missing_density: 94,
            unsupported_quantity_unit: 7
          });
          assert.deepEqual(audit.missingNutrientFieldCounts, {
            carbohydrateG: 9,
            energyKcal: 5,
            fatG: 18,
            fibreG: 11
          });
          assert.deepEqual(audit.semanticIssueCounts, {
            mixed_incompatible_carbohydrate_semantics: 16
          });
          NODE
      - name: Run complete deterministic test suite
        run: npm test
      - name: Run repository validation
        run: npm run validate
      - name: Remove temporary workflows and commit finalized B19 tranche
        run: |
          git rm .github/workflows/nutrition-b19-bulgur-diagnostic.yml .github/workflows/nutrition-b19-bulgur-impact.yml .github/workflows/nutrition-b19-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_NOTICES.md scripts/nutrition-unlock-reviewed-decisions-v1.json src/data/matvaretabellen-composition-b19.js src/domain/nutrition-source-policy.js tests/matvaretabellen-composition-b19.test.js tests/nutrition-coverage-audit.test.js
          git diff --cached --check
          git commit -m "Nutrition B19: add exact uncooked bulgur composition evidence"
          git push origin HEAD:agent/nutrition-b19-bulgur-exact-composition

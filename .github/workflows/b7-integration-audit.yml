name: Nutrition B7 integration audit
on:
  push:
    branches: [v1-nutrition-b7-recipe-unlocks]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run validate
      - run: npm run report:nutrition-coverage

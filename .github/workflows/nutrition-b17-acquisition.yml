name: Nutrition B17 exact evidence acquisition

on:
  push:
    branches:
      - agent/nutrition-b17-exact-evidence-acquisition

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact official tahini tablespoon row
        run: |
          curl --fail --silent --show-error --retry 3 https://www.matvaretabellen.no/api/en/foods.json -o /tmp/matvaretabellen-foods.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/matvaretabellen-foods.json', 'utf8'));
          const foods = payload.foods || payload;
          const food = foods.find(f => (f.foodId || f.id) === '06.702');
          if (!food) throw new Error('Matvaretabellen food 06.702 not found');
          const tablespoon = (food.portions || []).find(p => String(p.portionName || p.name || '').toLowerCase() === 'tablespoon');
          if (!tablespoon) throw new Error('Tablespoon portion not found for 06.702');
          console.log('===B17_TAHINI_SOURCE_ROW===');
          console.log(JSON.stringify({ foodId: food.foodId || food.id, foodName: food.foodName, portion: tablespoon }, null, 2));
          NODE

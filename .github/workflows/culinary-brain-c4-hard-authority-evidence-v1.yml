name: Culinary Brain C4 hard-authority evidence audit V1

on:
  pull_request:
    paths:
      - "config/culinary_brain_c4_hard_authority_evidence_audit_v1.json"
      - "scripts/culinary-brain-c4-hard-authority-evidence-core.mjs"
      - "scripts/run-culinary-brain-c4-hard-authority-evidence-v1.mjs"
      - "tests/culinary-brain-c4-hard-authority-evidence-v1.test.js"
      - "scripts/run-nutrition-vitamin-applicability-audit.mjs"
      - "config/corpus_normalization_baseline_v1.json"
      - "config/nutrition_vitamin_applicability_audit_v1.json"
      - "data/generated/culinary-brain-c4-real-v8018-failure-matrix-summary-v1.json"
      - "data/generated/culinary-brain-c4-hard-authority-evidence-summary-v1.json"
      - ".github/workflows/culinary-brain-c4-hard-authority-evidence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run hard-authority evidence tests
        run: node --test tests/culinary-brain-c4-hard-authority-evidence-v1.test.js
      - name: Checkout exact pinned UniTools
        run: |
          git clone --filter=blob:none https://github.com/farcrak/unitools-recipes.git .tmp/unitools
          git -C .tmp/unitools checkout --detach 1d09e9548d957dd0375301146a86dddf5e269c1b
      - name: Checkout exact pinned ForkRecipe
        run: |
          git clone --filter=blob:none https://github.com/futurechef/forkrecipe-recipes.git .tmp/forkrecipe
          git -C .tmp/forkrecipe checkout --detach c32255266af39bd77444d39452f3df8088ac8fd9
      - name: Checkout exact pinned CC0 recipes
        run: |
          git clone --filter=blob:none https://github.com/sylGauthier/recipes.git .tmp/cc0
          git -C .tmp/cc0 checkout --detach b12e481d1c220a13e0847a34e148d5872a16928e
      - name: Checkout exact pinned Open Recipe Archive
        run: |
          git clone --filter=blob:none https://github.com/AdamBouhmad/open-recipe-archive.git .tmp/ora
          git -C .tmp/ora checkout --detach ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
      - name: Reconstruct exact v8018 nutrition identity diagnostics with identity rows
        run: |
          node scripts/run-nutrition-vitamin-applicability-audit.mjs \
            --unitools=.tmp/unitools \
            --forkrecipe=.tmp/forkrecipe \
            --cc0=.tmp/cc0 \
            --ora=.tmp/ora \
            --output=.tmp/nutrition-vitamin-applicability-audit-v1-full.json \
            --summary=.tmp/nutrition-vitamin-applicability-audit-v1.json
      - name: Build frozen-112 hard-authority evidence audit
        run: |
          node scripts/run-culinary-brain-c4-hard-authority-evidence-v1.mjs \
            --contract=config/culinary_brain_c4_hard_authority_evidence_audit_v1.json \
            --nutrition=.tmp/nutrition-vitamin-applicability-audit-v1-full.json \
            --c4=data/generated/culinary-brain-c4-real-v8018-failure-matrix-summary-v1.json \
            --output=.tmp/culinary-brain-c4-hard-authority-evidence-v1.json \
            --summary=.tmp/culinary-brain-c4-hard-authority-evidence-summary-v1.json
      - name: Verify committed hard-authority evidence summary is reproducible
        run: cmp .tmp/culinary-brain-c4-hard-authority-evidence-summary-v1.json data/generated/culinary-brain-c4-hard-authority-evidence-summary-v1.json
      - name: Upload hard-authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: culinary-brain-c4-hard-authority-evidence-v1
          path: |
            .tmp/culinary-brain-c4-hard-authority-evidence-v1.json
            .tmp/culinary-brain-c4-hard-authority-evidence-summary-v1.json
          if-no-files-found: error

name: Corpus scale Step 4 indexed retrieval proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/corpus-scale-step4.yml"
      - "docs/CORPUS_SCALE_STEP4_CONTRACT.md"
      - "scripts/corpus-scale-step4-core.mjs"
      - "scripts/run-corpus-scale-step4.mjs"
      - "tests/corpus-scale-step4.test.js"
      - "scripts/corpus-scale-step1-core.mjs"
      - "scripts/corpus-scale-step3-core.mjs"

concurrency:
  group: corpus-scale-step4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Step 4 contract tests
        run: node --test tests/corpus-scale-step4.test.js
      - name: Run deterministic 1k to 100k indexed retrieval proof
        run: node --expose-gc scripts/run-corpus-scale-step4.mjs

name: Nutrition B18 candidate evidence acquisition

on:
  push:
    branches:
      - agent/nutrition-b18-priority-reconciliation

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query bounded official Matvaretabellen candidate rows
        run: |
          curl --fail --silent --show-error --retry 3 https://www.matvaretabellen.no/api/en/foods.json -o /tmp/matvaretabellen-foods.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/matvaretabellen-foods.json', 'utf8'));
          const foods = payload.foods || payload;
          const groups = [
            ['smoked_paprika', ['smoked paprika', 'paprika', 'sweet pepper, paprika, powder']],
            ['turkey_mince', ['turkey', 'minced']],
            ['cottage_cheese', ['cottage cheese']],
            ['lentils', ['lentil']],
            ['bulgur', ['bulgur']],
            ['garam_masala', ['garam masala']],
            ['chicken_thigh', ['chicken', 'thigh']]
          ];
          for (const [target, terms] of groups) {
            const matches = foods.filter(food => {
              const hay = `${food.foodName || ''} ${food.foodEx2 || ''}`.toLowerCase();
              if (target === 'turkey_mince') return hay.includes('turkey') && hay.includes('minc');
              if (target === 'chicken_thigh') return hay.includes('chicken') && hay.includes('thigh');
              return terms.some(term => hay.includes(term));
            }).slice(0, 40);
            console.log(`===B18_CANDIDATE_${target.toUpperCase()}===`);
            console.log(JSON.stringify(matches.map(food => ({
              foodId: food.foodId || food.id,
              foodName: food.foodName,
              foodEx2: food.foodEx2,
              foodEx2Facets: food.foodEx2Facets,
              nutrients: food.nutrients,
              portions: food.portions
            })), null, 2));
          }
          NODE

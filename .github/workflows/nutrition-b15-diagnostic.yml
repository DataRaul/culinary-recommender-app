name: Nutrition B15 diagnostic

on:
  push:
    branches:
      - agent/nutrition-b15-exact-portion-unlock

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Run focused B15 tests
        run: node --test tests/matvaretabellen-portions-b15.test.js
      - name: Measure authored nutrition state and B15 targets
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { AUTHORED_RECIPES } from './src/data/corpus-v1.js';
          import { publicNutritionSource } from './src/domain/nutrition.js';
          import { buildNutritionCoverageAudit } from './src/domain/nutrition-coverage-audit.js';
          const audit = buildNutritionCoverageAudit(AUTHORED_RECIPES, publicNutritionSource);
          console.log('B15_AUDIT', JSON.stringify({
            recipeCount: audit.recipeCount,
            authoritativeRecipeCount: audit.authoritativeRecipeCount,
            estimateRecipeCount: audit.estimateRecipeCount,
            authoritativeRecipeIds: audit.authoritativeRecipeIds,
            blockerCounts: audit.blockerCounts,
            missingNutrientFieldCounts: audit.missingNutrientFieldCounts,
            semanticIssueCounts: audit.semanticIssueCounts
          }, null, 2));
          const targetIds = new Set(['courgette', 'cumin', 'turmeric']);
          const details = audit.recipeDetails.filter(detail => detail.blockers.some(blocker => targetIds.has(blocker.ingredientId)));
          console.log('B15_TARGET_DETAILS', JSON.stringify(details, null, 2));
          EOF

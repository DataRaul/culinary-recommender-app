name: Nutrition B14 diagnostic

on:
  push:
    branches:
      - agent/nutrition-b14-courgette-matvaretabellen-unlock

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Run focused B14 tests
        run: node --test tests/matvaretabellen-composition-b14.test.js
      - name: Measure authored nutrition state
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { AUTHORED_RECIPES } from './src/data/corpus-v1.js';
          import { publicNutritionSource } from './src/domain/nutrition.js';
          import { buildNutritionCoverageAudit } from './src/domain/nutrition-coverage-audit.js';
          const audit = buildNutritionCoverageAudit(AUTHORED_RECIPES, publicNutritionSource);
          console.log('B14_AUDIT', JSON.stringify({
            recipeCount: audit.recipeCount,
            authoritativeRecipeCount: audit.authoritativeRecipeCount,
            estimateRecipeCount: audit.estimateRecipeCount,
            authoritativeRecipeIds: audit.authoritativeRecipeIds,
            blockerCounts: audit.blockerCounts,
            missingNutrientFieldCounts: audit.missingNutrientFieldCounts,
            semanticIssueCounts: audit.semanticIssueCounts
          }, null, 2));
          const courgetteRecipes = audit.recipeDetails.filter(detail => detail.blockers.some(blocker => blocker.ingredientId === 'courgette') || detail.recipeId.includes('courgette'));
          console.log('B14_COURGETTE_DETAILS', JSON.stringify(courgetteRecipes, null, 2));
          EOF

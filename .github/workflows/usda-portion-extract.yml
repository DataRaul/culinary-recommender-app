name: One-off USDA Foundation portion extract
on:
  push:
    branches: [v1-nutrition-b2-portions]
    paths:
      - '.github/workflows/usda-portion-extract.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download official USDA Foundation Foods April 2026 CSV
        run: curl --fail --location --retry 3 --output /tmp/foundation.zip 'https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_csv_2026-04-30.zip'
      - name: Extract archive
        run: mkdir -p /tmp/foundation && unzip -q /tmp/foundation.zip -d /tmp/foundation
      - name: Extract bounded mapped portion metadata
        run: |
          CSV_DIR="$(find /tmp/foundation -type f -name 'food_portion.csv' -printf '%h\n' | head -n1)"
          test -n "$CSV_DIR"
          node scripts/extract-usda-portions.mjs "$CSV_DIR" /tmp/usda-foundation-portions.json
      - uses: actions/upload-artifact@v4
        with:
          name: usda-foundation-bounded-portions
          path: /tmp/usda-foundation-portions.json
          retention-days: 1

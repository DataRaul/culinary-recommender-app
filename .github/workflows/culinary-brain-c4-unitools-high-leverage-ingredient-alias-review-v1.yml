name: Culinary Brain C4 UniTools high-leverage ingredient alias review V1

on:
  pull_request:
    paths:
      - "config/culinary_brain_c4_unitools_high_leverage_ingredient_alias_review_v1.json"
      - "scripts/culinary-brain-c4-unitools-high-leverage-ingredient-alias-review-core.mjs"
      - "scripts/run-culinary-brain-c4-unitools-high-leverage-ingredient-alias-review-v1.mjs"
      - "tests/culinary-brain-c4-unitools-high-leverage-ingredient-alias-review-v1.test.js"
      - "data/generated/culinary-brain-c4-next-repair-cohort-design-summary-v1.json"
      - "config/corpus_scale_step8d_contract.json"
      - "scripts/corpus-scale-step8e-core.mjs"
      - "src/data/ingredients.js"
      - ".github/workflows/culinary-brain-c4-unitools-high-leverage-ingredient-alias-review-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run bounded alias-review tests
        run: node --test tests/culinary-brain-c4-unitools-high-leverage-ingredient-alias-review-v1.test.js
      - name: Checkout exact pinned UniTools
        run: |
          git clone --filter=blob:none https://github.com/farcrak/unitools-recipes.git .tmp/unitools
          git -C .tmp/unitools checkout --detach 1d09e9548d957dd0375301146a86dddf5e269c1b
      - name: Measure reviewed alias overlay
        run: |
          node scripts/run-culinary-brain-c4-unitools-high-leverage-ingredient-alias-review-v1.mjs \
            --contract=config/culinary_brain_c4_unitools_high_leverage_ingredient_alias_review_v1.json \
            --design=data/generated/culinary-brain-c4-next-repair-cohort-design-summary-v1.json \
            --step8d=config/corpus_scale_step8d_contract.json \
            --unitools=.tmp/unitools \
            --summary=.tmp/culinary-brain-c4-unitools-high-leverage-ingredient-alias-review-summary-v1.json
      - name: Upload alias-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: culinary-brain-c4-unitools-high-leverage-ingredient-alias-review-v1
          path: .tmp/culinary-brain-c4-unitools-high-leverage-ingredient-alias-review-summary-v1.json
          if-no-files-found: error

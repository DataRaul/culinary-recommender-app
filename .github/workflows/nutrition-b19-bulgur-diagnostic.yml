name: Nutrition B19 bulgur evidence diagnostic

on:
  push:
    branches:
      - agent/nutrition-b19-bulgur-exact-composition

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Add temporary B19 bulgur evidence diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Reconcile every authored bulgur use against repository instructions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { AUTHORED_RECIPES } from './src/data/corpus-v1.js';
          const rows = AUTHORED_RECIPES
            .filter(recipe => recipe.ingredients.some(i => i.canonicalIngredientId === 'bulgur'))
            .map(recipe => ({
              recipeId: recipe.id,
              ingredient: recipe.ingredients.find(i => i.canonicalIngredientId === 'bulgur'),
              instructions: recipe.instructions.map(step => step.text)
            }));
          assert.equal(rows.length, 3);
          assert.deepEqual(rows.map(r => [r.recipeId, r.ingredient.quantity, r.ingredient.unit]), [
            ['middle_eastern_bulgur_chickpea_salad', 150, 'g'],
            ['middle_eastern_lentil_bulgur_herb_bowl', 130, 'g'],
            ['middle_eastern_turkey_bulgur_pepper_bowl', 140, 'g']
          ]);
          for (const row of rows) {
            assert.equal(row.ingredient.preparation, null, row.recipeId);
            assert.ok(row.instructions.some(text => /bulgur/i.test(text)), `${row.recipeId}: no instruction mentions bulgur`);
          }
          assert.match(rows[0].instructions[0], /Cover bulgur with hot water and rest until tender/i);
          assert.match(rows[1].instructions[0], /bulgur until fluffy/i);
          assert.match(rows[2].instructions[0], /Cook bulgur until tender/i);
          console.log(JSON.stringify(rows, null, 2));
          NODE
      - name: Reconcile repository-native uncooked grain convention
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { AUTHORED_RECIPES } from './src/data/corpus-v1.js';
          const ids = [
            'med_quinoa_egg_spinach_bowl',
            'indian_chickpea_cauliflower_basmati',
            'latin_pinto_bean_tomato_rice_skillet',
            'italian_mushroom_pea_orzo'
          ];
          const out = [];
          for (const id of ids) {
            const recipe = AUTHORED_RECIPES.find(r => r.id === id);
            assert.ok(recipe, id);
            out.push({id, ingredients: recipe.ingredients, instructions: recipe.instructions.map(s => s.text)});
          }
          assert.ok(out.find(x => x.id === 'med_quinoa_egg_spinach_bowl').ingredients.some(i => i.canonicalIngredientId === 'quinoa' && i.unit === 'g'));
          assert.match(out.find(x => x.id === 'med_quinoa_egg_spinach_bowl').instructions[0], /Cook quinoa until tender/i);
          assert.ok(out.find(x => x.id === 'indian_chickpea_cauliflower_basmati').ingredients.some(i => i.canonicalIngredientId === 'basmati_rice' && i.unit === 'g'));
          assert.match(out.find(x => x.id === 'indian_chickpea_cauliflower_basmati').instructions[0], /Cook basmati rice/i);
          console.log(JSON.stringify(out, null, 2));
          NODE
      - name: Freeze exact official Matvaretabellen 05.233 source row
        run: |
          curl --fail --silent --show-error --retry 3 https://www.matvaretabellen.no/api/en/foods.json -o /tmp/matvaretabellen-foods.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const payload = JSON.parse(fs.readFileSync('/tmp/matvaretabellen-foods.json', 'utf8'));
          const foods = payload.foods || payload;
          const food = foods.find(row => (row.foodId || row.id) === '05.233');
          assert.ok(food, 'Matvaretabellen 05.233 not found');
          assert.equal(food.foodName, 'Bulgur, uncooked');
          console.log('===B19_MATVARETABELLEN_05_233_BEGIN===');
          console.log(JSON.stringify(food, null, 2));
          console.log('===B19_MATVARETABELLEN_05_233_END===');
          NODE
      - name: Confirm official published tracked values and provenance labels
        run: |
          curl --fail --silent --show-error --retry 3 https://www.matvaretabellen.no/en/bulgur-uncooked/ -o /tmp/bulgur.html
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/bulgur.html').read_text(errors='replace')
          checks = [
              '05.233', 'Bulgur, uncooked', 'Triticum aestivum L.', 'Bulgur (A004G)',
              '288 kcal', '50.9', '11.8', '10.0', '1.9', 'MI0181', '611a', '420f'
          ]
          normalized = re.sub(r'\s+', ' ', html)
          missing = [x for x in checks if x not in normalized]
          if missing:
              raise SystemExit(f'official bulgur page missing expected evidence tokens: {missing}')
          print('official Matvaretabellen page contains expected identity, tracked values, and source-code tokens')
          PY

name: Nutrition B23 bounded finalization v2
on:
  push:
    branches: [agent/nutrition-b23-priority-reconciliation]
    paths:
      - .github/workflows/nutrition-b23-finalize-v2.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert authoritative base
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5c06369cca893933d5365373198da5e5288d32a6"
      - name: Integrate bounded B23 evidence
        run: |
          python <<'PY'
          from pathlib import Path
          import ast
          import json
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 target, found {count}")
              p.write_text(text.replace(old, new, 1))

          original = Path('.github/workflows/nutrition-b23-priority.yml').read_text()
          def recover_embedded(name, next_line):
              pattern = rf"          {name} = '''(.*?)\n          '''\n          {re.escape(next_line)}"
              match = re.search(pattern, original, re.S)
              if not match:
                  raise SystemExit(f"could not recover embedded {name}")
              raw = match.group(1)
              lines = raw.splitlines()
              normalized = "\n".join([lines[0]] + [line[10:] if line.startswith('          ') else line for line in lines[1:]])
              return ast.literal_eval("'''" + normalized + "'''") + "\n"

          Path('src/data/matvaretabellen-composition-b23.js').write_text(
              recover_embedded('source', 'source = "\\n".join'))
          Path('tests/matvaretabellen-composition-b23.test.js').write_text(
              recover_embedded('test_source', 'test_source = "\\n".join'))

          policy = 'src/domain/nutrition-source-policy.js'
          import_anchor = '} from "../data/matvaretabellen-composition-b22.js";'
          replace_once(policy, import_anchor, import_anchor + '''
import {
  MATVARETABELLEN_COMPOSITION_DENSITIES_B23,
  MATVARETABELLEN_COMPOSITION_SOURCE_B23
} from "../data/matvaretabellen-composition-b23.js";''', 'B23 import')

          form_anchor = 'const formRank = confidence => ({ high: 3, medium: 2, low: 1 }[confidence] || 0);'
          guard = '''const matvaretabellenB23Ids = Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B23);
const overlappingMatvaretabellenB23Ids = matvaretabellenB23Ids.filter(ingredientId =>
  Object.hasOwn(CIQUAL_CANONICAL_DENSITIES, ingredientId) ||
  Object.hasOwn(USDA_FOUNDATION_DENSITIES, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B9, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B11, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B14, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B16, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B18, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B19, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B20, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_DENSITIES_B22, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B10, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B12, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B13, ingredientId) ||
  Object.hasOwn(MATVARETABELLEN_COMPOSITION_COMPLETIONS_B21, ingredientId)
);
if (overlappingMatvaretabellenB23Ids.length) {
  throw new Error(`Matvaretabellen B23 must remain a bounded no-overlap composition extension: ${overlappingMatvaretabellenB23Ids.sort().join(", ")}`);
}

'''
          replace_once(policy, form_anchor, guard + form_anchor, 'B23 no-overlap guard')

          usda_anchor = '  const record = USDA_FOUNDATION_DENSITIES[ingredientId];'
          b23_candidate = '''  if (source === "matvaretabellen-b23") {
    return matvaretabellenCandidate(ingredientId, nutrientKey, MATVARETABELLEN_COMPOSITION_DENSITIES_B23, MATVARETABELLEN_COMPOSITION_SOURCE_B23);
  }

'''
          replace_once(policy, usda_anchor, b23_candidate + usda_anchor, 'B23 source candidate')

          standalone_old = '    sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b22");'
          standalone_new = '    sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b22") ||\n    sourceCandidate(ingredientId, nutrientKey, "matvaretabellen-b23");'
          replace_once(policy, standalone_old, standalone_new, 'B23 standalone chain')

          union_old = '    ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B22)\n  ])]'
          union_new = '    ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B22),\n    ...Object.keys(MATVARETABELLEN_COMPOSITION_DENSITIES_B23)\n  ])]'
          replace_once(policy, union_old, union_new, 'B23 density union')

          coverage_anchor = '    matvaretabellenB22SelectedCount: selections.filter(item => item.source === "matvaretabellen" && item.evidenceTranche === "B22").length,'
          replace_once(policy, coverage_anchor, coverage_anchor + '\n    matvaretabellenB23SelectedCount: selections.filter(item => item.source === "matvaretabellen" && item.evidenceTranche === "B23").length,', 'B23 coverage counter')

          decisions_path = Path('scripts/nutrition-unlock-reviewed-decisions-v1.json')
          decisions = json.loads(decisions_path.read_text())
          if 'pumpkin' in decisions['decisions']:
              raise SystemExit('pumpkin decision already exists')
          decisions['decisions']['pumpkin'] = {
              'decision': 'ADMIT_EXACT_MATVARETABELLEN_2026_B23',
              'candidateClass': 'COMPOSITION_EVIDENCE',
              'sourceId': 'matvaretabellen-2026-composition-b23',
              'foodId': '06.033',
              'foodName': 'Pumpkin, raw',
              'scientificName': 'Cucurbita pepo L.',
              'foodEx2': 'Pumpkins (A00KH)',
              'formMatch': 'EXACT_GENERIC_RAW_PUMPKIN_EDIBLE_FLESH',
              'carbohydrateSemantic': 'AVAILABLE_CARBOHYDRATE_MATVARETABELLEN_CHO',
              'boundary': 'B23 maps only canonical generic pumpkin to the reviewed source identity Pumpkin, raw under FoodEx2 Pumpkins. It does not authorize butternut, Hokkaido or another cultivar/species-specific pumpkin identity, cooked/roasted/canned/puree forms, the source edible-part yield, or any household-unit conversion.',
              'quantityState': 'DIRECT_GRAM_AUTHORED_USES_ONLY_NO_PORTION_OR_EDIBLE_YIELD_AUTHORIZATION',
              'runtimeChange': True
          }
          decisions_path.write_text(json.dumps(decisions, indent=2, ensure_ascii=False) + '\n')

          replace_once('THIRD_PARTY_NOTICES.md',
              'B9, B11, B14, B16, B18, B19, B20 and B22 are standalone exact composition roles.',
              'B9, B11, B14, B16, B18, B19, B20, B22 and B23 are standalone exact composition roles.',
              'B23 notices')

          for filename in [
              'tests/matvaretabellen-composition-b18.test.js',
              'tests/matvaretabellen-composition-b19.test.js',
              'tests/matvaretabellen-composition-b20.test.js',
              'tests/matvaretabellen-composition-b21.test.js',
              'tests/matvaretabellen-composition-b22.test.js',
              'tests/nutrition-coverage-audit.test.js'
          ]:
              p = Path(filename)
              text = p.read_text()
              text = text.replace('audit.blockerCounts.missing_density, 91', 'audit.blockerCounts.missing_density, 89')
              text = text.replace('missing_density: 91,', 'missing_density: 89,')
              p.write_text(text)

          audit_test = Path('tests/nutrition-coverage-audit.test.js')
          audit_test.write_text(audit_test.read_text().replace(
              'test("B22 exact raw-mint composition preserves cumulative unlock truth without weakening fail-closed controls",',
              'test("B23 exact raw-pumpkin composition preserves cumulative unlock truth without weakening fail-closed controls",'))
          PY
      - run: npm install --ignore-scripts
      - name: Focused B23 test
        run: node --test tests/matvaretabellen-composition-b23.test.js
      - name: Full deterministic test suite
        run: npm test
      - name: Validate public V0
        run: npm run validate
      - name: Measure B23 audit truth
        run: node scripts/report-nutrition-unlock-priorities.mjs
      - name: Commit permanent B23 tranche
        run: |
          git rm .github/workflows/nutrition-b23-priority.yml .github/workflows/nutrition-b23-finalize-v2.yml
          git add THIRD_PARTY_NOTICES.md scripts/nutrition-unlock-reviewed-decisions-v1.json src/data/matvaretabellen-composition-b23.js src/domain/nutrition-source-policy.js tests
          git config user.name "Raul M."
          git config user.email "67912886+DataRaul@users.noreply.github.com"
          git commit -m "Nutrition B23: add exact raw pumpkin composition evidence"
          git push origin HEAD:agent/nutrition-b23-priority-reconciliation

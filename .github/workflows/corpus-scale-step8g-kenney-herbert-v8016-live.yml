name: Corpus Scale Step 8G Kenney-Herbert v8016 live runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/corpus-scale-step8g-kenney-herbert-v8016-live.yml'
      - 'data/generated/step8g/v8016-runtime-descriptor.mjs'
      - 'data/generated/step8g/kenney-herbert-v8016-prewrite-evidence.json'
      - 'src/server/step8g-v8016-live-runtime.mjs'
      - 'src/server/step8g-v8016-hydration-runtime.mjs'
      - 'functions/api/step8g/v8016.js'
      - 'scripts/verify-step8g-v8016-live-payloads.mjs'
      - 'tests/step8g-v8016-live.test.js'
      - 'step8g-v8016-populate.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-step8g-kenney-herbert-v8016-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v8016-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Culinary app
        uses: actions/checkout@v4

      - name: Checkout pinned Open Recipe Archive
        uses: actions/checkout@v4
        with:
          repository: AdamBouhmad/open-recipe-archive
          ref: ae3bd2c009a8899dfe63b9166fa98ae3fa8041a8
          path: open-recipe-archive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test frozen v8016 runtime contract
        run: node --test tests/step8g-v8016-live.test.js

      - name: Verify exact pinned Kenney-Herbert source payload and route fingerprints
        run: node scripts/verify-step8g-v8016-live-payloads.mjs --candidate=./open-recipe-archive

      - name: Check authenticated API syntax
        run: node --check functions/api/step8g/v8016.js

      - name: Verify owner runner production gate contract
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const html = await readFile('step8g-v8016-populate.html', 'utf8');
          const required = [
            'EXPECTED_CHILD=501',
            'EXPECTED_PARENT=16510',
            'EXPECTED_COMPOSED=17011',
            'EXPECTED_BATCHES=51',
            'STEP8G_V8016_FREE_LIMIT_FAIL_CLOSED',
            'sixteen-layer-hydration',
            'rollback-v8015',
            'rollback-fail-closed',
            'IDENTIFIED_AUTHOR',
            'STEP_8G_KENNEY_HERBERT_V8016_PROTECTED_POPULATION_PASS',
            'maxAllowedD1Subqueries:16',
            'd1BudgetHeadroomAssumed:false',
            '/api/auth/session'
          ];
          for (const token of required) if (!html.includes(token)) throw new Error(`OWNER_RUNNER_CONTRACT_MISSING:${token}`);
          if (html.includes('SESSION_SECRET=') || html.includes('password')) throw new Error('OWNER_RUNNER_MUST_NOT_EMBED_AUTH_SECRET');
          console.log(JSON.stringify({pass:true,authenticatedBrowserGate:true,productionWritesFromCi:false,protectedBodiesCommitted:false}));
          NODE

      - name: Verify CI has no production mutation capability
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const source = await readFile('.github/workflows/corpus-scale-step8g-kenney-herbert-v8016-live.yml', 'utf8');
          if (!/permissions:\s*\n\s*contents:\s*read\b/.test(source)) throw new Error('CI_CONTENTS_PERMISSION_NOT_READ_ONLY');
          const forbidden = [
            ['wrangler', ' d1 execute', ' --remote'].join(''),
            ['curl ', '/api/step8g/v8016'].join(''),
            ['secrets', '.'].join('')
          ];
          for (const token of forbidden) if (source.includes(token)) throw new Error('PRODUCTION_MUTATION_CAPABILITY_PRESENT');
          console.log('PASS: v8016 CI has read-only repository permission, no secrets reference, and no production mutation command.');
          NODE

# Temporary branch-only B8 evidence and validation workflow; delete before PR.
name: Nutrition B8 priority audit
on:
  push:
    branches: [v1-nutrition-b8-residual-unlocks]
    paths:
      - .github/workflows/b8-priority-audit.yml
      - scripts/patch-b8-docs.py
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-nutrition-b8-residual-unlocks
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile B8 status documentation in working tree
        run: python scripts/patch-b8-docs.py
      - run: npm install --ignore-scripts
      - run: npm run validate
      - run: npm run report:nutrition-coverage
      - run: npm run report:recipe-universe
      - run: node scripts/report-nutrition-unlock-priorities.mjs
      - run: npm run verify:wikibooks-gate-f
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/culinary-http.log 2>&1 &
      - run: npm run test:browser
      - name: Download official USDA Foundation 2026-04 release
        run: |
          curl -fsSL --retry 3 -o /tmp/foundation.zip https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_csv_2026-04-30.zip
          rm -rf /tmp/foundation && mkdir -p /tmp/foundation
          unzip -q /tmp/foundation.zip -d /tmp/foundation
          find /tmp/foundation -name foundation_food.csv -print -quit
      - name: Discover bounded residual Foundation candidates
        run: |
          root="$(dirname "$(find /tmp/foundation -name foundation_food.csv -print -quit)")"
          node scripts/usda-b8-discover.mjs "$root" scripts/usda-b8-unlock-targets.json /tmp/usda-b8-candidates.json
      - name: Extract reviewed Foundation B8 candidates exactly
        run: |
          root="$(dirname "$(find /tmp/foundation -name foundation_food.csv -print -quit)")"
          node scripts/extract-usda-foundation-b3.mjs "$root" scripts/usda-foundation-b8-reviewed-targets.json /tmp/usda-foundation-b8-extract.json
          cat /tmp/usda-foundation-b8-extract.json
      - name: Download official USDA SR Legacy 2018-04 release
        run: |
          curl -fsSL --retry 3 -o /tmp/sr.zip https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_csv_2018-04.zip
          rm -rf /tmp/sr && mkdir -p /tmp/sr
          unzip -q /tmp/sr.zip -d /tmp/sr
          find /tmp/sr -name sr_legacy_food.csv -print -quit
      - name: Inspect exact SR Legacy raw-onion portions
        run: |
          root="$(dirname "$(find /tmp/sr -name sr_legacy_food.csv -print -quit)")"
          node scripts/usda-sr-legacy-b8-onion.mjs "$root" /tmp/usda-sr-legacy-b8-onion.json
      - run: git diff --check
      - name: Commit reconciled B8 docs after green candidate validation
        run: |
          if git diff --quiet -- README.md docs/ROADMAP.md docs/GATES.md docs/EUROPEAN_EVIDENCE.md docs/TESTING.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/GATES.md docs/EUROPEAN_EVIDENCE.md docs/TESTING.md
          git commit -m "Document Nutrition B8 first recipe unlock"
          git push origin HEAD:v1-nutrition-b8-residual-unlocks

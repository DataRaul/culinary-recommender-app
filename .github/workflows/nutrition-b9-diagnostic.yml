name: Nutrition B9 diagnostic

on:
  push:
    branches:
      - agent/nutrition-basmati-matvaretabellen-composition

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bounded B9 tests
        run: node --test tests/matvaretabellen-composition-b9.test.js
      - name: Report nutrition unlock priorities
        run: node scripts/report-nutrition-unlock-priorities.mjs

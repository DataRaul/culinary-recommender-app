name: Nutrition B20 cod evidence diagnostic

on:
  push:
    branches:
      - agent/nutrition-b20-cod-exact-composition

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Repair B20 cod diagnostic recipe identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Reconcile authored cod form from repository-native evidence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { AUTHORED_RECIPES } from './src/data/corpus-v1.js';
          const rows = AUTHORED_RECIPES
            .filter(recipe => recipe.ingredients.some(i => i.canonicalIngredientId === 'cod'))
            .map(recipe => ({
              recipeId: recipe.id,
              ingredient: recipe.ingredients.find(i => i.canonicalIngredientId === 'cod'),
              instructions: recipe.instructions.map(step => step.text)
            }));
          assert.equal(rows.length, 1);
          assert.equal(rows[0].recipeId, 'med_cod_chickpea_tomato_stew');
          assert.deepEqual([rows[0].ingredient.quantity, rows[0].ingredient.unit, rows[0].ingredient.preparation], [320, 'g', 'skinless fillet']);
          assert.ok(rows[0].instructions.some(text => /cod/i.test(text)));
          assert.ok(rows[0].instructions.some(text => /until cooked|cook/i.test(text)), 'recipe must establish cooking after ingredient declaration');
          console.log(JSON.stringify(rows, null, 2));
          NODE
      - name: Freeze exact official Matvaretabellen 09.068 source row
        run: |
          curl --fail --silent --show-error --retry 3 https://www.matvaretabellen.no/api/en/foods.json -o /tmp/matvaretabellen-foods.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const payload = JSON.parse(fs.readFileSync('/tmp/matvaretabellen-foods.json', 'utf8'));
          const foods = payload.foods || payload;
          const food = foods.find(row => (row.foodId || row.id) === '09.068');
          assert.ok(food, 'Matvaretabellen 09.068 not found');
          assert.equal(food.foodName, 'Cod, raw');
          const tracked = Object.fromEntries(['Protein','Karbo','Fett','Fiber'].map(id => [id, food.constituents.find(c => c.nutrientId === id) || null]));
          for (const [id, row] of Object.entries(tracked)) assert.ok(row && Object.hasOwn(row, 'quantity'), `tracked field ${id} lacks a published quantity`);
          console.log('===B20_COD_09_068_BEGIN===');
          console.log(JSON.stringify({
            foodId: food.foodId,
            foodName: food.foodName,
            latinName: food.latinName,
            calories: food.calories,
            energy: food.energy,
            foodGroupId: food.foodGroupId,
            langualCodes: food.langualCodes,
            portions: food.portions,
            uri: food.uri,
            tracked
          }, null, 2));
          console.log('===B20_COD_09_068_END===');
          NODE
      - name: Verify official cod page identity and inspect FoodEx2/classification/source details
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/matvaretabellen-foods.json', 'utf8'));
          const food = (payload.foods || payload).find(row => (row.foodId || row.id) === '09.068');
          fs.writeFileSync('/tmp/cod-uri.txt', food.uri);
          console.log(food.uri);
          NODE
          curl --fail --silent --show-error --retry 3 "$(cat /tmp/cod-uri.txt)" -o /tmp/cod.html
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/cod.html').read_text(errors='replace')
          normalized = re.sub(r'\s+', ' ', html)
          for token in ['09.068', 'Cod, raw']:
              if token not in normalized:
                  raise SystemExit(f'official page missing identity token: {token}')
          print('===B20_COD_PAGE_MATCHES_BEGIN===')
          for pattern in [r'.{0,220}FoodEx2.{0,420}', r'.{0,220}Gadus.{0,420}', r'.{0,220}skinless.{0,420}', r'.{0,220}fillet.{0,420}', r'.{0,220}MI0181.{0,300}', r'.{0,220}>Protein<.{0,500}', r'.{0,220}>Fiber<.{0,500}', r'.{0,220}>Fett<.{0,500}']:
              found = re.findall(pattern, normalized, flags=re.I)
              for item in found[:5]: print(item)
          print('===B20_COD_PAGE_MATCHES_END===')
          PY

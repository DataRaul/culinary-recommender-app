name: Nutrition coverage audit

on:
  push:
    branches:
      - v1-nutrition-coverage-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node scripts/report-nutrition-coverage.mjs > nutrition-coverage-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: nutrition-coverage-audit
          path: nutrition-coverage-audit.json
          retention-days: 1

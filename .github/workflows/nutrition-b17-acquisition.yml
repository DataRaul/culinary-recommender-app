name: Nutrition B17 exact evidence acquisition

on:
  push:
    branches:
      - agent/nutrition-b17-exact-evidence-acquisition

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Fetch official Matvaretabellen 2026 API and inspect exact candidates
        run: |
          curl --fail --silent --show-error --retry 3 https://www.matvaretabellen.no/api/en/foods.json -o /tmp/matvaretabellen-foods.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/matvaretabellen-foods.json', 'utf8'));
          const foods = payload.foods || payload;
          const terms = ['tahini', 'garam', 'masala', 'paprika', 'lentil', 'turkey', 'cottage cheese', 'salt', 'tortilla', 'bulgur', 'red onion'];
          const compact = food => ({
            foodId: food.foodId || food.id,
            foodName: food.foodName,
            portions: food.portions || [],
            foodEx2: food.foodEx2 || food.foodex2 || null,
            facets: food.facets || null
          });
          console.log('===EXACT_ID_06_702===');
          console.log(JSON.stringify(compact(foods.find(f => (f.foodId || f.id) === '06.702')), null, 2));
          for (const term of terms) {
            const matches = foods.filter(f => (f.foodName || '').toLowerCase().includes(term)).map(compact);
            console.log(`===TERM:${term}===`);
            console.log(JSON.stringify(matches, null, 2));
          }
          NODE
      - name: Inspect authored unresolved target units after B16
        run: |
          node --input-type=module <<'NODE'
          import { AUTHORED_RECIPES } from './src/data/corpus-v1.js';
          import { publicNutritionSource } from './src/domain/nutrition.js';
          import { buildNutritionCoverageAudit } from './src/domain/nutrition-coverage-audit.js';
          const audit = buildNutritionCoverageAudit(AUTHORED_RECIPES, publicNutritionSource);
          const targets = new Set(['tahini','garam_masala','smoked_paprika','lentils','turkey_mince','cottage_cheese','salt','tortilla','bulgur','red_onion']);
          const rows = [];
          for (const detail of audit.recipeDetails) {
            for (const blocker of detail.blockers) {
              if (targets.has(blocker.ingredientId)) rows.push({ recipeId: detail.recipeId, ingredientId: blocker.ingredientId, reason: blocker.reason, quantity: blocker.quantity ?? null, unit: blocker.unit ?? null, quantityEvidence: blocker.quantityEvidence ?? null });
            }
            for (const gap of detail.nutrientFieldGaps) {
              if (targets.has(gap.ingredientId)) rows.push({ recipeId: detail.recipeId, ingredientId: gap.ingredientId, reason: `missing_${gap.nutrientKey}`, quantity: null, unit: null });
            }
          }
          console.log('===AUTHORED_TARGET_BLOCKERS===');
          console.log(JSON.stringify(rows, null, 2));
          NODE
